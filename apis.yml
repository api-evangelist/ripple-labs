- aid: ripple-labs:ripple-labs-liquidations-api
  name: Ripple Labs Liquidations API
  description: >-
    Use these operations to retrieve liquidations from the Smart Liquidation service.


    | Operation | Method | Description |

    | -- | -- | -- |

    | [Get liquidations](#operation/getLiquidations)   | GET       | List all liquidations by date range.    |

    | [Get liquidation by Liquidation Id](#operation/getLiquidationById)  | GET       | Gets a liquidation
    by `Id`. |

    | [Get liquidation by RippleNet Payment Id](#operation/getLiquidationsByRipplenetPaymentId) | GET
    | Gets a liquidation by `ripplenet_payment_id`. |


    **Note:** To configure liquidation, contact your RippleNet liaison.


    ### Authentication with Smart Liquidation Service


    All API operations require a bearer access token for your target environment.<br>Learn how to [request
    the access token](/products/payments-odl/api-docs/ripplenet/best-practices/authentication/#request-the-access-token).


    ### Domain prefixes with Smart Liquidation Service


    | **Environment** | **Domain Prefix** | **Request URL** |

    | --- | --- | --- |

    | **Test** | `liquidation-test.pub.prod` | `https://liquidation-test.pub.prod.ripplenet.com` |

    | **Production** | `liquidation.pub.prod` | `https://liquidation.pub.prod.ripplenet.com` |
  humanURL: https://docs.ripple.com/products/stablecoin/api/get-started
  baseURL: https://api.ripple.com
