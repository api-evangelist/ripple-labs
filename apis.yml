- aid: ripple-labs:ripple-labs-platform-accounts-api
  name: Ripple Labs Platform accounts API
  description: >-
    Use these operations to configure your RippleNet platform accounts.


    | Operation | Method | Description |

    | -- | -- | -- |

    | [Create platform](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/createplatform)                                         |
    POST      | Creates a RippleNet platform that represents a financial entity that holds accounts in
    the real world. For example, a Bank, Exchange, or Wallet provider.  |

    | [Get all platforms](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getallplatforms)                                          |
    GET       | Returns a list of all active RippleNet platforms. |

    | [Get platform by platform ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformbyplatformid)                             |
    GET       | Get a RippleNet platform by its platform ID. |

    | [Update platform](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/updateplatform)                                         |
    PUT       | Updates a RippleNet platform. |

    | [Delete platform by platform ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/deleteplatformbyplatformid)                  |
    DELETE    | Deletes a RippleNet platform by its platform ID. |

    | [Create platform account](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/createplatformaccount)                          |
    POST      | Creates a RippleNet platform account, which represents a real-world account owned by a
    financial entity. |

    | [Get platform accounts](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccounts)                              |
    GET       | Returns a paged list of all active RippleNet platform accounts. |

    | [Get platform account by platform account ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountbyplatformaccountid)       |
    GET       | Gets a RippleNet platform account by its platform account ID. |

    | [Update platform account](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/updateplatformaccount)                          |
    PUT       | Updates a RippleNet platform account. |

    | [Delete platform account by platform account ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/deleteplatformaccountbyplatformaccountid)
    | DELETE    | Deletes a RippleNet platform account by its platform account ID. |

    | [Get platform accounts balances](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountsbalances)             |
    GET       | Get balances for local Platform Accounts |

    | [Get platform account statement](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountstatement)             |
    GET       | Get statement for a specified Platform Account |
