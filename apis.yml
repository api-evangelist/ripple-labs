aid: ripple-labs
name: Ripple Labs
description: 'Ripple (legally Ripple Labs Inc.) is a blockchain and crypto-enabled financial
  infrastructure company whose developer surface spans Ripple Payments (RippleNet Server API,
  On-Demand Liquidity, Payments Direct, Report Service, and Smart Liquidation), the RLUSD
  stablecoin "Ripple Mint" API, and Palisade Wallet-as-a-Service for institutional digital-asset
  custody. Its APIs let banks, fintechs, and enterprises move money cross-border, mint and
  redeem the RLUSD stablecoin, run treasury and reporting, and custody digital assets. Ripple
  also stewards the open-source XRP Ledger (documented at xrpl.org) with first-party client
  libraries xrpl.js and xrpl-py. Product documentation lives at docs.ripple.com; the legacy
  ripplelabs.com domain redirects to ripple.com.'
