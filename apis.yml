- aid: ripple-labs:ripple-labs-transfers-api
  name: Ripple Labs Transfers API
  description: >-
    Use these operations to manage your transfers.


    | Operation | Method | Description |

    | -- | -- | -- |

    | [Get transfers](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransfers)                 |
    GET    | Gets a list of transfers. |

    | [Get transfer estimate](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransferestimate)  |
    GET    | Get an estimate of the fee to make an "outbound" transfer from an exchange (connected to
    xRapid) to an another account outside of RippleNet (such as a bank account).  |

    | [Get transfer by ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransferbyid)         |
    GET    | Gets a transfer by ID. |

    | [Execute transfer](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/executetransfer)           |
    POST   | Transfers funds between accounts.  |

    | [Complete transfer](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/completetransfer)         |
    POST   | Updates the state of a transfer to `COMPLETED`. |

    | [Add transfer labels](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/addtransferlabels)       |
    PUT    | Adds a list of labels to the transfer. To retrieve transfers by label, see [Get transfers](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransfers)
    |

    | [Delete transfer labels](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/deletetransferlabels)
    | DELETE | Deletes one or more existing labels from the transfer. |
