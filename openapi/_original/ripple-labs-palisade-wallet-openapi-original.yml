    xrpv2AMMDepositFlag:
      type: string
      enum:
        - DEPOSIT_LP_TOKEN
        - DEPOSIT_SINGLE_ASSET
        - DEPOSIT_TWO_ASSET
        - DEPOSIT_ONE_ASSET_LP_TOKEN
        - DEPOSIT_LIMIT_LP_TOKEN
        - DEPOSIT_TWO_ASSET_IF_EMPTY
    xrpv2AMMWithdrawFlag:
      type: string
      enum:
        - WITHDRAW_LP_TOKEN
        - WITHDRAW_WITHDRAW_ALL
        - WITHDRAW_ONE_ASSET_WITHDRAW_ALL
        - WITHDRAW_SINGLE_ASSET
        - WITHDRAW_TWO_ASSET
        - WITHDRAW_ONE_ASSET_LP_TOKEN
        - WITHDRAW_LIMIT_LP_TOKEN
    xrpv2AccountSetFlag:
      type: string
      enum:
        - ACCOUNT_TXN_ID
        - ALLOW_TRUSTLINE_CLAWBACK
        - AUTHZ_NFTOKEN_MINTER
        - DEFAULT_RIPPLE
        - DEPOSIT_AUTH
        - DISABLE_MASTER
        - DISALLOW_INCOMING_CHECK
        - DISALLOW_INCOMING_PAY_CHAN
        - DISALLOW_INCOMING_TRUSTLINE
        - DISALLOW_XRP
        - GLOBAL_FREEZE
        - NO_FREEZE
        - REQUIRE_AUTH
        - REQUIRE_DEST
    xrpv2Asset:
      type: object
      properties:
        asset:
          type: string
          example: USD
          description: The asset symbol
        issuer:
          type: string
          example: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          description: The contract/issuing address. Optional if asset is XRP.
      required:
        - asset
    xrpv2CurrencyAmount:
      type: object
      properties:
        value:
          type: string
          example: '155.672'
          description: The quantity of the asset
        asset:
          type: string
          example: USD
          description: The asset symbol
        issuer:
          type: string
          example: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          description: The contract/issuing address. Optional if asset is XRP.
      required:
        - value
        - asset
    xrpv2OfferCreateFlags:
      type: string
      enum:
        - PASSIVE
        - IMMEDIATE_OR_CANCEL
        - FILL_OR_KILL
        - SELL
    xrpv2SignerEntry:
      type: object
      properties:
        account:
          type: string
        signerWeight:
          type: integer
          format: int64
    xrpv2TrustSetFlag:
      type: string
      enum:
        - SETF_AUTH
        - SET_NORIPPLE
        - UNSET_NORIPPLE
        - SET_FREEZE
        - UNSET_FREEZE
        - SET_DEEP_FREEZE
        - UNSET_DEEP_FREEZE
servers:
  - url: https://api.sandbox.palisade.co
    description: Sandbox server (uses TESTNET data, private keys and accounts)
  - url: https://api.palisade.co
    description: Palisade server (uses MAINNET data, private keys and accounts)
