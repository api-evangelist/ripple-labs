      type: object
    v2TimestampFilter:
      type: object
      properties:
        eq:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Exact timestamp match
        notEq:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Not equal to timestamp
        before:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Before this timestamp
        after:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: After this timestamp
        gte:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Greater than or equal to timestamp
        lte:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Less than or equal to timestamp
        between:
          allOf:
            - $ref: '#/components/schemas/TimestampFilterTimestampRange'
            - description: Between two timestamps (inclusive)
        isNull:
          type: boolean
          description: Check if field is null
        relativeDays:
          type: integer
          format: int32
          example: -7
          description: Relative days from now (negative for past, positive for future)
    v2TransactionActionFilter:
      type: object
      properties:
        eq:
          allOf:
            - $ref: '#/components/schemas/transactionsv2TransactionAction'
            - description: Exact transaction type match
        notEq:
          allOf:
            - $ref: '#/components/schemas/transactionsv2TransactionAction'
            - description: Exclude this transaction type
        in:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionAction'
          description: Transaction type is in this list
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionAction'
          description: Transaction type is not in this list
    v2TransactionFilter:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/v2TransactionStatusFilter'
            - description: >-
                Filter by transaction status using enum names such as CONFIRMED
                or FAILED
        blockchain:
          allOf:
            - $ref: '#/components/schemas/v2BlockchainFilter'
            - description: >-
                Filter by blockchain using common.v2.Blockchain enum names such
                as ETHEREUM or BITCOIN
        assetSymbol:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: Filter by asset symbol (e.g. ETH, BTC, USDC)
        createdAt:
          allOf:
            - $ref: '#/components/schemas/v2TimestampFilter'
            - description: >-
                Filter by creation timestamp; supports before/after, between,
                relative_days
        qty:
          allOf:
            - $ref: '#/components/schemas/v2NumericFilter'
            - description: >-
                Filter by transferred quantity as an arbitrary precision numeric
                string; supports eq/not_eq/in/not_in/gt/gte/lt/lte.
        originAddress:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: Filter by origin (sending) address (case-insensitive)
        destinationAddress:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: Filter by destination (receiving) address (case-insensitive)
        transactionId:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: >-
                Search by Palisade transaction ID (UUID). Supports
                eq/in/contains.
        transactionHash:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: >-
                Search by on-chain transaction hash (case-insensitive). Supports
                eq/in only.
        externalId:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: >-
                Search by customer-assigned external transaction ID. Supports
                eq/in/contains.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/v2TimestampFilter'
            - description: >-
                Filter by last-update timestamp; supports before/after, between,
                relative_days. Mirrors the updated_at sort field.
        correlationId:
          allOf:
            - $ref: '#/components/schemas/v2StringFilter'
            - description: Filter by correlation ID. Supports eq/in/contains.
        type:
          allOf:
            - $ref: '#/components/schemas/v2TransactionActionFilter'
            - description: >-
                Filter by transaction type using enum names such as
                PALISADE_TRANSFER or WEB3_SIGN
    v2TransactionStatusFilter:
      type: object
      properties:
        eq:
          allOf:
            - $ref: '#/components/schemas/transactionsv2TransactionStatus'
            - description: Exact transaction status match
        notEq:
          allOf:
            - $ref: '#/components/schemas/transactionsv2TransactionStatus'
            - description: Exclude this transaction status
        in:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionStatus'
          description: Transaction status is in this list
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionStatus'
          description: Transaction status is not in this list
    v2TransactionStatusUpdate:
