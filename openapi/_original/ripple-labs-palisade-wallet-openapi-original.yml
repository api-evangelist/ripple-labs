        customerSpendableQuantity:
          type: string
          example: '9.25'
          description: >-
            Customer-owned native quantity available for sweep decisions after
            subtracting frozen amounts.
          readOnly: true
        palisadeFeeCreditQuantity:
          type: string
          example: '0.5'
          description: >-
            Service-owned native fee credit held in the wallet for network fee
            funding.
          readOnly: true
        consumedFeeQuantity:
          type: string
          example: '0.01'
          description: >-
            Cumulative service-owned fee credit consumed by network fees in the
            current ledger epoch.
          readOnly: true
        chainReserveQuantity:
          type: string
          example: '0'
          description: Chain-specific reserve quantity that must remain on-chain.
          readOnly: true
        onChainQuantity:
          type: string
          example: '10.75'
          description: >-
            Current on-chain native quantity tracked for this wallet and native
            asset.
          readOnly: true
        ownershipTotalQuantity:
          type: string
          example: '10.75'
          description: >-
            Service-computed total ownership quantity still expected to be
            present on-chain.
          readOnly: true
        discrepancyQuantity:
          type: string
          example: '0'
          description: >-
            Service-computed difference between on-chain quantity and ownership
            total quantity.
          readOnly: true
        reconciled:
          type: boolean
          example: true
          description: >-
            Whether discrepancy_quantity is numerically zero after decimal
            normalization.
          readOnly: true
        snapshotId:
          type: string
          example: native-own-01HZY8W8Y5Q5D3M7XQ5R0A9K4E
          description: >-
            Opaque identifier for this assembled ownership and on-chain
            snapshot.
          readOnly: true
        ledgerEpochId:
          type: string
          example: epoch-2026-06-10T11:00:00Z
          description: Opaque identifier for the ledger epoch used by cumulative fields.
          readOnly: true
        ledgerStartedAt:
          type: string
          format: date-time
          example: '2026-06-10T11:00:00Z'
          description: Start time of the ledger epoch used by cumulative fields.
          readOnly: true
        ledgerEpochSequence:
          type: integer
          format: uint64
          example: 42
          description: >-
            Monotonically increasing ledger epoch sequence for the request
            tuple.
          readOnly: true
