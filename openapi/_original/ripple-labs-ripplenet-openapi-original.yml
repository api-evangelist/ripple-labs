          example: Last name must be corrected
          description: >
            Free-form details that describe the `sub_state` of the payment, for
            example, `with courier heading to payout location`.


            Displays as the `value` value in the receiving node's
            `user_info.executed` array.
        info:
          type: object
          properties: {}
          description: Provide one or more arbitrary key/value pairs.
          example:
            last_name: Gonzales
