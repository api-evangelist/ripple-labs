          description: >-
            Set to the maximum balance allowed for the nostro account. Updates
            the value of `maximum_allowed_balance` for the account. Allows owner
            of nostro account to decrease the account maximum and override the
            value set by partner.
        core_ledger_ref:
          type: string
          example: bitso
          description: >-
