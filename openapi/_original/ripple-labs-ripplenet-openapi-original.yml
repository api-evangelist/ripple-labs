    QuoteRos:
      type: object
      required:
        - amount
        - created_at
        - currency_code
        - currency_code_filter
        - expires_at
        - liquidity_warning
        - price_guarantee
        - quote_elements
        - quote_id
        - receiver_address
        - sender_address
        - service_type
        - type
      properties:
        quote_id:
          type: string
          format: uuid
          example: 480e3a6f-3bcd-48cd-9ce9-9d940aa3c9c6
          description: Unique identifier for the quote.
        created_at:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            Date and time at which the quote was created, as an ISO-8601
            timestamp in UTC.
        expires_at:
          type: string
          format: date-time
          example: '2019-04-06T20:33:35Z'
          description: >-
            Date and time after which the quote and its pricing expire, as an
            ISO-8601 timestamp in UTC. Defaults to 300s/300000ms.
        type:
          type: string
          description: >-
            Indicates how the amount field should be treated for calculating
            quote values. Valid values are `SENDER_AMOUNT`,
            `SENDER_INSTITUTION_AMOUNT`, `RECEIVER_INSTITUTION_AMOUNT`, and
            `RECEIVER_AMOUNT`.
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
        price_guarantee:
          type: string
          description: >-
            Indicates whether a quote's pricing is `INDICATIVE` or `FIRM`. An
            `INDICATIVE` quote allows for price movements between quote issuance
            and payment execution, such that the quoted amount and delivered
            amount may differ. A `FIRM` quote ensures that the quoted and
            delivered payment amounts are equal. Defaults to `FIRM`.
        sender_address:
          type: string
          example: new_york@rn.us.ny.new_york
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: new_york@rn.us.ny.new_york
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: string
          example: '100'
          description: Amount to be sent or received, depending on the `type` value.
        currency_code:
          type: string
          example: USD
          description: Currency code for the `amount` value.
        currency_code_filter:
          type: string
          example: EUR
          description: >-
            Currency code that can be used to filter quotes at the opposite end
            of the quote request. For example, you can filter by this currency
            code to find the receiving currency for a quote with a
            `SENDER_AMOUNT` quote_type. If not sent in the request, this field
            value is set to `null`.
        service_type:
          type: string
          description: Returns `null`.
        quote_elements:
          type: array
          description: >-
            Transfer and exchange elements. A transfer element represents a
            movement of funds between two accounts. An exchange element
            represents the exchange of currencies between two accounts.
          items:
            $ref: '#/components/schemas/QuoteElementRos'
        liquidity_warning:
          type: string
          description: >-
            Triggered when a quote causes an account to go below its
            `minimum_allowed_balance`. Otherwise, this field value is set to
            `null`.
        payment_method:
          type: string
          description: Payment method (payment outlet) to use for this quote.
      description: >-
        JSON response object that represents a quote for a proposed payment or
        return payment.
    QuoteElementRos:
      type: object
      required:
        - quote_element_id
        - quote_element_order
        - quote_element_type
        - receiver_address
        - receiving_amount
        - receiving_fee
        - sender_address
        - sending_amount
        - sending_fee
      properties:
        quote_element_id:
          type: string
          format: uuid
          example: 480e3a6f-3bcd-48cd-9ce9-9d940aa3c9c6
          description: Unique identifier for the quote element.
        quote_element_type:
          type: string
          description: >-
            Type of quote element. Valid values are `EXCHANGE`, `TRANSFER`,
            `EXCHANGE_TRADE`, and `CRYPTO_TRANSFER`. <p><ul> <li>`TRANSFER`
            represents the movement of funds between two accounts.</li>
            <li>`EXCHANGE` represents the exchange of currencies between two
            accounts.</li> <li>`EXCHANGE_TRADE` represents the exchange of fiat
            to digital currency on a digital exchange.</li>
            <li>`CRYPTO_TRANSFER` represents the movement of digital funds
            between two digital exchanges.</li> </ul></p>
          enum:
            - TRANSFER
            - EXCHANGE
            - EXCHANGE_TRADE
            - CRYPTO_TRANSFER
        quote_element_order:
          type: string
          description: >-
            Order of each quote element along the liquidity path. If a quote
            includes five quote elements, each one is enacted according to its
            quote_element_order number to make the proposed payment.
        sender_address:
          type: string
          example: new_york@rn.us.ny.new_york
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: new_york@rn.us.ny.new_york
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        sending_amount:
          type: number
          example: 100
          description: Amount the sender is sending.
        receiving_amount:
          type: number
          example: 97
          description: Amount the receiver is receiving.
        sending_fee:
          type: number
          example: 2
          description: >-
            Fees the sender is charging. When `quote_element_type` is set to
            `EXCHANGE`, this field value is always set to `0`.
        receiving_fee:
          type: number
          example: 1
          description: >-
            Fees the receiver is charging. When `quote_element_type` is set to
            `EXCHANGE`, this field value is always set to `0`.
        sending_currency_code:
          type: string
          example: USD
          description: >-
            Currency code of the sending amount. Included in quote elements with
            `quote_element_type` set to `EXCHANGE`.
        receiving_currency_code:
          type: string
          example: INR
          description: >-
            Currency code of the receiving amount. Included in quote elements
            with `quote_element_type` set to `EXCHANGE`.
        fx_rate:
          $ref: '#/components/schemas/FXRate'
        transfer_currency_code:
          type: string
          description: >-
            Currency code of the transfer. Included in quote elements with
            `quote_element_type` set to `TRANSFER`.
      description: >-
        JSON object that provides transfer and exchange elements used to provide
        the quote. A transfer element represents the transfer of currency
        between two accounts. An exchange element represents the exchange of
        currencies between two accounts.
