            The RippleNet account name and address that you want to return a
            statement for. Use the format `accountname@ripplenetaddress`. For
            example, `san_francisco@rn.us.ca.san_francisco`.
          required: true
          schema:
            type: string
        - name: start-date
          in: query
          description: >-
            The lower bound of the date-time range you want to return statement
            information for, as an ISO-8601 timestamp in UTC. For example,
            `2018-08-06T23:13:55.997Z`.
          required: true
          schema:
            type: string
        - name: end-date
          in: query
          description: >-
            The upper bound of the date-time range you want to return statement
            information for, as an ISO-8601 timestamp in UTC For example,
            `2018-08-06T23:15:13.218Z`.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: >
            The page number for [paginated
            results](/products/payments-odl/api-docs/ripplenet/best-practices/pagination/).
            The value is zero-based, where `0` represents the first page.<br/>

            Set it to `0` to get the first page of results.
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: >
            Number of payment and transfer objects to return per page, with a
            limit of 100 per page.


            For example, a query with `"size": "100"` results in `"totalPages":
            "43"` when the query result is `"totalElements": "4290"`.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Successfully returns an account statement.
          content:
            application/json:
              schema:
