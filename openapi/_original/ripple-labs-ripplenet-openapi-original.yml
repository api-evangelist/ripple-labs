          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /quote_collections/return:
    post:
      tags:
        - Non-orchestration payments
      summary: Create quote to return payment
      description: >
        Creates a collection of quotes that can be used to return a payment.


        The receiver can make this request while the payment is in states
        `EXECUTED`, `COMPLETED`, or `FAILED`. When the returned payment is
        successfully moved to the `COMPLETED` state, the original payment is
        moved to the `RETURNED` state.


        **Note**: Currently, when making a Return Payment to a RippleNet Cloud
        account on a RippleNet ledger, the RippleNet user must lock and complete
        the payment. This means that the RippleNet user takes all action on the
        return: Get and Accept Quote, Lock, Settle, and Complete payment.
      operationId: createQuoteToReturnPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReturnQuoteRequest'
        required: true
      responses:
        '200':
          description: Successfully returned a collection of quotes to return a payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteCollection'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
        '404':
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
        '500':
          description: >-
            Server Error - an internal error occured while making Return Quote
            calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /quote_collections/reversal:
    post:
      tags:
        - Non-orchestration payments
      summary: Create quote to reverse payment
      description: >
        Creates a quote collection containing at most one quote that can be used
        to reverse a payment.


        The receiver can make this request while the payment is in states
        `EXECUTED`, `COMPLETED`, or `FAILED`. When the returned payment is
        successfully moved to the `COMPLETED` state, the original payment is
        moved to the `RETURNED` state.


        **Note**: Currently, when making a Reversal Payment to a RippleNet Cloud
        account on a RippleNet ledger, the RippleNet user must lock and complete
        the payment. This means that the RippleNet user takes all action on the
        reverse: Get and Accept Quote, Lock, Settle, and Complete payment.
      operationId: createQuoteToReversePayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReversalQuoteRequest'
        required: true
      responses:
        '200':
          description: Successfully returned a collection of quotes to return a payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteCollection'
        '400':
          description: >-
            Original payment has previously been returned, reversed, or is in an
            invalid payment state for reversal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
        '404':
          description: Original payment was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
        '500':
          description: Reversals are disabled on this instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /request_for_payment:
    get:
      tags:
        - Request for payment
      summary: Get requests for payment
      description: Gets requests for payment that match the query parameters.
      operationId: getRequestsForPayment
      parameters:
        - name: end_to_end_id
          in: query
          description: >-
            Optional parameter to filter results matching this `endToEndId`
            value.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: State by which to filter results.
          required: false
          schema:
            type: string
            enum:
              - REQUESTED
              - ACCEPTED
              - FAILED
        - name: sender_address
          in: query
          description: Field to filter results matching this `senderAddress` value.
          required: false
          schema:
            type: string
        - name: receiver_address
          in: query
          description: Field to filter results matching this `receiverAddress` value.
          required: false
          schema:
            type: string
        - name: payment_id
          in: query
          description: Field to filter results matching this `paymentId` value.
          required: false
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          description: >-
            Filters for requests for payment whose `range_field` column value is
            before this specified time stamp (not inclusive). You can also
            specify `after` to create a time range between `after` and `before`.
            If before is specified, `range_field` must also be specified
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >-
            Filters for requests for payment whose `range_field` column value is
            after this specified time stamp (not inclusive). You can also
            specify `before` to create a time range between `after` and
            `before`. If `after` is specified, `range_field` must also be
            specified.
          required: false
          schema:
            type: string
        - name: range_field
          in: query
          description: >-
            Designates the column name of the requests for payment database
            table that is used for filtering payments before/after/between time
            stamps. For example, if you specify `range_field`=`MODIFIED_AT`, you
            would specify a time stamp (in the 24 character ISO 8601
            YYYY-MM-DDTHH:mm:ss.sssZ format used in request for payment objects)
            as the value for `before` and/or `after` to fetch request for
            payment before, after, or between the specified time range(s) (not
            inclusive). If `range_field` is specified, `before` and/or `after`
            must also be specified.
          required: false
          schema:
            type: string
            enum:
              - CREATED_AT
              - MODIFIED_AT
        - name: sort_field
          in: query
          description: Field to use to sort results.
          required: false
          schema:
            type: string
            enum:
              - CREATED_AT
              - MODIFIED_AT
        - name: sort_direction
          in: query
          description: Sorts result according to the specified direction.
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
        - name: page
          in: query
          description: Zero-based index of the page number of results.
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: The number of payments per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: >-
            Successfully retrieves requests for payment matching query
            parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetNodeRequestsForPayment'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
    post:
      tags:
        - Request for payment
      summary: Send request for payment
      description: Sends a new request for payment.
      operationId: sendRequestForPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RippleNetNodeRequestForPaymentRequest'
        description: The request object to initiate a new request for payment.
        required: true
      responses:
        '200':
          description: >-
            Successfully sent a request for payment resulting in a request for
            payment object in the `REQUESTED` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetNodeRequestForPayment'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
