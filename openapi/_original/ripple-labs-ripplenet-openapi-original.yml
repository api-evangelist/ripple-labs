          enum:
            - TOTAL_RECEIVED
            - TOTAL_RECEIVED_MINUS_FEES
          x-enumDescriptions:
            TOTAL_RECEIVED: >-
              Indicates that the sender of the return payment will send the
              amount they received
            TOTAL_RECEIVED_MINUS_FEES: >-
              Indicates that the sender of the return payment will send the
              amount they received minus the receiving fees
        custom_fee:
          type: number
