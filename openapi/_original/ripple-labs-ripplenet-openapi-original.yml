              amounts.
            AM03: >-
              Specified message amount is a non-processable currency outside of
              existing agreement.<br/><br/><b>Error handling</b><br/>The Sending
              Member or the Originator must adapt their internal RippleNet
              payment initiation process to ensure they do not initiate payments
              in unsupported currency.
            AM04: >-
              Amount of funds available to cover specified message amount is
              insufficient. <br /><br />This error may occur due to the
              following reasons:<ul><li>The Originator's account does not have
              sufficient funds to debit the full amount of the
              payment.</li><li>There are insufficient funds in the
              Sending/Originating Bank's nostro settlement account at the Local
              Clearing/Receiver/Beneficiary bank to process the payment.
              </li></ul><br/><br/><b>Error handling</b><br/>If the Originator's
              account previously had insufficient funds, the Sending Member may
              reissue the payment after the Originator ensures that their
              account contains the funds required to process the payment.<br
              /><br />If the Sending/Originating Bank's nostro settlement
              account previously had insufficient funds, they can reissue the
              payment after ensuring that their settlement account contains
              sufficient funds to process the payment.
            AM11: Transaction currency information is invalid or missing.
            AM13: >-
              Transaction amount exceeds limits set by clearing
              system.<br/><br/><b>Error handling</b><br/>The Sending Member or
              the Originator must adapt their internal RippleNet payment
              initiation process to ensure they do not transfer incorrect
              amounts.
            AM14: >-
              Transaction amount exceeds limits agreed between bank and
              client.<br/><br/><b>Error handling</b><br/>The Beneficiary may
              request the Originator to initiate a payment whose transaction
              amount is within the agreed limits. Further, the Sending Member or
              the Originator must adapt their internal RippleNet payment
              initiation process to ensure they do not transfer incorrect
              amounts.
            AM15: >-
              Transaction amount below minimum set by clearing
              system.<br/><br/><b>Error handling</b><br/>The Beneficiary may
              request the Originator to initiate a payment whose transaction
              amount is within the agreed limits. Further, the Sending Member or
              the Originator must adapt their internal RippleNet payment
              initiation process to ensure they do not transfer incorrect
              amounts.
            AM21: Transaction amount exceeds limits agreed between bank and client.
            AM22: >-
              Unable to apply zero amount to designated account. For example,
              where the rules of a service allow the use of zero amount
              payments, however the back-office system is unable to apply the
              funds to the account. If the rules of a service prohibit the use
              of zero amount payments, then code AM01 is used to report the
              error condition.
            BE01: >-
              Identification of end customer is not consistent with associated
              account number (formerly CreditorConsistency). <br />This error
              typically occurs because the Originator entered an incorrect
              Beneficiary account number while initiating the
              payment.<br/><br/><b>Error handling</b><br/>The Sending Member may
              introduce additional prompts in the user interface during payment
              initiation to ensure that the Originator verifies the
              Beneficiary's account number.
            BE04: >-
              Specification of creditor's address, which is required for
              payment, is missing/not correct (formerly
              IncorrectCreditorAddress).<br/><br/><b>Error handling</b><br/>If
              the Beneficiary address is invalid, the Sending Member may repair
              the transaction by providing the correct Beneficiary address. <br
              /><br />If the Beneficiary address is missing, the Originator may
              reissue the payment with the Beneficiary address specified.
            BE05: >-
              Party who initiated the message is not recognized by the end
              customer.
            BE06: >-
              End customer specified is not known at associated Sort/National
              Bank Code or does no longer exist in the books.
            BE07: >-
              Specification of debtor's address, which is required for payment,
              is missing/not correct.<br/><br/><b>Error handling</b><br/>If the
              Originator's address is invalid, the Sending Member may repair the
              transaction by providing the correct Originator address. <br /><br
              /> If the Originator's address is missing, the Originator may
              reissue the payment with their address specified.
            BE08: >-
              Debtor name is missing.<br/><br/><b>Error handling</b><br/>If the
              Originator's name is invalid, the Sending Member may repair the
              transaction by providing the correct Originator name. <br /><br />
              If the Originator's name is missing, the Originator may reissue
              the payment with their name specified.
            BE09: >-
              Country code is missing or Invalid. Generic usage if cannot
              specifically identify debtor or creditor.
            BE10: >-
              Debtor country code is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the Originator's country code is invalid, the
              Sending Member may repair the transaction by providing the correct
              Originator country code. <br /><br /> If the Originator's country
              code is missing, the Originator may reissue the payment with the
              country code specified.
            BE11: >-
              Creditor country code is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the Beneficiary's country code is invalid, the
              Sending Member may repair the transaction by providing the correct
              Beneficiary country code. <br /><br /> If the Beneficiary's
              country code is missing, the Originator may reissue the payment
              with the Beneficiary country code specified.
            BE12: >-
              Country code of residence is missing or Invalid. This generic
              error code should be used only if the relevant party is not
              clearly identifiable or specified.
            BE13: >-
              Country code of debtor's residence is missing or
              Invalid.<br/><br/><b>Error handling</b><br/>If the country code
              for Originator's country of residence is invalid, the Sending
              Member may repair the transaction by providing the correct country
              code.<br /><br /> If the country code for Originator's country of
              residence is missing, the Originator may reissue the payment with
              the country code specified.
            BE14: >-
              Country code of creditor's residence is missing or
              Invalid.<br/><br/><b>Error handling</b><br/>If the country code
              for Beneficiary's country of residence is invalid, the Sending
              Member may repair the transaction by providing the correct country
              code.<br /><br /> If the country code for Beneficiary's country of
              residence is missing, the Originator may reissue the payment with
              the Beneficiary country code specified.
            BE15: >-
              Identification code missing or invalid. Generic usage if cannot
              specifically identify debtor or creditor.
            BE16: >-
              Debtor or Ultimate Debtor identification code missing or
              invalid.<br/><br/><b>Error handling</b><br/>If the Originator's
              identification code is invalid, the Sending Member may repair the
              transaction by providing the correct identification code. <br
              /><br />If the Originator's identification code is missing, the
              Originator may reissue the payment with the identification code
              specified.
            BE17: >-
              Creditor or Ultimate Creditor identification code missing or
              invalid.<br/><br/><b>Error handling</b><br/>If the Beneficiary's
              identification code is invalid, the Sending Member may repair the
              transaction by providing the correct identification code. <br
              /><br />If the Beneficiary's identification code is missing, the
              Originator may reissue the payment with the Beneficiary
              identification code specified.
            BE18: >-
              Contact details missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the contact details are invalid, the Sending
              Member may repair the transaction by providing the correct contact
              details.<br /><br /> If the contact details are missing, the
              Originator may reissue the payment with the contact details
              specified.
            BE19: >-
              Charge bearer code for transaction type is
              invalid.<br/><br/><b>Error handling</b><br/>If the charge bearer
              code is invalid, the Sending Member may repair the transaction by
              providing the correct charge bearer code.<br /><br /> If the
              charge bearer code is missing, the Originator may reissue the
              payment with the charge bearer code specified.
            BE20: Name length exceeds local rules for payment type.
            BE21: >-
              Name missing or invalid. Generic usage if cannot specifically
              identify debtor or creditor.
            BE22: >-
              Creditor name is missing.<br/><br/><b>Error handling</b><br/>If
              the Beneficiary's name is invalid, the Sending Member may repair
              the transaction by providing the correct Beneficiary name. <br
              /><br />If the Beneficiary's name is missing, the Originator may
              reissue the payment with the Beneficiary's name specified.
            CERI: >-
              Credit transfer is not tagged as an Extended Remittance
              Information (ERI) transaction but contains ERI.
            CH11: Value in Creditor Identifier is incorrect.
            CH12: Creditor Identifier is ambiguous at Transaction Level.
            CH13: Original Debtor Account is not to be used.
            CH14: Original Debtor Agent is not to be used.
            CH21: Mandatory element is missing.
            CNOR: Creditor bank is not registered under this BIC in the CSM.
            CUST: Cancellation requested by the Debtor.
            DS24: >-
              Waiting time expired due to incomplete order.<br/><br/><b>Error
              handling</b><br/>The Originator may contact the Beneficiary and
              ask them to take the actions necessary to receive funds. <br /><br
              />If the payment is resubmitted, a new reference ID must be used.
            DU05: >-
              Instruction ID is not unique. <br /><br />This error typically
              occurs when the Sending Member submits a transaction with an
              Instruction ID that matches a previous transaction's Instruction
              ID.<br/><br/><b>Error handling</b><br/>The Sending Member must
              resubmit the transaction with a unique Instruction ID. <br /><br
              />The following measures may also be considered:<ul><li>Sending
              and Receiving Members agree on the criteria to identify duplicate
              payments, and the window within which Intermediaries or Receiving
              Members will check for duplicate payments.</li><li>The Sending
              Member may implement checks to avoid submitting duplicate
              payments.</li><li>If a duplicate payment occurs, the Sending
              Member may resubmit the payment with new reference information
              within the duplication window. If the window expires, the Sending
              Member may initiate a new payment.</li></ul>
            DUPL: >-
              Payment is a duplicate of another payment. <br /><br />This error
              typically occurs when the Sending Member submits a transaction
              with reference information that matches a previous transaction's
              reference information.<br/><br/><b>Error handling</b><br/>The
              Sending Member must resubmit the transaction with unique reference
              information. <br /><br />The following measures may also be
              considered:<ul><li>Sending and Receiving Members agree on the
              criteria to identify duplicate payments, and the window within
              which Intermediaries or Receiving Members will check for duplicate
              payments.</li><li>The Sending Member may implement checks to avoid
              submitting duplicate payments.</li><li>If a duplicate payment
              occurs, the Sending Member may resubmit the payment with new
              reference information within the duplication window. If the window
              expires, the Sending Member may initiate a new payment.</li></ul>
            ED06: >-
              Interbank settlement system not available. <br /><br />This error
              typically occurs when the connecting infrastructure of the local
              clearing rail at the Receiving Member is unavailable to process or
              transmit any payment messages.<br/><br/><b>Error
              handling</b><br/>The Sending Member may recommend that the
              Originator reissue the RippleNet payment at a later time.<br /><br
              />The Originator may contact the Beneficiary to determine an
              alternative solution to make the payment.
            FF03: >-
              Payment Type Information is missing or invalid. This generic error
              code should be used only if Service Level or Local Instrument code
              are not specified.<br/><br/><b>Error handling</b><br/>If the
              payment type information is invalid, the Sending Member may repair
              the transaction by providing the correct payment type
              information.<br /><br />If the payment type information is
              missing, the Originator may reissue the payment with the payment
              type information specified.
            FF04: >-
              Service Level code is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the service level code is invalid, the Sending
              Member may repair the transaction by providing the correct
              code.<br /><br />If the service level code is missing, the
              Originator may reissue the payment with the code specified.
            FF05: >-
              Local Instrument code is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the local instrument code is invalid, the
              Sending Member may repair the transaction by providing the correct
              code.<br /><br />If the local instrument code is missing, the
              Originator may reissue the payment with the code specified.
            FF06: >-
              Category Purpose code is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the category purpose code is invalid, the
              Sending Member may repair the transaction by providing the correct
              code.<br /><br />If the category purpose code is missing, the
              Originator may reissue the payment with the code specified.
            FF07: >-
              Purpose of payment is missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the purpose of payment information is invalid,
              the Sending Member may repair the transaction by providing the
              correct information.<br /><br />If the purpose of payment
              information is missing, the Originator may reissue the payment
              with the purpose of payment specified.
            FF08: >-
              End to End Id missing or invalid.<br/><br/><b>Error
              handling</b><br/>If the end-to-end ID is invalid, the Sending
              Member may repair the transaction by providing the correct ID. <br
              /><br /> If the end-to-end ID is missing, the Originator may
              reissue the payment with the ID specified.
            FF10: >-
              File or transaction cannot be processed due to technical issues at
              the bank side.<br/><br/><b>Error handling</b><br/>The Sending
              Member may recommend that the Originator reissue the RippleNet
              payment at a later time.<br /><br />The Originator may contact the
              Beneficiary to determine an alternative solution to make the
              payment.
            MD06: Return of funds requested by end customer.
            MD07: End customer is deceased.
            MS02: Reason has not been specified by end customer.
            MS03: Reason has not been specified by agent.
            NARR: >-
              Reason is provided as narrative information in the additional
              reason information.
            RC01: >-
              Bank identifier code specified in the message has an incorrect
              format (formerly IncorrectFormatForRoutingCode).
            RC02: >-
              Bank identifier is invalid or missing. Generic usage if cannot
              specify between debit or credit account.
            RC04: >-
              Creditor bank identifier is invalid or missing.<br/><br/><b>Error
              handling</b><br/>If the Creditor Bank identifier is invalid, the
              Sending Member may repair the transaction by providing the correct
              identifier. <br /><br />If the Creditor Bank identifier is
              missing, the Originator may reissue the payment with the
              identifier specified.
            RC05: >-
              BIC identifier is invalid or missing. This generic error code
              should be used only if the relevant party is not clearly
              identifiable or specified.<br/><br/><b>Error handling</b><br/>If
              the BIC is invalid, the Sending Member may repair the transaction
              by providing the correct identifier. <br /><br />If the BIC is
              missing, the Originator may reissue the payment with the BIC
              identifier specified.
            RC07: >-
              Creditor BIC identifier is invalid or missing.<br/><br/><b>Error
              handling</b><br/>If the Beneficiary's BIC identifier is invalid,
              the Sending Member may repair the transaction by providing the
              correct BIC identifier.<br /><br /> If the Beneficiary's BIC
              identifier is missing, the Originator may reissue the payment with
              the BIC identifier specified.
            RC08: >-
              ClearingSystemMember identifier is invalid or missing. Generic
              usage if cannot specify between debit or credit account.
            RC10: >-
              Creditor ClearingSystemMember identifier is invalid or
              missing.<br/><br/><b>Error handling</b><br/>If the Beneficiary's
              ClearingSystemMember identifier is invalid, the Sending Member may
              repair the transaction by providing the correct identifier.<br
              /><br /> If the Beneficiary's ClearingSystemMember identifier is
              missing, the Originator may reissue the payment with the
              identifier specified.
            RC12: Creditor Scheme Id is invalid or missing.
            RF01: Transaction reference is not unique within the message.
            RR01: >-
              Specification of the debtor's account or unique identification
              needed for reasons of regulatory requirements is insufficient or
              missing.
            RR02: >-
              Specification of the debtor's name and/or address needed for
              regulatory requirements is insufficient or missing.
            RR03: >-
              Specification of the creditor's name and/or address needed for
              regulatory requirements is insufficient or
              missing.<br/><br/><b>Error handling</b><br/>If the Beneficiary's
              name and/or address information is invalid, the Sending Member may
              repair the transaction by providing the correct information.<br
              /><br /> If the Beneficiary's name and/or address information is
              missing, the Originator may reissue the payment with the
              Beneficiary's information specified.
            RR04: >-
              Regulatory Reason. This error typically occurs when there is a
              restriction due to Anti-Money Laundering (AML), embargo, or
              compliance reasons.<br/><br/><b>Error handling</b><br/>The
              Originator may contact the Sending Member to enquire about the
              reasons for the error and take remedial action as they see fit.
            RR05: >-
              Regulatory or Central Bank Reporting information missing,
              incomplete or invalid.<br/><br/><b>Error handling</b><br/>In case
              of a technical or human error, the Sending Member or the
              Originator must adapt their internal RippleNet payment initiation
              process to ensure they do not supply invalid or incomplete
              information. <br /><br />If the Beneficiary provided incorrect
              information, the Originator may contact the Beneficiary for
              accurate information.
            RR06: Tax information missing, incomplete or invalid.
            RR07: >-
              Remittance information structure does not comply with rules for
              payment type.
            RR10: >-
              Character set supplied not valid for the country and payment
              type.<br/><br/><b>Error handling</b><br/>In case of a technical or
              human error, the Sending Member or the Originator must adapt their
              internal RippleNet payment initiation process to ensure they do
              not supply an invalid character set. <br /><br />If the
              Beneficiary provided incorrect information, the Originator may
              contact the Beneficiary for accurate information.
            SL03: Due to a specific service offered by the clearing system.
        description:
          type: string
          example: No account / Unable to locate account
          description: User-defined string describing the reason for payment reversal.
      description: A structured object detailing reasons for a payment reversal.
    HealthRos:
      type: object
      required:
        - healthy
      properties:
        healthy:
          type: boolean
          description: >-
            If set to `true`, the ROS server is up and running. If set to
            `false`, the ROS server is down.
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthDetails'
          description: Contains the details of the ros components status.
      description: Provides a high-level status of the health of the ROS server.
    PageRos:
      type: object
      properties:
        first:
          type: boolean
          description: true if  this is the first page.
        last:
          type: boolean
          description: true if  this is the last page.
        number:
          type: integer
          description: Page number.
        numberOfElements:
          type: integer
          description: Number Of elements in this request.
        size:
          type: integer
          description: Page size.
        totalElements:
          type: integer
          description: Total number of elements for the given request.
          format: int64
        totalPages:
          type: integer
          description: Total number of pages for the given request.
      description: Paginated response base object.
