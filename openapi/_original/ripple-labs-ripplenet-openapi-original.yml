servers:
  - url: //[domainPrefix].ripplexcurrent.com/v4
components:
  requestBodies:
    PayoutMethodRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayoutMethodRequest'
      required: true
    PaymentExpiry:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentExpiry'
      required: true
    FiatFeeRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FiatFeeRequest'
      required: true
    QuoteExpiry:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteExpiry'
      required: true
    RateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateRequest'
      required: true
    PaymentDenyRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentDenyRequest'
      required: true
  securitySchemes:
    Bearer:
      type: apiKey
      description: >-
        All operations require a `Bearer` access token in the `Authorization`
        header of each request.<br>Learn about
        [authentication](/products/payments-odl/api-docs/ripplenet/best-practices/authentication/).
      name: Authorization
      in: header
  schemas:
    NotificationResponsePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/NotificationResponse'
      description: Paged response for notifications requested
    NotificationResponse:
      type: object
      description: Notification details
      required:
        - notification_id
        - notification_type
        - notification_status
        - notification_priority
        - created_at
        - entity_type
        - entity_id
        - message_details
      properties:
        notification_id:
          type: string
          format: uuid
          description: Notification Id
        notification_type:
          type: string
          enum:
            - HEARTBEAT_EVENT
            - NEW_PEERING_EVENT
            - NEW_LIQUIDITY_RELATIONSHIP_EVENT
            - LOW_BALANCE_EVENT
          description: Context in which the notification is generated
        notification_status:
          type: string
          enum:
            - CREATED
            - DELIVERED
            - READ
            - DELETED
          description: Status of the notification
        notification_priority:
          type: string
          enum:
            - ERROR
            - INFO
            - WARN
          description: Priority of the notification
        created_at:
          type: string
          format: date-time
          description: >-
            Date and time at which the notification was created, as an ISO-8601
            timestamp in UTC.
        entity_type:
          type: string
          enum:
            - QUOTE
            - PAYMENT
            - TRANSFER
            - EXCHANGE
          description: RippleNet entity for which the notification has been generated
        entity_id:
          type: string
          format: uuid
          description: >-
            Entity id of the RippleNet entity for which the notification has
            been generated
        message_details:
          type: string
          description: Summary description of the notification
        source_address:
          type: string
          description: RippleNet address of the host that has created the notification
        destination_address:
          type: string
          description: RippleNet address of the host that needs to receive the notification
        notification_details:
          type: string
          description: Payload of the notification object
    Accounts:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AccountResponse'
      description: 'Paged response for accounts includes:'
    AccountRequest:
      type: object
      required:
        - currency
        - name
        - owner
      properties:
        name:
          type: string
          example: conct_usd_sf
          description: >-
            Provide the name of the account. This value must be unique within
            the xCurrent instance.
        owner:
          type: string
          example: rn.us.ca.san_francisco
          description: Provide the RippleNet address of the owner of the account.
        currency:
          type: string
          example: USD
          description: >-
            Provide the currency of the account. Ripple recommends using
            [ISO-4217](https://www.iso.org/iso-4217-currency-codes.html)
            currency codes, although no formal constraint is enforced.
        core_ledger_ref:
          type: string
          example: bitso
          description: >-
            Core ledger reference key. This could be a bank account number for
            fiat, exchange name for exchange accounts, or a ledger reference for
            digital accounts. This field is required for exchange accounts
        rounding_mode:
          type: string
          description: >-
            Set to determine whether calculations for this account should be
            rounded up or down to maintain precision.
          enum:
            - HALF_UP
            - HALF_DOWN
            - DOWN
          default: HALF_UP
        scale:
          type: integer
          description: >-
            Set to the number of decimal places to be used when calculating
            rounding for this account. The allowable range is `0-9`.
          default: 2
        low_liquidity_threshold:
          type: number
          example: 1000
          description: >-
            If the balance of a sender account meets or goes below this
            `low_liquidity_threshold` value after settlement execution, a
            low-liquidity message is logged at the INFO level.
        minimum_allowed_balance:
          type: number
          description: Set to the minimum balance allowed for the account.
          default: -100000
        maximum_allowed_balance:
          type: number
          description: Set to the maximum balance allowed for the account.
          default: 72036854775
        platform_account_id:
          type: string
          format: uuid
          description: Platform account ID associated with this RippleNet account.
        external_account_id:
          type: string
          description: >-
            Used to link a customer’s account ID on their systems to their
            RippleNet account.
        account_description:
          type: string
          description: Description associated with this RippleNet account.
      description: >-
        Use this JSON request object to create an account in the xCurrent
        ledger.
    AccountResponse:
      type: object
      required:
        - balance
        - currency
        - disabled
        - low_liquidity_threshold
        - maximum_allowed_balance
        - minimum_allowed_balance
        - name
        - owner
        - owner_max_allowed_balance
        - owner_min_allowed_balance
        - rounding_mode
        - scale
      properties:
        name:
          type: string
          example: conct_usd_sf
          description: Account name and unique identifier on RippleNet.
        balance:
          type: number
          example: 0
          description: Balance available in the account.
        owner:
          type: string
          example: rn.us.ca.san_francisco
          description: RippleNet address of the owner of the account.
        currency:
          type: string
          example: USD
          description: Currency supported by the account.
        disabled:
          type: boolean
          example: false
          description: >-
            Indicates whether the account is disabled (`true`) or active
            (`false`).
        minimum_allowed_balance:
          type: number
          example: -1000000
          description: >-
            Minimum balance allowed for the account. For nostro accounts,
            RippleNet Server uses the greater of this value and the
            `owner_min_allowed_balance` to set the account balance minimum.
        maximum_allowed_balance:
          type: number
          example: 9999999999999900000
          description: >-
            Maximum balance allowed for the account. For nostro accounts,
            RippleNet Server uses the lesser of this value and the
            `owner_max_allowed_balance` to set the account balance maximum.
        core_ledger_ref:
          type: string
          example: bitso
          description: >-
            Core ledger reference key. This could be a bank account number for
            fiat, exchange name for exchange accounts, or a ledger reference for
            digital accounts. This field is required for exchange accounts
        rounding_mode:
          type: string
          example: HALF_UP
          description: >-
            Determines whether calculations for this account are rounded up or
            down to maintain precision.
          enum:
            - HALF_UP
            - HALF_DOWN
            - DOWN
          default: HALF_UP
        scale:
          type: integer
          example: 2
          description: >-
            Number of decimal places used when calculating rounding for this
            account.
        low_liquidity_threshold:
          type: number
          example: 1000
          description: >-
            When the sender's account `balance` is less than or equal to this
            amount, after payment settlement execution, a low-liquidity message
            is logged at the INFO level.
        owner_min_allowed_balance:
          type: number
          example: -100000
          description: >-
            Minimum balance allowed by the owner of a nostro account. RippleNet
            Server uses the greater of this value and the
            `minimum_allowed_balance` to set the account balance minimum.
        owner_max_allowed_balance:
          type: number
          example: 72036854775
          description: >-
            Maximum balance allowed by the owner of a nostro account. RippleNet
            Server uses the lesser of this value and the
            `maximum_allowed_balance` to set the account balance maximum.
        platform_account_id:
          type: string
          format: uuid
          description: Platform account ID associated with this RippleNet account.
        external_account_id:
          type: string
          description: >-
            Customer's account ID on their systems associated with this
            RippleNet account.
        account_description:
          type: string
          description: Description associated with this RippleNet account.
      description: Represents an account on the xCurrent ledger.
    AccountUpdateAllowedBalanceRequest:
      type: object
      properties:
        minimum_allowed_balance:
          type: number
          example: -1000000
          description: >-
            Set to the minimum balance allowed for the account. Updates the
            value of `minimum_allowed_balance` for the account.
        maximum_allowed_balance:
          type: number
          example: 9999999999999900000
          description: >-
            Set to the maximum balance allowed for the account. Updates the
            value of `maximum_allowed_balance` for the account.
        core_ledger_ref:
          type: string
          example: bitso
          description: >-
            Core ledger reference key. This could be a bank account number for
            fiat, exchange name for exchange accounts, or a ledger reference for
            digital accounts. This field is required for exchange accounts
        enable:
          type: boolean
          example: true
          default: true
          description: >-
