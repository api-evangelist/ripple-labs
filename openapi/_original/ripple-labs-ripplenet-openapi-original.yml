    CreatePlatformRequest:
      type: object
      description: >-
        Request object for creating a RippleNet platform, which maps to a real
        world financial institution.
      required:
        - name
        - platform_type
        - institution
        - servicer_code
      properties:
        name:
          type: string
          description: Name of the platform.
        platform_type:
          type: string
          description: >-
            The type of institution this platform represents (WALLET_PROVIDER,
            FIAT_INSTITUTION, or DIGITAL_EXCHANGE).
          enum:
            - WALLET_PROVIDER
            - FIAT_INSTITUTION
            - DIGITAL_EXCHANGE
        description:
          type: string
          maxLength: 512
          description: A short description of the platform.
        institution:
          type: string
          description: Name of the institution this platform represents.
        servicer_code:
          type: string
          description: >-
            Akin to the routing number (US), Sort Code (UK), or IFSC code
            (India).
    UpdatePlatformRequest:
      type: object
      description: >-
        Request object for updating a RippleNet platform, which maps to a real
        world financial institution. **Note**: `platform_type` is set on the
        creation of the platform and cannot be updated.
      properties:
        name:
          type: string
