      tags:
        - Transfers
      summary: Complete transfer
      description: >-
        Updates the state of a transfer to `COMPLETED`. Make this request once
        the transfer has been made on both the ledger and on internal systems.
      operationId: completeTransfer
      parameters:
        - name: transfer_id
          in: path
          description: Unique identifier of the transfer you want to complete.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully completed transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '404':
          description: Transfer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /transfers/{transfer_id}/labels:
    put:
      tags:
        - Transfers
      summary: Add transfer labels
      description: >-
        Adds a list of labels to the transfer. To retrieve transfers by label,
        see [Get transfers][get-transfers].
      operationId: addTransferLabels
      parameters:
        - name: transfer_id
          in: path
          description: Transfer ID for the label being added.
          required: true
          schema:
            type: string
            format: uuid
        - name: label
          in: query
          description: Text of the label you want to add to the payment.
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successfully added one or more labels to the transfer.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
    delete:
      tags:
        - Transfers
      summary: Delete transfer labels
      description: Deletes one or more existing labels from the transfer.
      operationId: deleteTransferLabels
      parameters:
        - name: transfer_id
          in: path
          description: Transfer ID for the label being removed.
          required: true
          schema:
            type: string
            format: uuid
        - name: label
          in: query
          description: Labels to be removed.
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successfully deleted one or more labels of the transfer.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /v4/orchestration/payment:
    post:
      tags:
        - Orchestration payments
      summary: Create orchestration payment
      description: Creates an orchestration payment.
      operationId: createOrchestrationPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationPaymentRequest'
        required: true
      responses:
        '201':
          description: Successfully created orchestration payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationPaymentSubmitResponse'
    get:
      tags:
        - Orchestration payments
      summary: Get orchestration payments
      description: Gets a list of orchestration payments.
      operationId: getOrchestrationPayments
      parameters:
        - name: page
          in: query
          description: >
            The page number for [paginated
            results](/products/payments-odl/api-docs/ripplenet/best-practices/pagination/).


            The value is zero-based, where `0` represents the first page.


            Set it to `0` to get the first page of results.
          required: false
          schema:
            type: integer
        - name: size
          in: query
          description: Number of objects to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sort_field
          in: query
          description: |
            Attribute to sort the results on.

            | Enum: | Sort by |
            | --- | --- |
            | CREATED_AT | Created date-time |
            | MODIFIED_AT | Modified date-time |
          required: false
          schema:
            type: string
            enum:
              - CREATED_AT
              - MODIFIED_AT
            default: MODIFIED_AT
        - name: sort_direction
          in: query
          description: |
            Direction of sorted results based on `sort_field`.

            | Enum: | Description |
            | --- | --- |
            | ASC | Sort ascending |
            | DESC | Sort descending |
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: ASC
        - name: unique_reference_number
          in: query
          description: Parameter for filtering with unique reference number.
          required: false
          schema:
            type: string
        - name: orchestration_status
          in: query
          description: |
            Parameter for filtering with status of the orchestration payment.

            | Enum | Description |
            | --- | --- |
            | INITIAL | Filter by payments in the initial state |
            | RUNNING | Filter by payments in the running state |
            | COMPLETED | Filter by completed payments |
            | PAUSED | Filter by paused payments |
            | FAILURE | Filter by payment failures |
            | DECLINED | Filter by declined payments |
            | RETRY | Filter by payments that have a retry status |
          required: false
          schema:
            type: string
            enum:
              - INITIAL
              - RUNNING
              - COMPLETED
              - PAUSED
              - FAILURE
              - DECLINED
              - RETRY
        - name: range_field
          in: query
          description: >
            **Range field**


            Designates the column name of the payments database table that is
            used for filtering payments before/after/between time stamps.


            The following options are valid:

              | Range field | Description |
              | --- | --- |
              | CREATED_AT | Filter by created date-time |
              | MODIFIED_AT | Filter by modified date-time |

            **Example usage**


            If you specify `range_field` = `MODIFIED_AT`, you need to specify a
            time stamp (in the 24 character ISO 8601 format used in payment
            objects: `YYYY-MM-DDTHH:mm:ss.sssZ`) as the value for `before`
            and/or `after` to fetch payments before, after, or between the
            specified time range(s) (inclusive).


            **Dependency**: If you specify `range_field`, you must also specify
            `before` and/or `after`.
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >
            **Before** time stamp


            Filters for payments where the `range_field` column value is before
            this specified time stamp (inclusive).


            You can also specify `after` to create a time range between `after`
            and `before`.


            **Dependency**: If you specify `before`, you must also specify
            `range_field`.


            **Example**: `2023-10-13T10:16:29.000Z`
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >
            **After** time stamp


            Filters for payments where the `range_field` column value is after
            this specified time stamp (inclusive).


            You can also specify `before` to create a time range between `after`
            and `before`.


            **Dependency**: If you specify `after`, you must also specify
            `range_field`.


            **Example**: `2023-10-13T10:16:29.000Z`
          schema:
            type: string
      responses:
        '200':
          description: Successfully fetched all orchestration payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationPayments'
  /v4/orchestration/payment/{uniqueReferenceNumber}:
    get:
      tags:
        - Orchestration payments
      summary: Get orchestration payment
