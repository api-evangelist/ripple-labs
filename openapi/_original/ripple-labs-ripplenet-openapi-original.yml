      description: JSON response object that represents an orchestration payment query ID.
    OrchestrationPaymentResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 5492648d-2132-4e70-9ded-2fc86f22b321
          description: Unique Identifier of the orchestration payment.
        unique_reference_number:
          type: string
          example: '00310000015'
          description: Unique reference number.
        sender_end_to_end_id:
          type: string
          example: '00310000015'
          description: Sender end-to-end ID.
        payment_type:
          type: string
          description: The payment type for the payment.
          enum:
            - REGULAR
            - RETURN
            - REVERSAL
        connector_role:
          type: string
          description: The connector role for payment.
          enum:
            - SENDING
            - RECEIVING
            - INTERMEDIARY
        payment_id:
          type: string
          example: 26bf269b-1a2b-c3d4-872a-7f18d7dcf9f2
          description: Payment ID for the transaction in RippleNet.
        payment_status:
          type: string
          example: SUCCESS
          description: Status of the payment.
        previous_payment_status:
          type: string
          example: EXECUTED
          description: Previous status of the payment.
        orchestration_template:
          type: string
          example: default_template
          description: Template name used for executing the orchestration payment.
        orchestration_status:
          type: string
          example: RUNNING
          description: Status of the orchestration payment.
        current_activity:
          type: string
          example: get_quote_v1
          description: Current activity which is being executed.
        current_activity_status:
          type: string
          example: SUCCESS
          description: Status of the current activity.
        initial_context:
          type: object
          properties: {}
          description: Initial context for the orchestration payment.
        current_context:
          type: object
          properties: {}
          description: Current context of the orchestration payment.
        error_message:
          type: object
          properties: {}
          description: Error message in case of any error.
        activity_list:
          type: object
          properties: {}
          description: Activity list of the activities executed so far.
        created_at:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            Date and time at which the orchestration payment was created, as an
            ISO-8601 timestamp in UTC.
        modified_at:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            Date and time at which the orchestration payment was modified, as an
            ISO-8601 timestamp in UTC.
      description: JSON response object that represents an orchestration payment.
    OrchestrationPayments:
