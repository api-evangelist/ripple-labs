                - DAYS
          required:
            - time_value
            - time_unit
    RippleNetProblem:
      type: object
      description: Represents a request to create and update a payout method record.
      properties:
        type:
          type: string
          example: https://errors.ripplenet.ripple.com/error/json-processing-error
          description: URL to the error documentation.
        title:
          type: string
          example: Invalid Request Object
          description: Summary of the returned problem.
        detail:
          type: string
          example: The request parameter [account_id] is not in the correct format.
          description: Description of the returned problem.
        status:
          type: number
          example: 400
          description: HTTP error code.
        ripplenet_error_code:
          type: string
          example: E0104
          description: RippleNet specific error code.
        finality:
          type: string
          example: PERMANENT
          description: Specifies if the request can be retried for a successful response.
    InitiateAccountLookupRequest:
      type: object
      description: >-
        Initiate account lookup request to validate a beneficiary's account
        details before sending a payment.
      required:
        - destination_address
        - country_code
        - account_id
        - account_id_type
      properties:
        account_currency:
          type: string
          description: >-
            The 3 character currency code for the account as per ISO-4217
            standards
        clearing_system_code:
          type: string
          maxLength: 50
          description: Clearing system code
        destination_address:
          type: string
          description: RippleNet address of the receiver.
        first_name:
          type: string
          maxLength: 40
          description: First name of the beneficiary.
        middle_name:
          type: string
          maxLength: 40
          description: Middle name of the beneficiary.
        last_name:
          type: string
          maxLength: 40
          description: Last name of the beneficiary.
        org_name:
          type: string
          maxLength: 140
          description: Name of the organization.
        country_code:
          type: string
          maxLength: 2
          description: Country of the beneficiary. Alpha-2 Code format per ISO 3166-1.
        account_id:
          type: string
          maxLength: 40
          description: Identifier for the Account, e.g account number.
        account_id_type:
          type: string
          description: |-
            Account ID type. Possible values are
              - `AIIN` - (default) Account Issue Identification Number
              - `BBAN` - Basic Bank Account Number
              - `CARD` - PAN of the card identifying the account
              - `CUID` - CHIPS Universal Identifier
              - `UPIC` - Universal Payment Identification Code
              - `EMail` - Email Address
              - `MSISDN` - Mobile Subscriber Integrated Service Digital Network (i.e., phone number)
              - `DMST` - Domestic
              - `Other` - Other identifier (e.g., PayID)
          enum:
            - AIIN
            - BBAN
            - CARD
            - CUID
            - UPIC
            - EMAIL
            - MSISDN
            - DMST
            - OTHER
    CompleteAccountLookupRequest:
      type: object
      description: >-
        Complete account lookup request to validate the Beneficiary before
        initiating the payment.
      required:
        - account_lookup_id
        - result_code
        - result_status
        - result_description
      properties:
        account_lookup_id:
          type: string
          description: UUID that links Account Lookup request and response.
          format: uuid
        result_code:
          type: string
          pattern: ^RNCB\d{4}
          description: |-
            Result code of the Account Lookup response. Possible values are
              - `RNCB0000` - Pass- Name and Identifier are correct and linked
              - `RNCB0001` - Fail- Name and Identifier not found
              - `RNCB0002` - Fail- Name and Identifier do not match
        result_status:
          type: string
          description: Result status of Account Lookup response
          enum:
            - PASS
            - FAIL
        result_description:
          type: string
          description: Result description of Account Lookup response
        redacted_first_name:
          type: string
          maxLength: 40
          description: First name of the beneficiary.
        redacted_middle_name:
          type: string
          maxLength: 40
          description: Middle name of the beneficiary.
        redacted_last_name:
          type: string
          maxLength: 40
          description: Last name of the beneficiary.
        redacted_org_name:
          type: string
          maxLength: 140
          description: Name of the organization.
        redacted_country_code:
          type: string
          description: Country of the beneficiary. Alpha-2 Code format per ISO 3166-1.
        redacted_account_id:
          type: string
          maxLength: 40
          description: Identifier for the Account, e.g account number.
        redacted_account_id_type:
          type: string
          description: |-
            Account ID type, redacted by the receiver. Possible values are
              - `AIIN` - (default) Account Issue Identification Number
              - `BBAN` - Basic Bank Account Number
              - `CARD` - PAN of the card identifying the account
              - `CUID` - CHIPS Universal Identifier
              - `UPIC` - Universal Payment Identification Code
              - `EMail` - Email Address
              - `MSISDN` - Mobile Subscriber Integrated Service Digital Network (i.e., phone number)
              - `DMST` - Domestic
              - `Other` - Other identifier (e.g., PayID)
          enum:
            - AIIN
            - BBAN
            - CARD
            - CUID
            - UPIC
            - EMAIL
            - MSISDN
            - DMST
            - OTHER
        redacted_clearing_system_code:
          type: string
          description: Clearing system code
        redacted_branch_code:
          type: string
          description: >-
            The Branch code (e.g., routing code) that the receiver has on their
            system.
        redacted_account_currency:
          type: string
          description: >-
            The 3 character currency code for the account as per ISO-4217
            standards
