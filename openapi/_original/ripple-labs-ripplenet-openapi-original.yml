    Fees:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              description: Provides an array of fee objects.
              items:
                $ref: '#/components/schemas/FiatFee'
      description: >-
        Provides a `content` array of fee objects and a set of pagination
        information fields.
    FiatFee:
      type: object
      required:
        - currency_code
        - feeId
        - fee_type
        - node_type
        - payment_type
        - role_type
        - value
      properties:
        value:
          type: number
          example: 2
          description: >-
            Value of the fee to be applied. fiat node uses this value and
            `fee_type` to calculate the fee.
        currency_code:
          type: string
          example: USD
          description: Currency this fee applies to.
        role_type:
          type: string
          example: SENDING
          description: >-
            Role of the party to which the fee applies.<p>If set to `SENDING`,
            the fee is charged to the originator of the payment.</p> <p>If set
            to `RECEIVING`, the fee is charged to the beneficiary of the
            payment.</p> <p>If set to `INSTITUTION_SENDING`, the fee is charged
            to the financial institution that is sending the payment.</p> <p>If
            set to `INSTITUTION_RECEIVING`, the fee is charged to the financial
            institution that is receiving the payment.</p>
          enum:
            - SENDING
            - RECEIVING
            - INSTITUTION_SENDING
            - INSTITUTION_RECEIVING
        payment_type:
          type: string
          example: REGULAR
          description: Payment type the fee applies to.
          enum:
            - REGULAR
            - RETURN
        node_type:
          type: string
          example: INITIAL
          description: >-
            Fiat node to which the fee applies.<p>If set to `INITIAL`, the fee
            is charged to the first fiat instance in the payment chain.</p>
            <p>If set to `INTERMEDIATE`, the fee is charged to each fiat
            instance in the payment chain that is not the first or last fiat
            instance.</p> <p>If set to `TERMINAL`, the fee is charged to the
            last fiat instance in the payment chain.</p>
          enum:
            - INITIAL
            - INTERMEDIATE
            - TERMINAL
        fee_type:
          type: string
          example: FLAT_RATE
          description: Method used to calculate the fee.
          enum:
            - PERCENTAGE
            - FLAT_RATE
        partner_name:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            Owner of the account involved in the payment, in RippleNet Address
            format. For example, `rn.us.ca.san_francisco`.
        account_name:
          type: string
          example: conct_usd_sf
          description: >-
            For a fee that applies to a specific account, provides the account
            name. Used in combination with the `partner_name` value.
        upper_limit:
          type: number
          example: 1000
          description: >-
            For a slab-based fee, provides the upper limit of the slab. Used in
            combination with the `lower_limit` value.
        lower_limit:
          type: number
          example: 0
          description: >-
            For a slab-based fee, provides the lower limit of the slab. Used in
            combination wtih the `upper_limit` value.
        feeId:
          type: string
          format: uuid
          example: 7740f31c-ca03-4414-b491-b285aef71eb1
          description: Unique identifier of the fee.
        payout_method:
          type: string
          example: LOCAL_RAILS
          description: The payout method for this fee.
        fee_category:
          type: string
          example: BENEFICIARY_BANK_CHARGE
          description: Category that describes the purpose of the fee.
          default: NONE
          enum:
            - NONE
            - OVERSEAS_DELIVERY_CHARGES
            - BENEFICIARY_BANK_CHARGE
            - PROCESSING_HANDLING_CHARGE
            - LOCAL_GOVERNMENT_CHARGE
            - OTHER
        fee_description:
          type: string
          description: Optional free-form description for the fee.
      description: Represents a fee to be applied based on various criteria.
    FiatFeeRequest:
      type: object
      required:
        - currency_code
        - fee_type
        - node_type
        - payment_type
        - role_type
        - value
      properties:
        value:
          type: number
          example: 0.025
          description: >
            Value of the fee to apply.


            Set the value of this parameter according to the fee type you are
            using:


            | [fee_type](#operation/createFee!path=fee_type&t=request) |
            Corresponding value to use |

            | --- | --- |

            | PERCENTAGE | `value` must be >`0` and <`100`. |

            | FLAT_RATE | `value` can be negative. |


            **Note**: The final amount of the fee is applied either as a
            percentage or a flat rate depending on the `value` you specify for
            the `fee_type` parameter.
        currency_code:
          type: string
          example: USD
          description: >-
            Currency the fee is applied in. Ripple recommends using
            [ISO-4217](https://www.iso.org/iso-4217-currency-codes.html)
            currency codes, although no formal constraint is enforced.
        role_type:
          type: string
          example: SENDING
          description: Role of the party to which the fee applies.
          enum:
            - SENDING
            - RECEIVING
            - INSTITUTION_SENDING
            - INSTITUTION_RECEIVING
          x-enumDescriptions:
            SENDING: Charge the originator of the payment.
            RECEIVING: Charge the beneficiary of the payment.
            INSTITUTION_SENDING: Charge the financial institution sending the payment.
            INSTITUTION_RECEIVING: Charge the financial institution receiving the payment.
        payment_type:
          type: string
          example: REGULAR
          description: Type of payment to which the fee applies.</p>
          enum:
            - REGULAR
            - RETURN
          x-enumDescriptions:
            REGULAR: Apply the fee to a regular payment.
            RETURN: Apply the fee to a return payment.
        node_type:
          type: string
          example: INITIAL
          description: Fiat instance to which the fee applies.
          enum:
            - INITIAL
            - INTERMEDIATE
            - TERMINAL
          x-enumDescriptions:
            INITIAL: Apply the fee to the first fiat instance in the payment chain.
            INTERMEDIATE: >-
              Apply the fee to each fiat instance in the payment chain that is
              not the first or last.
            TERMINAL: Apply the fee to the last fiat instance in the payment chain.
        fee_type:
          type: string
          example: FLAT_RATE
          description: >-
            Type of fee to apply. This is used with fee
            [value](#operation/createFee!path=value&t=request) to calculate the
            fee.
          enum:
            - PERCENTAGE
            - FLAT_RATE
          x-enumDescriptions:
            PERCENTAGE: Apply the fee `value` as a percentage.
            FLAT_RATE: Apply the fee `value` as a flat rate.
        partner_name:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            Owner of the account involved in the payment, in RippleNet Address
            format. For example, `rn.us.ca.san_francisco`.
        account_name:
          type: string
          example: conct_usd_sf
          description: >-
            Account to apply the fee to. Specify the account name. For example,
            `conct_usd_sf`. If specified, you must also specify a `partner_name`
            value.
        upper_limit:
          type: number
          example: 1000
          description: >-
            Maximum amount for the range of a slab-based fee. If specified, you
            must also specify a `lower_limit` value.
        lower_limit:
          type: number
          example: 0
          description: >-
            Minimum amount for the range of a slab-based fee. If specified, you
            must also specify an `upper_limit` value.
        payout_method:
          type: string
          example: LOCAL_RAILS
          description: >-
            The payout method by which the receiving institution delivers the
            funds to the end customer.
        fee_category:
          type: string
          example: BENEFICIARY_BANK_CHARGE
          description: Category that describes the purpose of the fee.
          default: NONE
          enum:
            - NONE
            - OVERSEAS_DELIVERY_CHARGES
            - BENEFICIARY_BANK_CHARGE
            - PROCESSING_HANDLING_CHARGE
            - LOCAL_GOVERNMENT_CHARGE
            - OTHER
          x-enumDescriptions:
            NONE: None
            OVERSEAS_DELIVERY_CHARGES: Overseas delivery charges.
            BENEFICIARY_BANK_CHARGE: Charge from beneficiary bank.
            PROCESSING_HANDLING_CHARGE: Processing and handling charge.
            LOCAL_GOVERNMENT_CHARGE: Local government charge.
            OTHER: Other charges.
        fee_description:
          type: string
          description: Optional free-form description for the fee.
      description: >-
        Use this JSON request object to create a fee that can be applied to
        payments.
    Rates:
      type: object
      required:
        - content
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              description: Provides an array of rate objects.
              type: array
              items:
                $ref: '#/components/schemas/RateResponse'
      description: >-
        Provides a `content` array of rate objects and a set of pagination
        information fields.
    RateResponse:
      type: object
      required:
        - base_currency
        - counter_currency
        - created_date
        - destination_currency
        - destination_ledger
        - destination_ledger_account
        - expiration_offset
        - lower_limit
        - order_type
        - rate
        - rate_id
        - rate_scale
        - source_currency
        - source_ledger
        - source_ledger_account
        - upper_limit
        - value_type
        - margin_type
      properties:
        rate_id:
          type: string
          format: uuid
          example: 328b3e50-7983-46d5-94a0-ef004d78db1d
          description: Unique identifier of the exchange rate.
        expiration_offset:
          type: integer
          example: 95000
          description: >-
            <b>(DEPRECATED)</b> This property is deprecated. Refer to
            `expires_at` to determine rate expiration. <p>Amount of time in
            milliseconds that the rate is valid for after the rate's
            `created_date` value. For example, if the `expiration_offset` value
            is `100000` milliseconds, the rate expires `100000` milliseconds
            after this `created_date` value. If set to `0`, the rate does not
            expire.</p>
        order_type:
          type: string
          example: buy
          description: Order type for the exchange rate.
          enum:
            - buy
            - sell
        rate_scale:
          type: integer
          example: 9
          description: >-
            Number of decimal places to which the exchange rate is calculated.
            For example, if the `rate_scale` value is set to `9` and the `rate`
            value is set to `1.25`, the scaled value of the rate is
            `1.250000000`.
          default: 9
        rate:
          type: number
          example: 0.89
          description: Exchange rate for the specified base and counter currency.
        base_currency:
          type: string
          example: USD
          description: Base currency of the exchange rate.
        counter_currency:
          type: string
          example: GBP
          description: Counter currency of the exchange rate.
        source_currency:
          type: string
          example: USD
          description: >-
            If `order_type` is set to `buy`, this is set to the base currency.
            If `order_type` is set to `sell`, this is set to the counter
            currency.
        destination_currency:
          type: string
          example: GBP
          description: >-
            If `order_type` is set to `buy`, this is set to the counter
            currency. If `order_type` is set to `sell`, this is set to the base
            currency.
        source_ledger:
          type: string
          example: rn.eur.uk.london
          description: Source ledger associated with the exchange rate.
        destination_ledger:
          type: string
          example: rn.eur.uk.london
          description: Destination ledger associated with the exchange rate.
        source_ledger_account:
          type: string
          example: alias_usd_lon
          description: Account on the source ledger associated with rate.
        destination_ledger_account:
          type: string
          example: conct_gbp_lon
          description: Account on the destination ledger associated with rate.
        created_date:
          type: string
          format: date-time
          description: >-
            Date and time at which the exchange rate was created, as an ISO-8601
            timestamp in UTC. Fiat determines a rate's expiration date and time
            based on this value and `expiration_offset` value. For example, if
            the `expiration_offset` value is `100000` milliseconds, the rate
            expires `100000` milliseconds after this `created_date` value.
        expires_at:
          type: string
          format: date-time
          description: The time in which this rate expires in system local timezone
        lower_limit:
          type: number
          example: 0
          description: >-
            For a slab-based exchange rate, indicates the lower limit of the
            slab.
        upper_limit:
          type: number
          example: 1000
          description: >-
            For a slab-based exchange rate, indicates the upper limit of the
            slab.
        payout_method:
          type: string
          example: LOCAL_RAILS
          description: The payout method for the rate.
        value_type:
          type: string
          example: MARGIN
          description: >-
            Indicates whether the rate is a live exchange rate (`MARGIN`) or an
            exchange rate manually configured by Ripple (`RATE`). If this value
            is `MARGIN`, then `margin_type` will show a value.
          enum:
            - MARGIN
            - RATE
        margin_type:
          type: string
          example: BPS
          description: >-
            Indicates the unit of margin applied in addition to the rate
            provided by Ripple. This field has a value only if `value_type` =
            `MARGIN`. If `value_type` is `RATE`, this field is `null`.
          enum:
            - BPS
      description: JSON response object that represents an exchange rate.
    RateRequest:
      type: object
      required:
        - base_currency
        - counter_currency
        - expiration_offset
        - order_type
        - rate
      properties:
        expiration_offset:
          type: integer
          example: 95000
          description: >-
            Set to the amount of time in milliseconds that the rate is valid for
            after the rate's `created_date` value. Set to `0` to indicate that
            the rate does not expire. The value returned in the response object
            for this field is `null`. Refer to the `expires_at` value in the
            response object to verify your expiration offset timing.
        order_type:
          type: string
          example: buy
          description: Set to the order type for the exchange rate.
          enum:
            - buy
            - sell
        rate:
          type: number
          example: 0.89
          description: >
            This value of this field represents either rate or margin based on
            what you specify in the `value_type` field. 


            If you specify `value_type=rate`, set the value of this field to the
            exchange rate for a base and counter currency. The rate can use up
            to 6 decimal

            places. 


            If you specify `value_type=margin`, set the value of this field
            depending on the unit of margin you specified in the `margin_type`
            field.
        base_currency:
          type: string
          example: USD
          description: Set to the base currency of the exchange rate.
        counter_currency:
          type: string
          example: GBP
          description: Set to the counter currency of the exchange rate.
        ledger:
          $ref: '#/components/schemas/RatePerLedgerRequest'
        account:
          $ref: '#/components/schemas/RatePerAccountRequest'
        lower_limit:
          type: number
          example: 0
          description: >-
            To create a slab-based exchange rate, provide the lower limit of the
            slab. You must also provide an `upper_limit` value.
        upper_limit:
          type: number
          example: 1000
          description: >-
            To create a slab-based exchange rate, provide the upper limit of the
            slab. You must also provide a `lower_limit` value.
        payout_method:
          type: string
          example: LOCAL_RAILS
          description: The payout method for the rate.
        value_type:
          type: string
          example: MARGIN
          description: >-
            Specify whether you want to use a live exchange rate (`MARGIN`) or
            an exchange rate manually configured by Ripple (`RATE`). If you set
            this value to `MARGIN`, you must also provide `margin_type`.
          enum:
            - MARGIN
            - RATE
        margin_type:
          type: string
          example: BPS
          description: >-
            Specify the unit of margin to be applied (BPS) in addition to the
            rate provided by Ripple. Specify this field only if you set
            `value_type` = `MARGIN`.
          enum:
            - BPS
      description: >-
        Use this JSON request body to create an exchange rate for a base and
        counter currency.
    RatePerLedgerRequest:
      type: object
      required:
        - destination_ledger
        - source_ledger
      properties:
        source_ledger:
          type: string
          example: rn.eur.uk.london
          description: Set to the source ledger associated with the exchange rate.
        destination_ledger:
          type: string
          example: rn.eur.uk.london
          description: Set to the destination ledger associated with the exchange rate.
      description: >-
        Use the `ledger` request object to create an exchange rate that applies
        to exchanges between a specific source ledger and destination ledger.
    RatePerAccountRequest:
      type: object
      required:
        - destination_ledger
        - destination_ledger_account
        - source_ledger
        - source_ledger_account
      properties:
        source_ledger:
          type: string
          example: rn.eur.uk.london
          description: Set to the source ledger associated with the exchange rate.
        destination_ledger:
          type: string
          example: rn.eur.uk.london
          description: Set to the destination ledger associated with the exchange rate.
        source_ledger_account:
          type: string
          example: alias_usd_lon
          description: Set to the account on the source ledger associated with the rate.
        destination_ledger_account:
          type: string
          example: conct_gbp_lon
          description: >-
            Set to the account on the destination ledger associated with the
            rate.
      description: >-
        Use the `account` request object to create an exchange rate that applies
        to exchanges between a specific source ledger account and destination
        ledger account.
    RippleNetNodeRequestsForPayment:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/RippleNetNodeRequestForPayment'
      description: 'Paged response for requests for payment includes:'
    RippleNetNodeRequestForPaymentRequest:
      type: object
      required:
        - amount
        - currency
        - quote_type
        - receiver_address
        - sender_address
      properties:
        sender_address:
          type: string
          example: trans_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet address of the node that is receiving the request for
            payment, or the eventual sender of the payment.
        receiver_address:
          type: string
          example: trans_gbp_lon@rn.eur.uk.london
          description: >-
            RippleNet address of the node that is sending the request for
            payment, or the eventual receiver of the payment.
        amount:
          type: number
          example: 100.01
          description: Amount requested to be paid.
        currency:
          type: string
          example: USD
          description: Currency code for the `amount` value.
        quote_type:
          type: string
          example: SENDER_AMOUNT
          description: >-
            Indicates how the amount field should be treated for calculating
            quote values.
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
        end_to_end_id:
          type: string
          description: >-
            ID that the eventual payment receiver can specify. Persisted on all
            rippleNet node instances (namely, the sender and receiver of the
            payment) that participate in the request for payment.
        user_info:
          type: object
          description: User-provided data with arbitrary key/value pairs.
          properties: {}
      description: Use this JSON object to request a request for payment.
    RippleNetNodeRequestForPayment:
      type: object
      required:
        - amount
        - created_at
        - currency
        - quote_type
        - receiver_address
        - request_for_payment_id
        - request_for_payment_state
        - sender_address
        - user_info
      properties:
        request_for_payment_id:
          type: string
          format: uuid
          example: 1bf93760-ef69-4697-b2b4-47d9e1c42aa7
          description: Unique identifier of a request for payment.
        request_for_payment_state:
          type: string
          example: REQUESTED
          description: State of the request for payment.
          enum:
            - REQUESTED
            - ACCEPTED
            - FAILED
        sender_address:
          type: string
          example: trans_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet address of the node that is receiving the request for
            payment, or the eventual sender of the payment.
        receiver_address:
          type: string
          example: trans_gbp_lon@rn.eur.uk.london
          description: >-
            RippleNet address of the node that is sending the request for
            payment, or the eventual receiver of the payment.
        amount:
          type: number
          example: 100.01
          description: Amount requested to be paid.
        currency:
          type: string
          example: USD
          description: Currency code for the `amount` value.
        quote_type:
          type: string
          example: SENDER_AMOUNT
          description: >-
            Indicates how the amount field should be treated for calculating
            quote values.
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
        end_to_end_id:
          type: string
          description: >-
            ID that the eventual payment receiver can specify. Persisted on all
            rippleNet Node instances (namely, the sender and receiver of the
            payment) that participate in the request for payment.
        user_info:
          type: array
          description: User-provided data with arbitrary key/value pairs.
          items:
            $ref: '#/components/schemas/RippleNetNodeRequestForPaymentUserInfo'
        created_at:
          type: string
          format: date-time
          description: >-
            Date and time at which the request for payment was created, as an
            ISO-8601 timestamp in UTC.
        payment_id:
          type: string
          format: uuid
          example: 5492648d-2132-4e70-9ded-2fc86f22b321
          description: Unique identifier of a payment associated to request for payment.
      description: Use this JSON object represent a request for payment.
    RippleNetNodeRequestForPaymentUserInfo:
      type: object
      required:
        - node_address
      properties:
        node_address:
          type: string
          description: RippleNet address of the node that provided the user information.
        requested:
          type: array
          description: >-
            User information optionally provided when sending the request for
            payment.
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        accepted:
          type: array
          description: >-
            User information optionally provided when accepting the request for
            payment.
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        failed:
          type: array
          description: >-
            User information optionally provided when failing the request
            payment.
          items:
            $ref: '#/components/schemas/UserInfoEntry'
      description: User information provided across the payment lifecycle.
    AcceptRequestForPaymentRequest:
      type: object
      required:
        - payment_id
      properties:
        payment_id:
          type: string
          format: uuid
          example: 1bf93760-ef69-4697-b2b4-47d9e1c42aa7
          description: >-
            Unique identifier of payment associated with the request for
            payment.
        user_info:
          type: object
          description: User-provided data with arbitrary key/value pairs.
          properties: {}
      description: Use this JSON object to accept a request for payment.
    FailRequestForPaymentRequest:
      type: object
      properties:
        user_info:
          type: object
          description: User-provided data with arbitrary key/value pairs.
          properties: {}
      description: Use this JSON object to fail a request for payment.
    QuoteExpiries:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/QuoteExpiry'
      description: >-
        Provides a `content` array of quote expiry objects and a set of
        pagination information fields.
    QuoteExpiry:
      type: object
      properties:
        quote_ttl:
          type: number
          example: 5900
          description: >-
            Quote expiration window, or time to live (ttl), in seconds. To
            calculate the quote expiration date, xCurrent adds this value to the
            quote creation timestamp.
        sending_partner:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the sender, in the format `ripplenetaddress`.
            For example, `rn.us.sf.san_francisco`.
        receiving_partner:
          type: string
          example: rn.us.tx.austin
          description: >-
            RippleNet address of the receiver, in the format `ripplenetaddress`.
            For example, `rn.us.ny.new_york`.
        currency:
          type: string
          example: USD
          description: currency of the exchange rate.
        id:
          type: integer
          example: 2
          description: id of quote expiry object
      description: >-
        Use this JSON request object to update the quote time to live
        represented in seconds.
    PaymentExpiries:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PaymentExpiryResponse'
      description: >-
        Provides a `content` array of payment expiry objects and a set of
        pagination information fields.
    PaymentExpiry:
      type: object
      properties:
        payment_ttl:
          type: number
          example: 5900
          description: >-
            Payment expiration window, or time to live (ttl), in seconds. To
            calculate the payment expiration date, xCurrent adds this value to
            the payment creation timestamp.
        sending_partner:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the sender, in the format `ripplenetaddress`.
            For example, `rn.us.sf.san_francisco`.
        receiving_partner:
          type: string
          example: rn.us.tx.austin
          description: >-
            RippleNet address of the receiver, in the format `ripplenetaddress`.
            For example, `rn.us.ny.new_york`.
        currency:
          type: string
          example: USD
          description: currency of the exchange rate.
      description: >-
        Use this JSON request object to update the payment time to live
        represented in seconds.
    PaymentExpiryResponse:
      type: object
      properties:
        payment_ttl:
          type: number
          example: 5900
          description: >-
            Payment expiration window, or time to live (ttl), in seconds. To
            calculate the payment expiration date, xCurrent adds this value to
            the payment creation timestamp.
        sending_partner:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the sender, in the format `ripplenetaddress`.
            For example, `rn.us.sf.san_francisco`.
        receiving_partner:
          type: string
          example: rn.us.tx.austin
          description: >-
            RippleNet address of the receiver, in the format `ripplenetaddress`.
            For example, `rn.us.ny.new_york`.
        currency:
          type: string
          example: USD
          description: currency of the exchange rate.
        expiry_id:
          type: string
          format: uuid
          example: 4711728c-cd35-49ec-96a5-72732b4333ec
          description: id of payment expiry object
      description: >-
        Use this JSON request object to update the payment time to live
        represented in seconds.
    ExchangeTransfers:
      type: object
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              description: Provides an array of exchange transfer objects.
              items:
                $ref: '#/components/schemas/FiatExchangeTransferExecuteResponse'
      description: >-
        Provides a `content` array of exchange transfer objects and a set of
        pagination information fields.
    FiatExchangeTransferExecuteResponse:
      type: object
      required:
        - destination_amount
        - destination_currency
        - end_to_end_id
        - exchange_transfer_id
        - fx_transfer_rate
        - internal_id
        - receiver_address
        - sender_address
        - source_amount
        - source_currency
        - state
        - type
        - user_info
      properties:
        exchange_transfer_id:
          type: string
          format: uuid
          example: e3b20ba4-28ed-4752-990d-e67887bb331e
          description: Unique identifier of the exchange transfer.
        state:
          type: string
          example: EXECUTED
          description: State of the exchange transfer.
          enum:
            - EXECUTED
            - COMPLETED
            - FAILED
        type:
          type: string
          example: INDICATIVE
          description: |
            Indicates the exchange transfer's quoted FX rate type.
          enum:
            - FIRM
            - INDICATIVE
          x-enumDescriptions:
            FIRM: >-
              A firm exchange rate ensures that the quoted and delivered
              transfer amounts are equal.
            INDICATIVE: >-
              An indicative exchange rate allows for movement between quoted
              rate and transfer execution, such that the quoted amount and
              delivered amount may differ.
          default: FIRM
        sender_address:
          type: string
          example: sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: sf_gbp@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        source_amount:
          type: number
          example: 1
          description: Sending amount of the exchange transfer.
        destination_amount:
          type: number
          example: 355
          description: Receiving amount of the exchange transfer.
        source_currency:
          type: string
          example: USD
          description: Sending currency of the exchange transfer.
        destination_currency:
          type: string
          example: GBP
          description: Receiving currency of the exchange transfer.
        fx_transfer_rate:
          $ref: '#/components/schemas/ExchangeTransferRate'
        end_to_end_id:
          type: string
          description: >-
            ID set by the sender that is persisted on all fiat node instances
            that participated in the transfer.
        internal_id:
          type: string
          description: >-
            Internal ID that the sender can optionally specify. Only visible to
            the sender. Only the sending fiat node instance stores this ID.
        user_info:
          type: array
          description: >-
            Custom information set by a RippleNet address involved in the
            exchange transfer.
          items:
            $ref: '#/components/schemas/FiatExchangeTransferUserInfo'
      description: JSON response object that represents an exchange transfer.
    ExchangeTransferRate:
      type: object
      required:
        - base_currency
        - counter_currency
        - rate
        - rate_type
      properties:
        rate:
          type: number
          example: 0.89
          description: Exchange rate used to make the exchange transfer.
        base_currency:
          type: string
          example: USD
          description: Base currency for custom rate for the sending account.
        counter_currency:
          type: string
          example: GBP
          description: Counter currency for custom rate for the sending account.
        rate_type:
          type: string
          example: BUY
          description: >-
            Rate type used to make the exchange transfer. Valid values are `BUY`
            or `SELL`.
      description: Describes an exchange rate used in an exchange transfer.
    FiatExchangeTransferUserInfo:
      type: object
      required:
        - json
        - node_address
        - state
      description: >-
        Custom information about an exchange transfer provided by a RippleNet
        address involved in the exchange transfer.
      properties:
        node_address:
          type: string
          example: rn.us.ny.new_york
          description: >-
            RippleNet address of the fiat node instance that set the user
            information.
        state:
          type: string
          example: EXECUTED
          description: >-
            State of the exchange transfer set when the RippleNet address set
            the user information.
          enum:
            - EXECUTED
            - COMPLETED
            - FAILED
        json:
          type: object
          description: One or more arbitrary key/value pairs.
          properties: {}
        created_at:
          type: string
          format: date-time
          description: timestamp of when this user info was created
    FiatExchangeTransferExecuteRequest:
      type: object
      required:
        - amount
        - amount_type
        - receiver_address
        - sender_address
      properties:
        sender_address:
          type: string
          example: alias_usd_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_gbp_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: number
          minimum: 0
          example: 100
          description: >-
            Amount transferred, expressed in the curency of the account
            indicated by the `amount_type` value.
        amount_type:
          type: string
          example: SENDER_AMOUNT
          description: >-
            Amount type used for the exchange transfer.<p>To indicate that the
            `amount` is expressed in the currency of the account provided by the
            `sender_address` value, set to `SENDER_AMOUNT`.</p> <p>To indicate
            that the `amount` is expressed in the currency of the account
            provided by the `receiver_address` value, set to
            `RECEIVER_AMOUNT`.</p>
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
        end_to_end_id:
          type: string
          maxLength: 128
          example: 378910
          description: >-
            ID set by the sender that is persisted on all fiat node instances
            that participated in the transfer.
        internal_id:
          type: string
          maxLength: 128
          example: 1987
          description: >-
            Internal ID that the sender can optionally specify. Only visible to
            the sender. Only the sending fiat node instance stores this ID.
        user_info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
      description: JSON request object to execute an exchange transfer.
    FiatExchangeTransferQuoteRequest:
      type: object
      required:
        - amount
        - amount_type
        - receiver_address
        - sender_address
      properties:
        sender_address:
          type: string
          example: alias_usd_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_gbp_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: number
          minimum: 0
          example: 100
          description: >-
            Amount transferred, expressed in the curency of the account
            indicated by the `amount_type` value.
        amount_type:
          type: string
          example: SENDER_AMOUNT
          description: >-
            Amount type of the exchange transfer.<p>To indicate that the
            `amount` is expressed in the currency of the account provided by the
            `sender_address` value, set to `SENDER_AMOUNT`.</p> <p>To indicate
            that the `amount` is expressed in the currency of the account
            provided by the `receiver_address` value, set to
            `RECEIVER_AMOUNT`.</p>
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
      description: Use this JSON request body to request a quote for an exchange transfer.
    FiatExchangeTransferQuoteResponse:
      type: object
      required:
        - destination_amount
        - destination_currency
        - fx_transfer_rate
        - receiver_address
        - sender_address
        - source_amount
        - source_currency
        - type
      properties:
        type:
          type: string
          description: Indicates the exchange transfer's quoted FX rate type.
          default: FIRM
          example: INDICATIVE
          enum:
            - FIRM
            - INDICATIVE
          x-enumDescriptions:
            FIRM: >-
              A firm exchange rate ensures that the quoted and delivered
              transfer amounts are equal.
            INDICATIVE: >-
              An indicative exchange rate allows for movement between quoted
              rate and transfer execution, such that the quoted amount and
              delivered amount may differ.
        sender_address:
          type: string
          example: alias_usd_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_gbp_lon@rn.eur.uk.london
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        source_amount:
          type: number
          example: 100
          description: Sending amount of the exchange transfer.
        destination_amount:
          type: number
          example: 89
          description: Receiving amount of the exchange transfer.
        source_currency:
          type: string
          example: USD
          description: Sending currency of the exchange transfer.
        destination_currency:
          type: string
          example: GBP
          description: Receiving currency of the exchange transfer.
