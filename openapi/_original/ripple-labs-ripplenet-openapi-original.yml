        description:
          type: string
          example: No account / Unable to locate account
          description: >-
            Optional. User-defined string describing the reason for payment
            reversal. When using the reversal reason code `NARR` (Narrative),
            you must specify the reason for the return in the `reversal_reason`
            object's `description` attribute.
      description: A structured object detailing reasons for a payment reversal.
    PaymentAcceptRequest:
      type: object
      required:
        - quote_id
      properties:
        quote_id:
          type: string
          format: uuid
          example: 9bb53b3b-a774-43e2-9a1b-f18fbc3640f7
          description: ID of the quote to accept and continue as a payment.
        sender_end_to_end_id:
          type: string
          maxLength: 128
          description: >-
            ID that the sender can specify. Persisted on all RippleNet instances
            that participate in the payment.
        internal_id:
          type: string
          maxLength: 128
          description: >-
            Internal ID that the sender can specify. Only visible to the sender.
            Only the sending RippleNet instance stores this ID.
        user_info:
          type: object
          description: >
            Your receiver defines the required [User
            info](/products/payments-odl/api-docs/ripplenet/resources/srpo/user-info)
            structure. Provide the structure as required by your use case.


            **Payout Service (SLS) customers**: Use the ISO20022 descriptions
            used with the [RippleNet Payment Object
            (RPO)](/products/payments-odl/api-docs/ripplenet/resources/srpo/supporting-info-full-json-schema)
            structure.


            **One-to-one liquidation customers**: Use the [Outbound
            instructions](/products/payments-odl/api-docs/ripplenet/resources/outbound-instructions/#payout-examples)
            format.
          properties: {}
      description: >-
        Use this JSON request object to accept a quote ID to start the payment
        process.
    FilteredPayment:
      type: object
      description: >-
        A sanitized payment with sensitive content filtered from the `user_info`
        object.
      allOf:
        - $ref: '#/components/schemas/BasePayment'
        - type: object
        - $ref: '#/components/schemas/UserInfoArray'
    UserInfoArray:
      properties:
        user_info:
          type: array
          description: >-
            Collection of user-provided data whose keys are filtered based on a
            configurable denylist.
          items:
            $ref: '#/components/schemas/UserInfo'
    BasePayment:
      type: object
      required:
        - contract
        - contract_hash
        - crypto_transaction_id
        - execution_condition
        - execution_results
        - modified_at
        - payment_id
        - payment_state
        - payment_type
        - returned_by_payment_with_id
        - returns_payment_with_id
        - validator
      properties:
        payment_id:
          type: string
          format: uuid
          example: d485f100-2af7-4e48-9ab1-3c7e28775691
          description: Unique identifier of a payment.
        contract_hash:
          type: string
          example: ccb23bd87f13cc13b9d616a9723f76e112aeac8628b2082e0f8bf3b8c670b103
          description: >-
            Hash of all values in the Contract object used to ensure
            immutability. Once a payment transitions to the `LOCKED` state, the
            values in this object cannot change.
        payment_state:
          type: string
          example: COMPLETED
          description: >-
            State of the payment. For details about payment states, see
            **Payment States** in the _RippleNet Developer Guide_.
          enum:
            - ACCEPTED
            - AWAITING_COLLECTION
            - COMPLETED
            - EXECUTED
            - FAILED
            - FORWARDED
            - LOCK_DECLINED
            - LOCKED
            - PREPARED
            - RETURNED
            - SETTLEMENT_DECLINED
        modified_at:
          type: string
          format: date-time
          example: '2019-10-01T18:25:47.347Z'
          description: >-
            Date and time at which the payment was last modified, as an ISO-8601
            timestamp in UTC.
        contract:
          $ref: '#/components/schemas/PaymentContract'
        ripplenet_info:
          type: array
          description: >-
            Application-provided data explaining actions taken by RippleNet
            applications.
          items:
            $ref: '#/components/schemas/RippleNetInfo'
        execution_condition:
          type: string
          example: >-
            PrefixSha256Condition{subtypes=[ED25519-SHA-256],
            type=PREFIX-SHA-256,
            fingerprint=sfGGHCrkyaMsLQNB62w_4zarlPChHKm47JkXVQbs1z0,
            cost=132360}
          description: >-
            A Base64-encoded execution condition for this payment, the
            fulfillment of which will be presented to the validator to complete
            this payment. This value must match the `execution_condition` in the
            associated crypto transaction.
        crypto_transaction_id:
          type: string
          example: 4e05da26-7872-4a1f-b9b7-db7604757c37
          description: >-
            Unique identifier of the crypto transaction associated with this
            payment.
        validator:
          type: string
          example: rn.us.ca.san_francisco
          description: Address of the validator that validated the payment.
        payment_type:
          type: string
          example: REGULAR
          description: Payment type.
          enum:
            - REGULAR
            - RETURN
        returns_payment_with_id:
          type: string
          format: uuid
          description: >-
            If the `payment_type` is `RETURN`, provides the payment ID of the
            original payment that this payment returns. Otherwise, this field
            value is set to `null`.
        returned_by_payment_with_id:
          type: string
          format: uuid
          description: >-
            If the `payment_type` is `REGULAR` and the payment has an associated
            return payment, provides the payment ID of the return payment.
            Otherwise, this field value is set to `null`.
        execution_results:
          type: array
          description: >-
            Represents the actual movement of funds in a payment. Each execution
            result corresponds to a quote element and represents its execution
            in a payment.
          items:
            $ref: '#/components/schemas/ExecutionResult'
        liquidation_execution_results:
          type: array
          description: >-
            Represents the actual movement of funds in a payment as part of
            liquidation of a Wallet Receive payment.
          items:
            $ref: '#/components/schemas/ExecutionResult'
        liquidation_details:
          $ref: '#/components/schemas/LiquidationDetails'
        push_forward_execution_results:
          type: array
          description: >-
            Represents the movement of funds after an On-Demand Liquidity
            payment fails at intermediary transfer or destination exchange.
          items:
            $ref: '#/components/schemas/ExecutionResult'
      description: >-
        JSON response object that represents a payment. A payment is the
        movement of value across accounts on potentially different RippleNet
        instances involving one or more currencies.
    Payment:
      description: >-
        JSON response object that represents a payment. A payment is the
        movement of value across accounts on potentially different RippleNet
        instances involving one or more currencies.
      required:
        - user_info
        - internal_info
        - accepted_at
      allOf:
        - $ref: '#/components/schemas/BasePayment'
        - type: object
          properties:
            accepted_at:
              type: string
              format: date-time
              example: '2019-10-01T18:25:47.347Z'
              description: >-
                Date and time at which the payment was last accepted, as an
                ISO-8601 timestamp in UTC.
            locked_at:
              type: string
              format: date-time
              example: '2019-10-01T18:25:47.347Z'
              description: >-
                Date and time at which the payment was last locked, as an
                ISO-8601 timestamp in UTC.
            executed_at:
              type: string
              format: date-time
              example: '2019-10-01T18:25:47.347Z'
              description: >-
                Date and time at which the payment was last executed, as an
                ISO-8601 timestamp in UTC.
            completed_at:
              type: string
              format: date-time
              example: '2019-10-01T18:25:47.347Z'
              description: >-
                Date and time at which the payment was last completed, as an
                ISO-8601 timestamp in UTC.
            returned_at:
              type: string
              format: date-time
              example: '2019-10-01T18:25:47.347Z'
              description: >-
                Date and time at which the payment was returned, as an ISO-8601
                timestamp in UTC.
            internal_info:
              $ref: '#/components/schemas/InternalInfo'
            user_info:
              type: array
              description: User-provided data with arbitrary key/value pairs.
              items:
                $ref: '#/components/schemas/UserInfo'
    InternalInfo:
      required:
        - connector_role
        - internal_id
        - labels
      properties:
        connector_role:
          type: string
          example: RECEIVING
          description: >
            Role of the RippleNet node that sets one or more values in the
            Internal Info object.


            Use as follows:


            * `SENDING`: Sending account in the payment resides on this
            RippleNet instance.

            * `RECEIVING`: Receiving account in the payment resides on this
            RippleNet instance.

            * `INTERMEDIARY`: Neither sending nor receiving accounts in the
            payment reside on this RippleNet instance.

            * `INTERNAL`: Both sending and receiving accounts in the payment
            (usually between RippleNet Cloud and RippleNet) reside on this
            RippleNet instance.
          enum:
            - SENDING
            - RECEIVING
            - INTERMEDIARY
            - INTERNAL
        labels:
          type: array
          description: >-
            Array of objects that provide `label` values that are set by
            including the `sub_state` field at any stage of the payment's
            lifecycle. Labels can used as a filtering mechanism when searching
            for payments. Labels are visible only to the node that added them to
            this copy of a payment. If the values that populate this array are
            not set in the request or if the values set in the request are not
            viewable by your node, this array is empty.
          items:
            $ref: '#/components/schemas/Label'
        internal_id:
          type: string
          description: >-
            ID that is viewable only to the node that set it. This value can be
            set by the sender when accepting a payment. This value can also be
            set by any intermediary and the receiver when locking the payment.
            If this value is not set in the request or if the value set in the
            request is not viewable by your node, this field value is set to
            `null`.
      description: >-
        JSON object containing information that only the RippleNet instance that
        set it can view. These values can be set by the sender when accepting a
        payment and by an intermediary or receiver when locking the payment.
    Label:
      properties:
        label:
          type: string
          description: Label to be attached
      description: Label object
    PaymentContract:
      type: object
      required:
        - created_at
        - expires_at
        - quote
        - sender_end_to_end_id
      properties:
        sender_end_to_end_id:
          type: string
          description: >-
            ID that the sender can specify. Persisted on all RippleNet instances
            that participate in the payment.
          maxLength: 128
          minLength: 1
        created_at:
          type: string
          format: date-time
          example: '2019-10-01T18:18:13.665Z'
          description: >-
            Date and time at which this payment contract was created, as an
            ISO-8601 timestamp in UTC.
        expires_at:
          type: string
          format: date-time
          example: '2019-10-01T18:55:22.824Z'
          description: >-
            Date and time after which this payment contract expires, as an
            ISO-8601 timestamp in UTC.
          default: 300s/300000ms
        quote:
          $ref: '#/components/schemas/Quote'
        fee_info:
          $ref: '#/components/schemas/FeeInfo'
      description: >-
        Represents all immutable parts of a payment agreed upon by all
        participants as a part of the [Lock payment](#operation/lockPayment)
        flow. Once a payment transitions to the `LOCKED` state, the values in
        this object cannot change.
    FeeInfo:
      type: object
      required:
        - nodes
        - total_fees
      properties:
        nodes:
          type: object
          description: Fees charged by each node participating in the payment.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FeeDetails'
        total_fees:
          type: array
          description: Total fees charged in the payment, separated by currency.
          items:
            $ref: '#/components/schemas/TotalFees'
      description: Itemized list of fees charged by each node.
    FeeDetails:
      type: object
      required:
        - fee_value
        - fee_currency
        - category
      properties:
        fee_value:
          type: number
          description: value of the fee
        fee_currency:
          type: string
          description: currency of the fee charged
        category:
          type: string
          description: category of the fee
        fee_description:
          type: string
          description: optional description of the fee
    TotalFees:
      type: object
      required:
        - total_fee
        - fee_currency
      properties:
        total_fee:
          type: number
          description: total value of fee
        fee_currency:
          type: string
          description: currency of the fee charged
    UserInfo:
      type: object
      required:
        - accepted
        - completed
        - executed
        - failed
        - forwarded
        - lock_declined
        - locked
        - node_address
        - retry_accept
        - retry_settlement
        - returned
        - settlement
        - settlement_declined
      properties:
        node_address:
          type: string
          example: rn.us.ca.san_francisco
          description: RippleNet address of the node that provided the user information.
        accepted:
          type: array
          description: User information optionally provided when accepting the payment.
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        locked:
          type: array
          description: >-
            User information optionally provided when locking the payment. For
            more information, see [User Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        lock_declined:
          type: array
          description: >-
            User information optionally provided when declining to lock the
            payment. For more information, see [User Info Entry
            Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        retry_accept:
          type: array
          description: >-
            User information optionally provided when retrying acceptance of the
            payment. For more information, see [User Info Entry
            Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        retry_settlement:
          type: array
          description: >-
            User information optionally provided when retrying settlement of the
            payment. For more information, see [User Info Entry
            Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        settlement:
          type: array
          description: >-
            User information optionally provided when settling the payment. For
            more information, see [User Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        settlement_declined:
          type: array
          description: >-
            User information optionally provided when settlement for the payment
            is declined. For more information, see [User Info Entry
            Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        failed:
          type: array
          description: >-
            User information optionally provided when failing the payment. For
            more information, see [User Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        executed:
          type: array
          description: >-
            Payment sub-state information provided using `sub_state` and `memo`
            fields when finalizing the payment. For more information, see [User
            Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        completed:
          type: array
          description: >-
            User information optionally provided when completing the payment.
            For more information, see [User Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        forwarded:
          type: array
          description: >-
            If applicable, user information optionally provided when forwarding
            the payment. For more information, see [User Info Entry
            Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
        returned:
          type: array
          description: >-
            If applicable, information optionally provided using
            `return_reasons` when returning the payment. For more information,
            see [User Info Entry Object][user-info-entry].
          items:
            $ref: '#/components/schemas/UserInfoEntry'
      description: User information provided across the payment lifecycle.
    UserInfoEntry:
      type: object
      required:
        - created_at
        - json
      properties:
        json:
          type: object
          description: >-
            User information provided across the payment lifecycle stored as
            arbitrary JSON key/value pairs.
          properties: {}
        created_at:
          type: string
          format: date-time
          description: >-
            Date and time at which the user information was added to the
            payment, as an ISO-8601 timestamp in UTC.
        subState:
          type: string
          example: EXECUTING
          description: If provided, this parameter descibes payment state more granularly.
      description: User information provided as arbitrary key/value pairs.
    RippleNetInfo:
      type: object
      required:
        - node_address
        - settlement_declined
      properties:
        node_address:
          type: string
          example: rn.us.ny.new_york
          description: >-
            RippleNet address of the node from which the RippleNetInfo
            originated.
        settlement_declined:
          type: array
          description: >-
            If applicable, provides an array of RippleNetInfoEntry's explaining
            transitions into the `SETTLEMENT_DECLINED` state
          items:
            $ref: '#/components/schemas/RippleNetInfoEntry'
      description: >-
        Application-generated information explaining actions taken by RippleNet
        applications.
    RippleNetInfoEntry:
      type: object
      properties:
        info:
          type: string
          example: L001
          description: >-
            Information explaining the action taken by a RippleNet application.
            Could be a RippleNet error code, or a written explanation of the
            action taken
        created_at:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            The DateTime that this quote was created, as an ISO-8601 timestamp
            in UTC.
      description: >-
        Application-generated information explaining an action taken by a
        RippleNet application
    ExecutionResult:
      type: object
      required:
        - execution_result_id
        - execution_result_order
        - execution_result_type
        - execution_timestamp
        - receiver_address
        - receiving_amount
        - receiving_fee
        - sender_address
        - sending_amount
        - sending_fee
      properties:
        execution_result_id:
          type: string
          format: uuid
          example: 06f6d4e2-3523-4d17-92fd-53192a06207f
          description: Unique identifier for this payment result.
        execution_timestamp:
          type: string
          format: date-time
          example: '2019-10-01T18:24:29.867Z'
          description: >-
            Date and time at which this portion of the payment was executed, as
            an ISO-8601 timestamp in UTC.
        execution_result_type:
          type: string
          example: TRANSFER
          description: >-
            Type of payment execution result.<p><ul> <li>`TRANSFER` represents
            the movement of funds between two accounts.</li> <li>`EXCHANGE`
            represents the exchange of currencies between two accounts.</li>
            <li>`EXCHANGE_TRADE` represents the exchange of fiat to digital
            currency on a digital exchange.</li> <li>`CRYPTO_TRANSFER`
            represents the movement of digital funds between two digital
            exchanges.</li> </ul></p>
          enum:
            - TRANSFER
            - EXCHANGE
            - EXCHANGE_TRADE
            - CRYPTO_TRANSFER
        execution_result_order:
          type: integer
          example: 1
          description: >-
            Order in which the payment execution action was taken along the
            liquidity path. For example, a payment may include five execution
            results along the liquidity path. Each execution result has an order
            number that indicates the order in which the execution result was
            achieved to make the payment.
        sender_address:
          type: string
          example: trans_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        sending_amount:
          type: number
          example: 498
          description: Amount the sender is sending.
        receiving_amount:
          type: number
          example: 498
          description: Amount the receiver is receiving.
        sending_fee:
          type: number
          example: 2
          description: Fees the sender is charging.
        receiving_fee:
          type: number
          example: 0
          description: Fees the receiver is charging.
        sending_currency_code:
          type: string
          example: USD
          description: >-
            Currency code of the sending amount. Included in execution results
            with `execution_result_type` set to `EXCHANGE`.
        receiving_currency_code:
          type: string
          example: GBP
          description: >-
            Currency of the receiving amount. Included in execution results with
            `execution_result_type` set to `EXCHANGE`.
        fx_rate:
          $ref: '#/components/schemas/FXRate'
        transfer_currency_code:
          type: string
          description: >-
            Currency of the transfer. Returned in execution results with
            `execute_result_type` set to `TRANSFER`.
        intermediary_delta:
          type: number
          example: 0.2
          description: >-
            Amount of XRP representing the difference in FX rate between the
            moment of quoting and the moment of execution. A positive value is
            the amount taken out of the incentive pool. A negative value is the
            amount returned to the incentive pool. (Soon to be deprecated)
        incentive_type:
          type: string
          example: firm
          description: >-
            Configuration of the incentive pool on the xRapid side. Two values
            are supported, `firm` and `fx`. For `firm`, xRapid guarantees that
            the FX rate at the moment of execution is the same as at the moment
            of quoting. For `fx`, xRapid guaratees a predefined FX rate.
        incentive_value:
          type: number
          example: 0.2
          description: >-
            Amount of XRP representing the difference in FX rate between the
            moment of quoting and the moment of execution. A positive value is
            the amount taken out of the incentive pool. A negative value is the
            amount returned to the incentive pool.
        transaction_hash:
          type: string
          example: 5.5467794184785867e+76
          description: >-
            Hash representing the unique identifier for the transfer of funds in
            the XRP ledger.
        venue_id:
          type: string
          example: nz7RpAujYgnQtjEM
          description: >-
            The id from an exchange associated with a transaction involving an
            exchange account.
        fiat_adjusted_value:
          type: number
          example: 0.02
          description: >-
            Represents the delta between quoted and received executed amounts,
            for exchange trades.
        odl_payment_id:
          type: string
          description: >-
            Payment ID in On-Demand Liquidity (ODL) for an executed ODL payment
            containing the transaction represented by this execution result.
      description: >-
        Represents the actual movement of funds in a payment. Each execution
        result corresponds to a quote element and represents its execution in a
        payment. Included once the payment is in `EXECUTED` state.
    PaymentLockRequest:
      type: object
      properties:
        internal_id:
          type: string
          maxLength: 128
          description: >-
            ID that intermediaries and the receiver can set when locking a
            payment. The ID is viewable only by the node that set it.
        user_info:
          type: object
          description: >-
            Provide one or more arbitrary key/value pairs. <p></p>
            <p><b>Caution&#58;</b> Ripple recommends that you always include
            this object, even when empty, to ensure that the RippleNet Payment
            Object includes the <code>created_at</code> timestamp, which records
            when the payment was locked. To add an empty object, include&#58;
            <code>&#123;&#34;user_info&#34;&#58;&#91;&#93;&#125;</code></p>
          properties: {}
      description: Use this JSON request object to lock a payment.
    PaymentDenyRequest:
      type: object
      required:
        - reasons
      properties:
        reasons:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
          example:
            type: RECEIVER_DATA_VALIDATION
            code: AC03
            reason: Creditor account number invalid or missing
      description: >-
        Use this JSON request object to fail a payment or reject a request to
        lock a payment.
    PaymentRetryAcceptRequest:
      type: object
      properties:
        user_info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
          example:
            SF ACCEPTED: Payment to NY
            last_name: Gonzalez
            first_name: Elle
      description: >-
        Use this JSON request object to move a payment from `LOCK_DENIED` state
        back to `ACCEPTED` state, making it available for locking by
        intermediaries and the receiver.
    PaymentSettleRequest:
      type: object
      properties:
        user_info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
      description: Use this JSON request object to begin payment settlement.
    PaymentFinalizeRequest:
      type: object
      required:
        - memo
        - sub_state
      properties:
        sub_state:
          type: string
          minLength: 1
          maxLength: 128
          example: FORWARDED
          description: >-
            Free-form string that describes a sub-state of the payment while it
            is in the `EXECUTED` state, for example, `FORWARDED` or
            `AWAITING_COLLECTION`. Displays as a `label` value in the `labels`
            array. Also displays as the `key` value in the receiving node's
            `user_info.executed` array.
        memo:
          type: string
          example: Heading to payout location
          description: >-
            Free-form details that describe the `sub_state` of the payment, for
            example, `with courier heading to payout location`. Displays as the
            `value` value in the receiving node's `user_info.executed` array.
      description: >-
        Use this JSON request object to mark a payment with finalized sub-states
        that reflect what is happening to the payment while it is in the
        `EXECUTED` state.
    PaymentSubStateRequest:
      type: object
      required:
        - memo
        - sub_state
      properties:
        sub_state:
          type: string
          minLength: 1
          maxLength: 128
          example: AMENDED
          description: >-
            Free-form string that describes a sub-state of the payment while it
            is in the `EXECUTED` state, for example, `FORWARDED` or
            `AWAITING_COLLECTION`. Displays as a `label` value in the `labels`
            array. Also displays as the `key` value in the receiving node's
            `user_info.executed` array.
        memo:
          type: string
          example: Last name must be corrected
          description: >-
            Free-form details that describe the `sub_state` of the payment, for
            example, `with courier heading to payout location`. Displays as the
            `value` value in the receiving node's `user_info.executed` array.
        info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
          example:
            last_name: Gonzales
      description: >-
        Use this JSON request object to mark a payment with finalized sub-states
        that reflect what is happening to the payment while it is in the
        `EXECUTED` state.
    PaymentCompleteRequest:
      type: object
      properties:
        user_info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
      description: Use this JSON request object to complete a payment
    Payments:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
      description: 'Paged response for payments includes:'
    NodeStatus:
      type: object
      required:
        - nodeAddress
        - pathOrder
        - paymentId
        - paymentState
      properties:
        paymentId:
          type: string
          format: uuid
          example: efdf213c-9f64-43f7-80ab-15e7b4d139ae
          description: Unique identifier of the payment.
        paymentState:
          type: string
          description: >-
            State of the payment. This API only recognizes payments in the
            <code>LOCKED</code> state. For more on payment states, see **Payment
            States** in the _RippleNet Developer Guide_.<p></p>
          example: LOCKED
          enum:
            - QUOTED
            - ACCEPTED
            - AWAITING_COLLECTION
            - COMPLETED
            - EXECUTED
            - FAILED
            - FORWARDED
            - LOCK_DECLINED
            - LOCKED
            - PREPARED
            - RETURNED
            - SETTLEMENT_DECLINED
        nodeAddress:
          type: string
          example: rn.eur.uk.london
          description: >-
            RippleNet address of the participating node reporting the payment
            state.
        pathOrder:
          type: integer
          format: int32
          example: 3
          description: >-
            Each node in the payment chain participates in sequence. Provides
            the order in the sequence in which this node participates.
      description: >-
        An array of objects that provide the following field values describing
        the state of a payment on each node participating in the payment.
    Transfers:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              description: Provides an array of transfer objects.
              items:
                $ref: '#/components/schemas/TransferResponse'
      description: >-
        Provides a `content` array of transfer objects and a set of pagination
        information fields.
    TransferResponse:
      type: object
      required:
        - amount
        - owner_address
        - receiver_address
        - sender_address
        - state
        - transfer_id
        - user_info
      properties:
        transfer_id:
          type: string
          format: uuid
          example: 9eca588f-e89d-4629-82fa-da9c4646310f
          description: Unique identifier of the transfer.
        state:
          type: string
          example: EXECUTED
          description: >-
            State of the transfer.<p>`QUOTED` and `PENDING` only apply when
            RippleNet is enabled to receive payments from xRapid. `QUOTED`
            represents an outbound transfer fee estimate. `PENDING` is the state
            of an outbound transfer executed by RippleNet (via xRapid) but not
            yet paid out by the digital exchange. If successfully paid out, the
            state becomes `COMPLETED`. If not successfully paid out by the
            digital exchange, the state becomes `FAILED`. </p>
          enum:
            - PREPARED
            - EXECUTED
            - COMPLETED
            - CANCELLED
            - FAILED
            - QUOTED
            - PENDING
            - OTHER
        owner_address:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            Owner RippleNet address, if different from the RippleNet address of
            the `sender_address` and `receiver_address`.
        sender_address:
          type: string
          example: trans_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: number
          example: 15
          description: Amount transferred, expressed in the account's currency.
        internal_id:
          type: string
          example: 9cf5aa4b-1e44-436a-ab7c-d399aec905da
          description: >-
            Internal ID that the sender can optionally specify. Only visible to
            the sender. Only the sending RippleNet instance stores this ID.
        end_to_end_id:
          type: string
          example: fd7559be-aa85-433f-a283-0cd58681cdf0
          description: >-
            ID that the sender can optionally specify. Persisted on all
            RippleNet instances that participated in the transfer.
        sending_fee:
          type: number
          description: >-
            Optional sending fee charged by a digital asset exchange for
            initiating an outbound transfer.
        created_at:
          type: string
          format: date-time
          example: '2019-10-01T21:28:28.354Z'
          description: The time when this transfer is created.
        user_info:
          type: array
          description: >-
            Custom information set by a RippleNet address involved in the
            transfer.
          items:
            $ref: '#/components/schemas/TransferUserInfo'
        labels:
          type: array
          example:
            - label1
            - label2
            - label3
          description: List of labels associated with this transfer
          items:
            type: string
      description: JSON response object representing a transfer.
    TransferUserInfo:
      type: object
      description: >-
        Custom information about a transfer provided by a RippleNet address
        involved in the transfer.
      required:
        - json
        - node_address
        - state
      properties:
        node_address:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the xCurrent instance that set the user
            information.
        state:
          type: string
          example: EXECUTED
          description: >-
            State of the transfer set when the RippleNet address set the user
            information.
          enum:
            - PREPARED
            - EXECUTED
            - COMPLETED
            - CANCELLED
            - FAILED
            - QUOTED
        json:
          type: object
          description: One or more arbitrary key/value pairs.
          properties: {}
        created_at:
          type: string
          format: date-time
          example: '2019-10-01T21:28:28.357Z'
          description: timestamp of when this user info was created
    TransferRequest:
      type: object
      required:
        - amount
        - receiver_address
        - sender_address
      properties:
        sender_address:
          type: string
          example: trans_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: conct_usd_sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: number
          minimum: 0
          example: 15
          description: Amount transferred, expressed in the account's currency.
        owner_address:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            Owner RippleNet address, if different from the RippleNet address of
            the `sender_address` and `receiver_address`.
        end_to_end_id:
          type: string
          maxLength: 128
          example: b09dd632-660e-48c8-907f-a4f3a7d12c18
          description: >-
            ID set by the sender that is persisted on all xCurrent instances
            that participated in the transfer.
        internal_id:
          type: string
          maxLength: 128
          example: 9ad3c119-1379-443b-9c0e-fa82c54ae78d
          description: >-
            ID set by the sender that is persisted on the sending xCurrent
            instance only.
        user_info:
          type: object
          description: Provide one or more arbitrary key/value pairs.
          properties: {}
      description: Use this JSON request body to execute a transfer.
    StatementResponse:
      type: object
      required:
        - account_name
        - closing_balance
        - currency
        - end_datetime
        - generated_at
        - opening_balance
        - owner
        - start_datetime
        - transactions
      properties:
        account_name:
          type: string
          example: trans_usd_sf
          description: Name of the account the statement covers.
        start_datetime:
          type: string
          format: date-time
          example: '2018-08-06T23:13:55.997Z'
          description: >-
            Lower bound of the date-time range the statement covers, as an
            ISO-8601 timestamp in UTC.
        end_datetime:
          type: string
          format: date-time
          example: '2020-08-06T23:13:55.997Z'
          description: >-
            Upper bound of the date-time range the statement covers, as an
            ISO-8601 timestamp in UTC.
        generated_at:
          type: string
          format: date-time
          example: '2019-10-01T21:58:23.621Z'
          description: >-
            Time at which the statement was generated, as an ISO-8601 timestamp
            in UTC.
        currency:
          type: string
          example: USD
          description: Currency supported by the account.
        owner:
          type: string
          example: rn.us.ca.san_francisco
          description: Owner of the account
        opening_balance:
          type: number
          example: 0
          description: Opening balance of the account for the given date range.
        closing_balance:
          type: number
          example: -909
          description: Closing balance of the account for the given date range.
        transactions:
          $ref: '#/components/schemas/Transactions'
      description: >-
        Provides a statement for an account that lists payments and transfers
        that impacted the account's balance during a specified date-time range.
    Transactions:
      type: object
      required:
        - content
        - first
        - last
        - number
        - numberOfElements
        - size
        - sort
        - totalPages
        - total_elements
      properties:
        content:
          type: array
          description: Provides an array of statement record objects.
          items:
            $ref: '#/components/schemas/StatementRecord'
        total_elements:
          type: integer
          format: int64
          example: 1
          description: total elements in paginated response
        sort:
          type: string
          description: retained for backward compatibility
        first:
          type: boolean
          example: true
          description: true if  this is the first page.
        last:
          type: boolean
          example: true
          description: true if  this is the last page.
        number:
          type: integer
          example: 0
          description: page number
        numberOfElements:
          type: integer
          example: 1
          description: Number Of elements in this request
        size:
          type: integer
          example: 10
          description: page size
        totalPages:
          type: integer
          example: 1
          description: Total number of pages for the given request
      description: >-
        Provides a `content` array of statement record objects and a set of
        pagination information fields.
    StatementRecord:
      type: object
      required:
        - balance_change
        - balance_result
        - created_at
        - end_to_end_id
        - internal_id
        - returned_by_payment_with_id
        - returns_payment_with_id
        - transaction_id
        - transaction_state
        - transaction_type
        - sender_address
        - receiver_address
      properties:
        transaction_id:
          type: string
          format: uuid
          example: 9eca588f-e89d-4629-82fa-da9c4646310f
          description: ID of the payment or transfer that caused an account balance change.
        transaction_type:
          type: string
          example: PAYMENT
          description: Type of transaction that caused an account balance change.
          enum:
            - PAYMENT
            - TRANSFER
            - EXCHANGE_TRANSFER
        transaction_state:
          type: string
          example: COMPLETED
          description: Current state of the payment or transfer.
        balance_change:
          type: number
          example: -15
          description: Account balance change caused by the transaction.
        balance_result:
          type: number
          example: -909
          description: Account balance after the transaction.
        created_at:
          type: string
          format: date-time
          example: '2019-10-01T21:28:28.354Z'
          description: >-
            Time at which the transaction was created, as an ISO-8601 timestamp
            in UTC.
        end_to_end_id:
          type: string
          example: 91ecb6bd-4dd8-4b53-a900-72b79f3064e4
          description: >-
            ID that the sender of a transaction can specify. Persisted on all
            xCurrent instances that participated in the transaction.
        internal_id:
          type: string
          example: 8afd8e99-4ad4-4f4e-9bb7-018ad8c3a89c
          description: >-
            Internal identifier that the sender can optionally specify. Only
            visible to the sender. Only the sending xCurrent instance stores
            this ID.
        venue_id:
          type: string
          example: nz7RpAujYgnQtjEM
          description: >-
            The id from an exchange associated with a transaction involving an
            exchange account.
        transaction_hash:
          type: string
          example: DB0AFC09E0A94FC1D11F8CBABA48A184E27094F8DD32FCBC46F316E98011E2A6
          description: >-
            Hash representing the unique identifier for the transfer of funds in
            the XRP ledger.
        returns_payment_with_id:
          type: string
          format: uuid
          description: >-
            The `payment_id` of the original payment that this payment returns,
            if this is a returned payment. Always set to `null` if the
            `transaction_type` is set to `TRANSFER`.
        returned_by_payment_with_id:
          type: string
          format: uuid
          description: >-
            The `payment_id` of the return payment that returned this payment,
            if this is a returned payment. Always set to `null` if the
            `transaction_type` is set to `TRANSFER`.
        balance_change_created_at:
          type: string
          format: date-time
          example: '2019-10-01T21:28:28.354Z'
          description: Timestamp of when the balance change was created
        sender_address:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the sending account. Always set to `null` if
            the `transaction_type` is set to `TRANSFER`.
        receiver_address:
          type: string
          example: rn.mx.mexico
          description: >-
            RippleNet address of the recieving account. Always set to `null` if
            the `transaction_type` is set to `TRANSFER`.
      description: Provides details about a transaction included in an account statement.
    Balances:
      type: object
      required:
        - errors
        - local_balance
        - remote_balances
      properties:
        local_balance:
          description: Provides balance details for accounts owned by a RippleNet address.
          items:
            $ref: '#/components/schemas/InstitutionBalance'
        remote_balances:
          type: array
          description: Provides balance details for accounts owned by a RippleNet address.
          items:
            $ref: '#/components/schemas/InstitutionBalance'
        errors:
          type: array
          description: Lists any errors encountered when returning balance details.
          items:
            type: string
      description: Provides balances for all accounts owned by a RippleNet address.
    InstitutionBalance:
      type: object
      required:
        - currency_balances
        - institution
        - institution_address
      properties:
        institution:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet unique internal ID of the institution that owns the
            balances provided in the `currency_balances` array.
        institution_address:
          type: string
          example: rn.us.ca.san_francisco
          description: >-
            RippleNet address of the institution that owns the balances provided
            in the `currency_balances` array.
        currency_balances:
          type: array
          description: >-
            Provides balance details for accounts owned by a RippleNet address.
            The response does not guarantee a fixed number of elements, or a
            fixed order of elements, in the returned list.
          items:
            $ref: '#/components/schemas/CurrencyBalance'
        pool_account_balances:
          type: array
          description: >-
            Provides balance details of pool accounts, along with RippleNet
            accounts linked to those pool accounts.
          items:
            $ref: '#/components/schemas/PoolAccountBalance'
      description: Provides balance details for accounts owned by a RippleNet address.
    CurrencyBalance:
      type: object
      required:
        - account_balances
        - aggregate_balance
        - currency
      properties:
        currency:
          type: string
          example: USD
          description: Currency of the balances provided.
        aggregate_balance:
          type: number
          example: 0
          description: Aggregated balance for the given currrency.
        account_balances:
          type: array
          description: >-
            Provides balance details for accounts that support the given
            currency.
          items:
            $ref: '#/components/schemas/AccountBalance'
      description: Provides balance details for accounts owned by a RippleNet address.
    AccountBalance:
      type: object
      properties:
        account_name:
          type: string
          example: trans_usd_sf
          description: >-
            Name of the account, which acts as the account's unique identifier
            on RippleNet.
        balance:
          type: number
          example: -909
          description: Balance available in the account.
        owner:
          type: string
          example: rn.us.ca.san_francisco
          description: RippleNet address of the owner of the account.
        currency:
          type: string
          example: USD
          description: Currency supported by the account.
        minimum_allowed_balance:
          type: number
          example: -1500000
          description: Minimum balance allowed for the account.
        maximum_allowed_balance:
          type: number
          example: 1000000
          description: Maximum balance allowed for the account.
        low_liquidity_threshold:
          type: number
          example: 1000
          description: >-
            When the `balance` value for a sender account meets or is less than
            this amount after payment settlement execution, a low-liquidity
            message is logged at the INFO level.
        owner_min_allowed_balance:
          type: number
          description: >-
            Minimum balance allowed by the owner of a nostro account. RippleNet
            Server uses the greater of this value and the
            `minimum_allowed_balance` to set the account balance minimum.
        owner_max_allowed_balance:
          type: number
          example: 1000000
          description: >-
            Maximum balance allowed by the owner of a nostro account. RippleNet
            Server uses the lesser of this value and the
            `maximum_allowed_balance` to set the account balance maximum.
      description: Provides balance details for each account owned by a RippleNet address.
    PoolAccountBalance:
      type: object
      properties:
        pool_account_name:
          type: string
          description: Name of the pool account.
        balance:
          type: number
          description: Aggregated balance of linked accounts which form this pool account.
        owner:
          type: string
          description: The RippleNet peer who owns this pool account.
        currency:
          type: string
          description: The currency of pool account.
        linked_accounts:
          type: array
          description: Accounts linked to this pool account.
          items:
            type: string
    Heartbeat:
      type: object
      required:
        - errors
        - peer_heartbeat_results
        - time_checked
        - xcurrent_node
      properties:
        time_checked:
          type: string
          format: date
          example: '2019-10-01'
          description: >-
            Time at which the heartbeat was checked, as an ISO-8601 timestamp in
            UTC.
        xcurrent_node:
          type: string
          example: rn.us.ny.new_york
          description: >-
            RippleNet address of the RippleNet server for which the heartbeat
            was checked. (Deprecated in favor of 'ripplenet_node' field, has
            exactly the same value).
        ripplenet_node:
          type: string
          example: rn.us.ny.new_york
          description: >-
            RippleNet address of the RippleNet server for which the heartbeat
            was checked.
        peer_heartbeat_results:
          type: object
          description: >-
            Provides a list of peer RippleNet addresses and their health
            statuses.
          additionalProperties:
            type: string
            enum:
              - HEALTHY
              - UNHEALTHY
        errors:
          type: array
          description: If applicable, provides one or more messages describing the error.
          items:
            type: string
      description: Provides the health status of the xCurrent server’s peers.
    Health:
      type: object
      required:
        - healthy
      properties:
        healthy:
          type: boolean
          example: true
          description: >-
            If set to `true`, the xCurrent server is up and running. If set to
            `false`, the xCurrent server is down.
        services:
          type: array
          description: List of services and their statuses returned by the health check.
          items:
            $ref: '#/components/schemas/HealthCheck'
        detail:
          type: string
          example: Failed to perform health check
          description: Reason for health check failure, if any.
      description: Provides a high-level status of the health of the xCurrent server.
    HealthCheck:
      type: object
      properties:
        service:
          type: string
          example: database
          description: Name of the service.
        healthy:
          type: boolean
          description: >-
            Returns `true` if the service is up and running, and `false` if it
            is down or unreachable.
        detail:
          type: string
          example: Message queue unreachable.
          description: Reason for health check failure, if any.
      description: Health check information for a single component.
    Page:
      type: object
      properties:
        first:
          type: boolean
          description: true if  this is the first page.
        last:
          type: boolean
          description: true if  this is the last page.
        number:
          type: integer
          description: page number
        numberOfElements:
          type: integer
          description: Number Of elements in this request
        size:
          type: integer
          description: page size
        totalElements:
          type: integer
          description: Total number of elements for the given request
          format: int64
        totalPages:
          type: integer
          description: Total number of pages for the given request
        sort:
          type: array
          description: Sort details of this page
          items:
            $ref: '#/components/schemas/Sort'
      description: Paginated response base object.
    Sort:
      type: object
      properties:
        direction:
          type: string
          description: Direction of the sort
          example: ASC
        property:
          type: string
        ignoreCase:
          type: boolean
        nullHandling:
          type: string
          example: NULLS_FIRST
        ascending:
          type: boolean
          example: true
        descending:
          type: boolean
          example: false
    AuditEvent:
      type: object
      description: >-
        Represents an audit trail of user actions and configuration changes (to
        accounts, fees, and rates) on RippleNet.
      properties:
        actor:
          type: string
          example: super_user_client
          description: Person or middleware who took the action.
        action:
          type: string
          example: KEY_UPDATE
          description: Action that triggered the event.
        eventId:
          type: string
          format: uuid
          example: 3d5d0831-762c-4e0c-980c-635b38fd9caf
          description: UUID representing the event.
        message:
          type: string
          example: |-
            Added public key class PublicKeyRecord {
                publicKey: MCowBQYDK2VwAyEAb8Q2YzrbTIwrUn7u5Q6hJimp7jBFHx500MfDM4XVNJ0=
                keyIntent: SIGNING_PUBLIC_KEY
                keyType: ED_25519
                keyVersion: 1
                expiryDateTime: 2089-09-23T17:27:50.331Z
            } for RippleNet address rn.us.ny.new_york
          description: Message describing the audit event.
        metadata:
          type: string
          example: >-
            {"ip":"0:0:0:0:0:0:0:1","uri":"/internal/key_service/addresses/rn.us.ny.new_york/keys"}
          description: Information about the event, such as IP Address and URI.
        domain:
          type: string
          example: CONFIG_MANAGEMENT
          enum:
            - USER_MANAGEMENT
            - CONFIG_MANAGEMENT
            - OTHER
          description: Represents the audit event domain.
        level:
          type: string
          example: INFO
          enum:
            - INFO
            - WARN
            - ERROR
          description: Represents the audit event level.
        timeStamp:
          type: string
          example: '2019-09-30T22:55:41.365000Z'
          description: Timestamp of the audit event.
    AuditEventResponse:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AuditEvent'
      description: Paged response for AuditEvent
    EventTrailEvent:
      type: object
      description: >-
        Represents a single event along the audit trail of a payment on
        RippleNet.
      properties:
        featureName:
          type: string
          example: payment
          description: >-
            Feature name associated with the entityId. Possible values are
            `payment`.
        eventDetail:
          type: string
          example: Updated Payment to state PREPARED
          description: Detailed description of the event.
        entityId:
          type: string
          format: uuid
          example: d485f100-2af7-4e48-9ab1-3c7e28775691
          description: UUID representing an event.
        messageAction:
          type: string
          example: STATE_CHANGE
          description: >-
            String representation of the action being taken, where `DS` =
            downstream and `US` = upstream in the messaging processing pipeline.
          enum:
            - DS_STARTED
            - DS_COMPLETED
            - US_STARTED
            - US_COMPLETED
            - STATE_CHANGE
            - FAILURE
        createdAt:
          type: string
          example: '2019-10-01T18:24:28.040000Z'
          description: Timestamp of the audit event.
        messageSender:
          type: string
          format: RippleNetAddress
          example: default
          description: >-
            The RippleNetAddress of the originator of the message that triggered
            the creation of this event.
        messageType:
          type: string
          example: SETTLEMENT_PREPARE
          description: >-
            The type of message that was being processed that triggered the
            creation of this event.
    QueuePaymentMessage:
      type: object
      description: >-
        Represents a payment message sent to a configured queue during payment
        processing
      required:
        - payment_id
        - payment_state
      properties:
        payment_id:
          type: string
          format: uuid
          description: Unique identifier of the payment.
        payment_state:
          type: string
          description: >-
            State of the payment. For details, see **Payment States** in the
            RippleNet documentation.
          enum:
            - QUOTED
            - ACCEPTED
            - AWAITING_COLLECTION
            - COMPLETED
            - EXECUTED
            - FAILED
            - FORWARDED
            - LOCK_DECLINED
            - LOCKED
            - PREPARED
            - RETURNED
            - SETTLEMENT_DECLINED
        payment_substate:
          type: string
          description: >-
            Arbitrary string attached to a payment to track its state between
            Executed and Completed.
        sending_address:
          type: string
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiving_address:
          type: string
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        payment_type:
          type: string
          example: RETURN
          description: Payment type.
          enum:
            - REGULAR
            - RETURN
        external_id:
          type: string
          maxLength: 128
          description: >-
            ID that the sender can specify. Persisted on all xCurrent instances
            that participate in the payment.
        created_at:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            Date and time at which this payment contract was created, as an
            ISO-8601 timestamp in UTC.
        expires_at:
          type: string
          format: date-time
          example: '2019-04-06T20:33:35Z'
          description: >-
            Date and time after which this payment contract expires, as an
            ISO-8601 timestamp in UTC.
        modified_date:
          type: string
          format: date-time
          example: '2018-04-06T20:33:35Z'
          description: >-
            Date and time at which the payment was last modified, as an ISO-8601
            timestamp in UTC.
        message_type:
          type: string
          description: Constant string representing the type of message.
          enum:
            - PAYMENT_STATE_CHANGE
    QueueRequestForPaymentMessage:
      type: object
      description: >-
        Represents a payment message sent to a configured queue during payment
        processing
      required:
        - created_at
        - request_for_payment_id
        - request_for_payment_state
      properties:
        request_for_payment_id:
          type: string
          format: uuid
          example: 5492648d-2132-4e70-9ded-2fc86f22b321
          description: Unique identifier of a request for payment.
        request_for_payment_state:
          type: string
          description: State of the request for payment.
          enum:
            - REQUESTED
            - ACCEPTED
            - FAILED
        created_at:
          type: string
          format: date-time
          example: '2018-12-13T20:13:41.708Z'
          description: >-
            Date and time at which the request for payment was created, as an
            ISO-8601 timestamp in UTC.
        payment_id:
          type: string
          format: uuid
          example: 5492648d-2132-4e70-9ded-2fc86f22b321
          description: Unique identifier of a payment associated to request for payment.
        message_type:
          type: string
          description: Constant string representing the type of message.
          enum:
            - REQUEST_FOR_PAYMENT_STATE_CHANGE
    QueueTransferMessage:
      type: object
      description: >-
        Represents a transfer message sent to a configured queue during tranfer
        API calls
      required:
        - transfer_id
        - transfer_state
      properties:
        transfer_id:
          type: string
          format: uuid
          description: Unique identifier of the payment.
        transfer_state:
          type: string
          description: >-
            State of the transfer.<p>`QUOTED` and `PENDING` only apply when
            xCurrent is enabled to receive payments from xRapid. `QUOTED`
            represents an outbound transfer fee estimate. `PENDING` is the state
            of an outbound transfer executed by xCurrent (via xRapid) but not
            yet paid out by the digital exchange. If successfully paid out, the
            state becomes `COMPLETED`. If not successfully paid out by the
            digital exchange, the state becomes `FAILED`. </p>
          enum:
            - PREPARED
            - EXECUTED
            - COMPLETED
            - FAILED
            - QUOTED
            - PENDING
            - OTHER
        internal_id:
          type: string
          description: >-
            Internal ID that the sender can optionally specify. Only visible to
            the sender. Only the sending xCurrent instance stores this ID.
        end_to_end_id:
          type: string
          description: >-
            ID that the sender can optionally specify. Persisted on all xCurrent
            instances that participated in the transfer.
        created_at:
          type: string
          format: date-time
          example: '2018-12-13T20:13:41.708Z'
          description: >-
            Date and time at which the request for transfer was created, as an
            ISO-8601 timestamp in UTC.
        message_type:
          type: string
          description: Constant string representing the type of message.
          enum:
            - TRANSFER_STATE_CHANGE
    QueueExchangeTransferMessage:
      type: object
      description: >-
        Represents a transfer message sent to a configured queue during tranfer
        API calls
      required:
        - exchange_transfer_id
        - exchange_transfer_state
      properties:
        exchange_transfer_id:
          type: string
          format: uuid
          description: Unique identifier of the payment.
        exchange_transfer_state:
          type: string
          description: State of the exchange transfer.
          enum:
            - EXECUTED
            - COMPLETED
            - FAILED
        end_to_end_id:
          type: string
          description: >-
            ID set by the sender that is persisted on all xCurrent instances
            that participated in the transfer.
        internal_id:
          type: string
          description: >-
            Internal ID that the sender can optionally specify. Only visible to
            the sender. Only the sending xCurrent instance stores this ID.
        created_at:
          type: string
          format: date-time
          example: '2018-12-13T20:13:41.708Z'
          description: >-
            Date and time at which the request for transfer was created, as an
            ISO-8601 timestamp in UTC.
        message_type:
          type: string
          description: Constant string representing the type of message.
          enum:
            - EXCHANGE_TRANSFER_STATE_CHANGE
    QueuePaymentLabelMessage:
      type: object
      description: >-
        Represents a payment label message sent to a configured queue when
        adding or removing labels
      required:
        - payment_id
        - payment_state
      properties:
        payment_id:
          type: string
          format: uuid
          description: Unique identifier of the payment.
        added_labels:
          type: array
          items:
            type: string
          description: List of labels added to the payment.
        deleted_labels:
          type: array
          items:
            type: string
          description: List of labels removed from the payment.
        message_type:
          type: string
          description: Constant string representing the type of message.
          enum:
            - PAYMENT_MANAGEMENT
    AccountLookupMessage:
      type: object
      description: >-
        Represents an Account Lookup message that is sent to a configured queue
        when an Account Lookup request is requested or responded to.
      required:
        - account_lookup_id
        - account_lookup_status
      properties:
        account_lookup_id:
          type: string
          format: uuid
          description: Unique identifier of the account lookup.
        account_lookup_status:
          type: string
          description: State of the Account Lookup object.
          enum:
            - REQUESTED
            - PROCESSED
            - EXPIRED
            - FAILED
    PayoutMethodRequest:
      type: object
      description: Represents a request to create and update a payout method record.
      required:
        - payout_method
      properties:
        payout_method:
          type: string
          example: LOCAL_RAILS
          description: Unique string used in the quote to identify the payout method.
        description:
          type: string
          example: local rails
          description: User defined description of a payout method.
        is_default:
          type: boolean
          description: Flag to set this payout method as the default payout method.
        payout_method_category:
          type: string
          example: BOOK_TRANSFER
          description: >-
            Category of the payout method. Defaults to <code>OTHER</code> if not
            specified.
          enum:
            - REAL_TIME_GROSS_SETTLEMENT_SYSTEM
            - REAL_TIME_NET_SETTLEMENT_SYSTEM
            - MASS_NET_PAYMENT_SYSTEM
            - BOOK_TRANSFER
            - CASH_PAYOUT
            - WALLET_PAYMENT
            - OTHER
        estimated_time_to_credit:
          type: object
          description: >-
            The estimated time to credit the beneficiary using this payout
            method.
          properties:
            time_value:
              type: integer
              format: int64
              example: 5
              description: The amount of estimated time to credit.
            time_unit:
              type: string
              description: >-
                Unit of the estimated time to credit: <code>SECONDS</code>,
                <code>MINUTES</code>, <code>HOURS</code>, <code>DAYS</code>.
              enum:
                - SECONDS
                - MINUTES
                - HOURS
                - DAYS
          required:
            - time_value
            - time_unit
    PayoutMethods:
