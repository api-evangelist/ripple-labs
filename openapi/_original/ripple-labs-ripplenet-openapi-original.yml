        status:
          $ref: '#/components/schemas/ActivityStatus'
        notification_type:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_:]*$
          example: PARTNER_SUBSTATE
          description: >
            Activity context name.


            Use with the `status` parameter to define the action.


            Recommended values:


            | Value | Notification type |

            | --- | --- |

            | CONFIRM_LOCK | Confirm the lock  |

            | CONFIRM_SETTLE | Confirm settlement |

            | CONFIRM_COMPLETE | Confirm completion |

            | PARTNER_SUBSTATE | Notify on partner substate<br/><br/>Use with
            `output.sub_state` to provide additional information. |
        output:
          $ref: '#/components/schemas/ActivityOutput'
        error:
          type: array
          description: >
            Array of one or more activity error objects.


            When `status` is `FAILURE` or `DECLINED`, use this to fail a payment
            or decline a request to lock a payment.


            For all other `status` values, this property can be null.
          items:
            $ref: '#/components/schemas/ActivityError'
          example: 'null'
    ActivityOutput:
      type: object
