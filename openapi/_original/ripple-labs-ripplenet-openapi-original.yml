      security:
        - Bearer: []
    post:
      tags:
        - Rates
      summary: Create rate
      description: >
        Creates an exchange rate for a specified currency pair.


        **Example** - Applying a margin to the live FX rate:<br>

        A USD-GBP live FX rate of 0.80 is provided by a third-party rate
        provider and you want to reduce that rate by 20 BPS. In this API call,
        you would set `"value_type": "MARGIN"`, then `"margin_type": "BPS"`, and
        `"rate": "20"`. After that, during the `Get quotes` call, the final FX
        rate will be calculated as 0.80*(1-(20/10000))=`0.7984` and then applied
        during quote creation.
      operationId: createRate
      requestBody:
        $ref: '#/components/requestBodies/RateRequest'
      responses:
        '200':
          description: Successfully created rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '400':
          description: Request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /config/rates/{rate_id}:
    get:
      tags:
        - Rates
      summary: Get rate by ID
      description: Gets a configured exchange rate by ID.
      operationId: getRateById
      parameters:
        - name: rate_id
          in: path
          description: Provide the `rate_id` of the exchange rate you want to return.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sucessfully returned rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '404':
          description: Rate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
    put:
      tags:
        - Rates
      summary: Update rate
      description: >
        Updates an existing exchange rate. With this call, you can change
        `value_type` from `RATE` to `MARGIN` (and vice versa), change the actual
        `rate` value of the specified value type, or both.


        **Example** - Updating an existing margin applied to the live FX
        rate:<br>

        A USD-GBP live FX rate of 0.80 is provided by a third-party rate
        provider and you currently reduce that rate by 20 BPS. You now want to
        change it and reduce it by 10 BPS instead. To do so, set `"rate": "10"`
        in the request. Once the change is applied, the final FX rate is
        calculated as 0.80*(1-(10/10000))=`0.7992` during the `Get quotes` call,
        and then applied during quote creation.
      operationId: updateRate
      parameters:
        - name: rate_id
          in: path
          description: Provide the `rate_id` of the exchange rate you want to update.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/RateRequest'
      responses:
        '200':
          description: Successfully updated rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '400':
          description: Request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
    delete:
      tags:
        - Rates
      summary: Delete rate
      description: >-
        Deletes an exchange rate. Once deleted, an exchange rate cannot be
        accessed.
      operationId: deleteRate
      parameters:
        - name: rate_id
          in: path
          description: Provide the `rate_id` of the exchange rate you want to delete.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully deleted rate.
