    PaymentQuoteRequest:
      type: object
      required:
        - amount
        - currency
        - quote_type
        - receiving_address
        - sending_address
      properties:
        sending_address:
          type: string
          example: sf@rn.us.ca.san_francisco
          description: |
            RippleNet account name and address of the sender.

            **Format**: `accountname@ripplenetaddress`

            **Example**: `new_york@rn.us.ny.new_york`
        receiving_address:
          type: string
          example: sf_gbp@rn.us.ca.san_francisco
          description: |
            RippleNet account name and address of the receiver.

            **Format**: `accountname@ripplenetaddress`

            **Example**: `new_york@rn.us.ny.new_york`
        amount:
          type: string
          minimum: 1
          example: '1'
          description: >
            Amount to be sent or received, depending on the `quote_type`.


            Use this table to determine what `amount` to assign.


            **Example**: `"1"`


            | Quote type | Amount |

            | --- | --- |

            | SENDER_AMOUNT | Amount to be sent by the payment originator |

            | SENDER_INSTITUTION_AMOUNT | Set to `SENDER_INSTITUTION_AMOUNT` to
            calculate the quote based on the amount to be sent, plus any fees
            collected by the sending institution |

            | RECEIVER_AMOUNT | Amount to be received by the payment beneficiary
            |

            | RECEIVER_INSTITUTION_AMOUNT | Set to `RECEIVER_INSTITUTION_AMOUNT`
            to calculate the quote based on the amount to be received, minus any
            fees collected by the receiving institution |
        currency:
          type: string
          example: USD
          description: >
            Currency code of the amount to be sent or received, depending on the
            `quote_type`.


            Use this table to determine what `currency` code to assign.


            **Example**: `USD`


            | Quote type | Currency code description |

            | --- | --- |

            | SENDER_AMOUNT | Specify the currency code for the sending
            currency, for example `USD` |

            | SENDER_INSTITUTION_AMOUNT | Specify the currency code for the
            sending currency, for example `USD` |

            | RECEIVER_AMOUNT | Specify the currency code for the receiving
            currency, for example `USD` |

            | RECEIVER_INSTITUTION_AMOUNT | Specify the currency code for the
            receiving currency, for example `USD` |
        quote_type:
          type: string
          example: SENDER_AMOUNT
          description: |
            Specifies how to calculate the quote.

            **Example**: `SENDER_AMOUNT`
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
          x-enumDescriptions:
            SENDER_AMOUNT: >-
              Quote based on the amount the payment originator or originating
              institution wants to send
            SENDER_INSTITUTION_AMOUNT: >-
              Quote based on the amount (to debit the originator) is `amount`
              plus any fees to be collected by the sending institution
            RECEIVER_AMOUNT: >-
              Quote based on the amount the payment beneficiary or beneficiary
              institution should receive
            RECEIVER_INSTITUTION_AMOUNT: >-
              The amount (to credit the beneficiary) is `amount` minus any fees
              to be collected by the receiving institution
        sender_or_receiver_currency:
          type: string
          description: |
            Currency code of the sender or receiver based on `quote_type`.

            If provided, you can use this to filter the options for quotes.
          example: USD
        custom_fee:
          type: number
          description: >
            Custom fee for the sending account.


            Setting this field overrides all fees configured on the sender's
            RippleNet instance.
        custom_rate:
          $ref: '#/components/schemas/PaymentQuoteCustomRateRequest'
        quote_route:
          type: array
          example:
            - rn.us.ca.san_francisco
            - rn.us.tx.austin
            - rn.us.ny.new_york
          description: >
            Custom route that quote must follow.


            Provide an array of RippleNet address strings that convey the route
            the quote must follow.


            **Example**: `g.us.ca.san_francisco`
          items:
            type: string
        payment_method:
          type: string
          description: >
            Payout method for the quote.


            Senders can use this field to define the payout method that the
            receiver should use to deliver the payment to end

            customer.


            On-Demand Liquidity (ODL) receivers should set `payment_method` to
            the `outlet_id` or the string `none` (not an empty value)

            to keep funds at the destination exchange when paying out to a local
            rail.


            **Caution**: The existing quote parameter is named `payment_method`
            while elsewhere it is `payout_method`.
        enable_quote_per_payout_method:
          type: boolean
          example: true
          description: >-
            Enable this flag to generate quotes using payout methods configured
            by the receiver.
        digital_asset_origination:
          type: boolean
          description: >
            When true, this flag tells RippleNet to provide a full quote as if
            the payment originates in the specified source fiat currency.


            The quote for the source exchange excludes trading fees.


            On execution, the source exchange trade is skipped, and XRP is
            withdrawn from the source exchange as the first step.
          example: false
        force_path_finding_and_liquidity_path_finding:
          type: boolean
          description: >
            When true, this flag tells RippleNet to ignore cached value for path
            finding and liquidity path finding.


            Force performing new path finding and liquidity path finding.
          example: false
          default: false
        payout_method_category:
          type: string
          example: BOOK_TRANSFER
          description: >-
            Category the payout method will be associated with. Defaults to
            `OTHER` if not specified.
          enum:
            - REAL_TIME_GROSS_SETTLEMENT_SYSTEM
            - REAL_TIME_NET_SETTLEMENT_SYSTEM
            - MASS_NET_PAYMENT_SYSTEM
            - BOOK_TRANSFER
            - CASH_PAYOUT
            - WALLET_PAYMENT
            - OTHER
          x-enumDescriptions:
            REAL_TIME_GROSS_SETTLEMENT_SYSTEM: Real-time gross settlement system
            REAL_TIME_NET_SETTLEMENT_SYSTEM: Real-time net settlement system
            MASS_NET_PAYMENT_SYSTEM: Mass net payment system
            BOOK_TRANSFER: Book transfer
            CASH_PAYOUT: Cash payout
            WALLET_PAYMENT: Wallet payment
            OTHER: Other
        sender_segregated_account:
          type: string
          maxLength: 254
          example: conct_php_receiver_coins_sender@receiver
          description: >
            RippleNet account name and address of the sender owned account at
            receiver to be used for failure conversion (in case of payment
            failure).


            **Format**: `accountname@ripplenetaddress`


            **Example**: `new_york@rn.us.ny.new_york`
        quote_limit:
          type: integer
          description: >-
            Flag for truncating the total amount of quotes to a maximum amount
            after sorting and filters are applied. Optional.
        quote_filter_types:
          type: array
          description: Filter on a type of quote.
          items:
            type: string
            enum:
              - LIQUIDITY_WARNINGS
              - QUOTE_ERRORS
            x-enumDescriptions:
              LIQUIDITY_WARNINGS: Filter for liquidity warnings
              QUOTE_ERRORS: Filter for quote errors
      description: JSON request object to generate a quote collection.
    PaymentQuoteCustomRateRequest:
      type: object
      required:
        - base_currency
        - counter_currency
        - rate
        - rate_type
      properties:
        rate:
          type: number
          description: Exchange rate for a base and counter currency.
        base_currency:
          type: string
          description: Base currency of the exchange rate.
        counter_currency:
          type: string
          description: Counter currency of the exchange rate.
        rate_type:
          type: string
          enum:
            - buy
            - sell
          description: >-
            Order type for the exchange rate. Valid values are `sell` or `buy`.
            <p><ul><li>When rate_type = buy, `base_currency` is source ccy and
            `counter_currency` is destination ccy.</li> <li>When rate_type =
            sell, `base_currency` is destination ccy and `counter_currency` is
            source ccy.</li> </ul></p>
      description: >-
        JSON request object to specify a custom exchange rate during quote
        collection generation.
    QuoteCollection:
      type: object
      required:
        - quote_collection_id
        - quotes
      properties:
        quote_collection_id:
          type: string
          format: uuid
          example: 4711728c-cd35-49ec-96a5-72732b4333ec
          description: Unique identifier of the quote collection.
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
          description: >-
            For more information on quote elements, see [Create quote
            collections](/products/payments-odl/api-docs/ripplenet/tutorials/configure-fees#create-quote-collections).
        quote_errors:
          type: array
          items:
            $ref: '#/components/schemas/QuoteError'
      description: >-
        When provided as a response to the [Create quote
        collection](#operation/createQuoteCollection) request, provides a JSON
        object representing quotes for a proposed payment. <p>When provided as a
        response to the [Create quote to return
        payment](#operation/createQuoteToReturnPayment)  request, provides a
        JSON object representing quotes for a proposed return payment.</p>
        <p>When provided as a response to the [Reverse
        Payment](#operation/createQuoteToReversePayment) request, provides a
        JSON object representing a quote for a proposed reverse payment.</p>
        <p>When provided as a response to the [Get quote collection by
        ID](#operation/createQuoteCollection) request, provides the requested
        quote collection.</p>
    QuoteError:
      type: object
      required:
        - failed_path
        - error_message
      properties:
        failed_path:
          type: array
          description: Quote path that failed.
          items:
            $ref: '#/components/schemas/QuotePathRos'
        error_origin:
          type: string
          description: >-
            RippleNet address of where the error originated. For example,
            `rn.us.ny.new_york`.
        error_message:
          type: string
          description: Message that describes the error.
      description: Object that describes an error that happened during quote collection.
      x-docs-model-object:
        object-name: Quote Error Object
        nested-objects-array:
          - property-name: failed_path
            object: quote-path
            docs-name: Quote Path Array
            data-type: Array
            has-nested-display: true
    QuotePath:
      type: object
      required:
        - source
        - destination
        - source_currency
        - destination_currency
      properties:
        source:
          type: string
          description: >-
            RippleNet account name and address of the source account, in the
            format `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        destination:
          type: string
          description: >-
            RippleNet account name and address of the destination account, in
            the format `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        source_currency:
          type: string
          description: Currency associated with the source account.
        destination_currency:
          type: string
          description: Currency associated with the destination account.
        account_liquidity_relationship_id:
          type: string
          format: uuid
          example: 480e3a6f-3bcd-48cd-9ce9-9d940aa3c9c6
          description: Unique identifier for an account liquidity relationship.
        peer_liquidity_relationship_id:
          type: string
          format: uuid
          example: 480e3a6f-3bcd-48cd-9ce9-9d940aa3c9c6
          description: Unique identifier for a peer liquidity relationship.
        quote_path_order:
          type: integer
          example: 1
          description: Order of each quote path.
      description: Object that describes a liquidity path used to generate a quote.
    Quote:
      type: object
      required:
        - amount
        - created_at
        - currency_code
        - currency_code_filter
        - expires_at
        - liquidity_warning
        - price_guarantee
        - quote_elements
        - quote_id
        - receiver_address
        - sender_address
        - service_type
        - type
      properties:
        quote_id:
          type: string
          format: uuid
          example: 2a547e56-4aac-4375-86a8-8b3e7014801d
          description: Unique identifier for the quote.
        created_at:
          type: string
          format: date-time
          example: '2020-01-29T20:59:44.925Z'
          description: >-
            Date and time at which the quote was created, as an ISO-8601
            timestamp in UTC.
        expires_at:
          type: string
          format: date-time
          example: '2020-01-29T21:29:44.925Z'
          description: >-
            Date and time after which the quote and its pricing expire, as an
            ISO-8601 timestamp in UTC.
          default: 300s/300000ms
        type:
          type: string
          example: SENDER_AMOUNT
          description: >-
            Indicates how the amount field should be treated for calculating
            quote values.
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
            - REVERSAL_AMOUNT
        price_guarantee:
          type: string
          example: FIRM
          description: >-
            Indicates whether a quote's pricing is `INDICATIVE` or `FIRM`. An
            `INDICATIVE` quote allows for price movements between quote issuance
            and payment execution, such that the quoted amount and delivered
            amount may differ. A `FIRM` quote ensures that the quoted and
            delivered payment amounts are equal.
          default: FIRM
        sender_address:
          type: string
          example: sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: sf_gbp@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: string
          example: '1'
          description: Amount to be sent or received, depending on the `type` value.
        currency_code:
          type: string
          example: USD
          description: Currency code for the `amount` value.
        currency_code_filter:
          type: string
          example: EUR
          description: >-
            Currency code that can be used to filter quotes at the opposite end
            of the quote request. For example, you can filter by this currency
            code to find the receiving currency for a quote with a
            `SENDER_AMOUNT` quote_type. If not sent in the request, this field
            value is set to `null`.
        service_type:
          type: string
          description: Returns `null`.
        quote_elements:
          type: array
          description: >-
            Transfer and exchange elements. A transfer element represents a
            movement of funds between two accounts. An exchange element
            represents the exchange of currencies between two accounts.
          items:
            $ref: '#/components/schemas/QuoteElement'
        liquidity_warning:
          type: string
          description: >-
            Triggered when a quote causes an account to go below its
            `minimum_allowed_balance`. Otherwise, this field value is set to
            `null`.
        payment_method:
          type: string
          example: LOCAL_RAILS
          description: Payout method for the quote.
        payment_method_fields:
          type: string
          example: >-
            {"category_id":"bank","required_originator_fields":[{"field_name":"sender_address","field_label":"Sender
            address"}]}
          description: JSON object containing payment method metadata.
        payout_method_info:
          type: object
          description: Details about the payout method.
          properties:
            payout_method_name:
              type: string
              example: Cash Payout
              description: Payout method for the quote.
            payout_method_category:
              type: string
              example: BOOK_TRANSFER
              description: >-
                Category of the payout method. Defaults to <code>OTHER</code> if
                not specified.
              enum:
                - REAL_TIME_GROSS_SETTLEMENT_SYSTEM
                - REAL_TIME_NET_SETTLEMENT_SYSTEM
                - MASS_NET_PAYMENT_SYSTEM
                - BOOK_TRANSFER
                - CASH_PAYOUT
                - WALLET_PAYMENT
                - OTHER
            description:
              type: string
              example: local rails
              description: User defined description of the payout method.
            estimated_time_to_credit:
              type: string
              example: 3 days
              description: >-
                The estimated time to credit the beneficiary using this payout
                method.
      description: >-
        JSON response object that represents a quote for a proposed payment or
        return payment.
    QuoteElement:
      type: object
      required:
        - quote_element_id
        - quote_element_order
        - quote_element_type
        - receiver_address
        - receiving_amount
        - receiving_fee
        - sender_address
        - sending_amount
        - sending_fee
      properties:
        quote_element_id:
          type: string
          format: uuid
          example: 259189e7-cb14-42e7-99ef-375f3285e356
          description: Unique identifier for the quote element.
        quote_element_type:
          type: string
          example: EXCHANGE
          description: >-
            Type of quote element.<p><ul> <li>`TRANSFER` represents the movement
            of funds between two accounts.</li> <li>`EXCHANGE` represents the
            exchange of currencies between two accounts.</li>
            <li>`EXCHANGE_TRADE` represents the exchange of fiat to digital
            currency on a digital exchange.</li> <li>`CRYPTO_TRANSFER`
            represents the movement of digital funds between two digital
            exchanges.</li> </ul></p>
          enum:
            - TRANSFER
            - EXCHANGE
            - EXCHANGE_TRADE
            - CRYPTO_TRANSFER
        quote_element_order:
          type: string
          example: '1'
          description: >-
            Order of each quote element along the liquidity path. If a quote
            includes five quote elements, each one is enacted according to its
            quote_element_order number to make the proposed payment.
        sender_address:
          type: string
          example: sf@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiver_address:
          type: string
          example: sf_gbp@rn.us.ca.san_francisco
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        sending_amount:
          type: number
          example: 1
          description: Amount the sender is sending.
        receiving_amount:
          type: number
          example: 355
          description: Amount the receiver is receiving.
        sending_fee:
          type: number
          example: 0
          description: >-
            Fees the sender is charging. When `quote_element_type` is set to
            `EXCHANGE`, this field value is always set to `0`.
        receiving_fee:
          type: number
          example: 0
          description: >-
            Fees the receiver is charging. When `quote_element_type` is set to
            `EXCHANGE`, this field value is always set to `0`.
        sending_currency_code:
          type: string
          example: USD
          description: >-
            Currency code of the sending amount. Included in quote elements with
            `quote_element_type` set to `EXCHANGE`.
        receiving_currency_code:
          type: string
          example: GBP
          description: >-
            Currency code of the receiving amount. Included in quote elements
            with `quote_element_type` set to `EXCHANGE`.
        fx_rate:
          $ref: '#/components/schemas/FXRate'
        transfer_currency_code:
          type: string
          description: >-
            Currency code of the transfer. Included in quote elements with
            `quote_element_type` set to `TRANSFER`.
      description: >-
        JSON object that provides transfer and exchange elements used to provide
        the quote. A transfer element represents the transfer of currency
        between two accounts. An exchange element represents the exchange of
        currencies between two accounts.
