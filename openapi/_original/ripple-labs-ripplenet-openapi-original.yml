          enum:
            - REAL_TIME_GROSS_SETTLEMENT_SYSTEM
            - REAL_TIME_NET_SETTLEMENT_SYSTEM
            - MASS_NET_PAYMENT_SYSTEM
            - BOOK_TRANSFER
            - CASH_PAYOUT
            - WALLET_PAYMENT
            - OTHER
        estimated_time_to_credit:
          type: object
          description: >-
            The estimated time to credit the beneficiary using this payout
