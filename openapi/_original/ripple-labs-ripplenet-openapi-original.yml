openapi: 3.0.0
info:
  description: >-
    The {% $env.PUBLIC_VAR_RNSERVER %} API provides you the ability to develop
    custom applications to manage or interact with your RippleNet instance.


    Check out the [best practices](../../ripplenet/best-practices/) and
    [tutorials](../../ripplenet/tutorials/).


    ### Authentication


    All API operations require a bearer access token for your target
    environment.<br>Learn how to [request the access
    token](../best-practices/authentication/#request-the-access-token).


    ### API environments


    The RippleNet Server API creates a dynamic `[domainPrefix]` that consists of
    `{tenant}.{environment}`.


    **Note**: This example uses `aperture` as the tenant. Your tenant ID is
    different.


    | Environment  | Domaing Prefix | Domain | Base URL |

    | --- | --- | --- | --- |

    | Test | `aperture.test` | `ripplexcurrent.com`|
    `https://aperture.test.ripplexcurrent.com` |

    | UAT | `aperture.uat` | `ripplexcurrent.com`|
    `https://aperture.uat.ripplexcurrent.com` |

    | Production | `aperture.prod` | `ripplexcurrent.com`|
    `https://aperture.prod.ripplexcurrent.com` |
  version: 4.0.0
  title: RippleNet Server API
security:
  - Bearer: []
tags:
  - name: Auditing
    description: >

      Use these operations to audit your accounts.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get
      audits](/products/payments-odl/api-docs/ripplenet/reference/openapi/auditing/getaudits)
      | GET   | Gets an audit trail of user actions and configuration changes
      (to accounts, fees, and rates) on a RippleNet instance. |

      | [Get event trail for
      payment](/products/payments-odl/api-docs/ripplenet/reference/openapi/auditing/geteventtrailforpayment) 
      | GET   | Gets an audit trail of a payment's state changes on a local
      RippleNet instance. |
  - name: Balances and statements
    description: >

      Use these operations to view balances and statements for a ledger.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get
      balances](/products/payments-odl/api-docs/ripplenet/reference/openapi/balances-and-statements/getbalances) 
      | GET   | Get balances for local and remote accounts owned by a RippleNet
      address. |

      | [Get ledger
      balances](/products/payments-odl/api-docs/ripplenet/reference/openapi/balances-and-statements/getledgerbalances) 
      | GET   | Get balances for ledger owned by a RippleNet address. |

      | [Get
      statement](/products/payments-odl/api-docs/ripplenet/reference/openapi/balances-and-statements/getstatement) 
      | GET   | Gets a statement for an account that lists payments and
      transfers that impacted the account's balance during a specified date-time
      range. |

      | [Get statement by external account
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/balances-and-statements/getstatementbyexternalaccountid)  
      | GET   | Gets a statement for an account that lists payments and
      transfers that impacted the account's balance during a specified date-time
      range. |

      | [Get ledger account
      statement](/products/payments-odl/api-docs/ripplenet/reference/openapi/balances-and-statements/getledgeraccountstatement) 
      | GET   | Get statement for a specified Ledger Account |
  - name: Beneficiary confirmation
    description: >

      Use these operations to perform beneficiary confirmations.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get account lookup by
      status](/products/payments-odl/api-docs/ripplenet/reference/openapi/beneficiary-confirmation/getaccountlookupbystatus) 
      | GET    | Get Account Lookup entities by status and other filters. |

      | [Initiate account
      lookup](/products/payments-odl/api-docs/ripplenet/reference/openapi/beneficiary-confirmation/initiateaccountlookup)
      | POST   | Creates an Account Lookup request to validate a beneficiary's
      account details before sending a payment. |

      | [Complete account
      lookup](/products/payments-odl/api-docs/ripplenet/reference/openapi/beneficiary-confirmation/completeaccountlookup)
      | POST   | Posts an Account Lookup response to validate a beneficiary's
      account details before payment. |

      | [Get account lookup by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/beneficiary-confirmation/getaccountlookupbyid)
      | GET    | Gets an Account Lookup entity for its `account_lookup_id`
      value. |
  - name: Diagnostics
    description: >

      Use these operations to view RippleNet Server health.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Check
      health](/products/payments-odl/api-docs/ripplenet/reference/openapi/diagnostics/checkhealth)      
      | GET | Gets the health status of the xCurrent server. |

      | [Check
      heartbeat](/products/payments-odl/api-docs/ripplenet/reference/openapi/diagnostics/checkheartbeat)
      | GET | Gets the health status of the xCurrent server's peers.  |
  - name: Exchange transfers
    description: >

      Use these operations to manage exchange transfers.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get exchange
      transfers](/products/payments-odl/api-docs/ripplenet/reference/openapi/exchange-transfers/getexchangetransfers) 
      | GET   | List all exchange transfers. |

      | [Execute exchange
      transfer](/products/payments-odl/api-docs/ripplenet/reference/openapi/exchange-transfers/executeexchangetransfer)
      | POST  | Execute an exchange transfer to move funds from one of your
      accounts in one currency, to another one of your accounts in another
      currency.   |

      | [Get exchange transfer quote
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/exchange-transfers/getexchangetransferquote) 
      | POST  | Requests a quote for an exchange transfer. |

      | [Complete exchange transfer
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/exchange-transfers/completeexchangetransfer)
      | POST  | Updates the status of an exchange transfer to `COMPLETED`. Make
      this request once the exchange transfer has been made on both the ledger
      and on internal systems. |

      | [Get exchange transfer by ID
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/exchange-transfers/getexchangetransferbyid) 
      | GET   | Gets an exchange transfer by ID. |
  - name: Fees
    description: >

      Use these operations to configure fees.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get
      fees](/products/payments-odl/api-docs/ripplenet/reference/openapi/fees/getfees)          
      | GET       | List all fees. |

      | [Create
      fee](/products/payments-odl/api-docs/ripplenet/reference/openapi/fees/createfee)      
      | POST      | Creates a fee.   |

      | [Get fee by ID
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/fees/getfeebyid) 
      | GET       | Gets a fee by ID. |

      | [Update fee
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/fees/updatefee)     
      | PUT       | Updates an existing fee. |

      | [Delete fee
      ](/products/payments-odl/api-docs/ripplenet/reference/openapi/fees/deletefee)     
      | DELETE    | Deletes a fee. Once deleted, a fee cannot be accessed. |
  - name: Non-orchestration payments
    description: ' '
  - name: Orchestration payments
    description: ' '
  - name: Payment expiration
    description: >

      Use these operations to manage payment expirations.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get payment expiry by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/payment-expiration/getpaymentexpirybyid) 
      | GET    | Gets the time to live (ttl) of a payment expiry in seconds. |

      | [Update payment
      expiry](/products/payments-odl/api-docs/ripplenet/reference/openapi/payment-expiration/updatepaymentexpiry)
      | PUT    | Updates the time to live (ttl) of a payment expiry in seconds.
      |

      | [Delete payment
      expiry](/products/payments-odl/api-docs/ripplenet/reference/openapi/payment-expiration/deletepaymentexpiry) 
      | DELETE | Deletes a payment expiry. |

      | [Get payment
      expiries](/products/payments-odl/api-docs/ripplenet/reference/openapi/payment-expiration/getpaymentexpiries)       
      | GET    | Returns all configured payment expiries. |

      | [Create payment
      expiry](/products/payments-odl/api-docs/ripplenet/reference/openapi/payment-expiration/createpaymentexpiry)
      | POST   | Creates a payment expiration window, or time to live (ttl), in
      seconds. |
  - name: Payout method
    description: >

      Payout Method operations let receivers create and manage payout methods.
      Senders can generate quotes based on these receiver payout methods.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Create payout
      method](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/createpayoutmethod)       
      | POST      | Creates a payout method. For example, `LOCAL_RAILS`. |

      | [Get payout
      methods](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/getpayoutmethods)           
      | GET       | Returns a list of payout methods created by a receiving
      partner. |

      | [Get payout method by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/getpayoutmethodbyid)   
      | GET       | Returns a payout method by its ID. |

      | [Update payout
      method](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/updatepayoutmethod)       
      | PUT       | Updates a payout method. |

      | [Delete payout
      method](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/deletepayoutmethod)       
      | DELETE    | Deletes a payout method. |

      | [Get all
      categories](/products/payments-odl/api-docs/ripplenet/reference/openapi/payout-method/getallcategories) 
      | GET       | Returns all the payout method categories. |
  - name: Platform accounts
    description: >

      Use these operations to configure your RippleNet platform accounts.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Create
      platform](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/createplatform)                                        
      | POST      | Creates a RippleNet platform that represents a financial
      entity that holds accounts in the real world. For example, a Bank,
      Exchange, or Wallet provider.  |

      | [Get all
      platforms](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getallplatforms)                                         
      | GET       | Returns a list of all active RippleNet platforms. |

      | [Get platform by platform
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformbyplatformid)                            
      | GET       | Get a RippleNet platform by its platform ID. |

      | [Update
      platform](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/updateplatform)                                        
      | PUT       | Updates a RippleNet platform. |

      | [Delete platform by platform
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/deleteplatformbyplatformid)                 
      | DELETE    | Deletes a RippleNet platform by its platform ID. |

      | [Create platform
      account](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/createplatformaccount)                         
      | POST      | Creates a RippleNet platform account, which represents a
      real-world account owned by a financial entity. |

      | [Get platform
      accounts](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccounts)                             
      | GET       | Returns a paged list of all active RippleNet platform
      accounts. |

      | [Get platform account by platform account
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountbyplatformaccountid)      
      | GET       | Gets a RippleNet platform account by its platform account
      ID. |

      | [Update platform
      account](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/updateplatformaccount)                         
      | PUT       | Updates a RippleNet platform account. |

      | [Delete platform account by platform account
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/deleteplatformaccountbyplatformaccountid)
      | DELETE    | Deletes a RippleNet platform account by its platform account
      ID. |

      | [Get platform accounts
      balances](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountsbalances)            
      | GET       | Get balances for local Platform Accounts |

      | [Get platform account
      statement](/products/payments-odl/api-docs/ripplenet/reference/openapi/platform-accounts/getplatformaccountstatement)            
      | GET       | Get statement for a specified Platform Account |
  - name: Pool accounts
    description: >

      Use these operations to configure your RippleNet pool accounts.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get all pool
      accounts](/products/payments-odl/api-docs/ripplenet/reference/openapi/pool-accounts/getallpoolaccounts)                              
      | GET    | Returns a list of all pool accounts on a RippleNet node. |

      | [Get pool account by pool account
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/pool-accounts/getpoolaccountbypoolaccountid)              
      | GET    | Get a pool account by its pool account ID. |
  - name: Quote expiration
    description: >+

      Use these operations to manage quote expirations.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [List quote
      expiries](/products/payments-odl/api-docs/ripplenet/reference/openapi/quote-expiration/getquoteexpiries)    
      | GET        | Returns all configured quote expiries. |

      | [Create quote
      expiry](/products/payments-odl/api-docs/ripplenet/reference/openapi/quote-expiration/createquoteexpiry)   
      | POST       | Creates a quote expiration window, or time to live (ttl),
      in seconds. |

      | [Get quote
      expiry](//products/payments-odl/api-docs/ripplenet/reference/openapi/quote-expiration/getquoteexpirybyid)     
      | GET        | Gets the configured quote expiration window, or time to
      live (ttl),  in seconds. |

      | [Update quote
      expiry](/products/payments-odl/api-docs/ripplenet/reference/openapi/quote-expiration/updatequoteexpiry)   
      | PUT        | Sets a quote expiration window, or time to live (ttl), in
      seconds. |

  - name: Quotes
    description: >

      Use these operations to manage your quotes.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Accept
      quote](/products/payments-odl/api-docs/ripplenet/reference/openapi/quotes/acceptquote)                           
      | POST | Accepts a quote ID to start the payment process. |

      | [Get
      quotes](/products/payments-odl/api-docs/ripplenet/reference/openapi/quotes/getquotes)                               
      | GET  | Gets a list of quotes. |

      | [Get quote by quote
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/quotes/getquotebyquoteid)                  
      | GET  | Gets a quote by ID. |

      | [Create quote
      collection](/products/payments-odl/api-docs/ripplenet/reference/openapi/quotes/createquotecollection)      
      | POST | Creates a collection of quotes for a proposed payment. |

      | [Get quote collection by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/quotes/getquotecollectionbyid)  
      | GET  | Gets a quote collection that was created for a proposed payment.
      |
  - name: Rates
    description: >

      Use these operations to manage your rates.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get
      rates](/products/payments-odl/api-docs/ripplenet/reference/openapi/rates/getrates)        
      | GET    | Gets a list of configured exchange rates. |

      | [Create
      rate](/products/payments-odl/api-docs/ripplenet/reference/openapi/rates/createrate)    
      | POST   | Creates an exchange rate for a specified currency pair. |

      | [Get rate by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/rates/getratebyid)
      | GET    | Gets a configured exchange rate by ID. |

      | [Update
      rate](/products/payments-odl/api-docs/ripplenet/reference/openapi/rates/updaterate)    
      | PUT    | Updates an existing exchange rate. |

      | [Delete
      rate](/products/payments-odl/api-docs/ripplenet/reference/openapi/rates/deleterate)    
      | DELETE | Deletes an exchange rate. Once deleted, an exchange rate cannot
      be accessed. |
  - name: Request for payment
    description: >

      Use these operations to interact with your payment requests.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get requests for
      payment](/products/payments-odl/api-docs/ripplenet/reference/openapi/request-for-payment/getrequestsforpayment)        
      | GET   | Gets requests for payment that match the query parameters. |

      | [Send request for
      payment](/products/payments-odl/api-docs/ripplenet/reference/openapi/request-for-payment/sendrequestforpayment)        
      | POST  | Sends a new request for payment. |

      | [Get request for payment by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/request-for-payment/getrequestforpaymentbyid)
      | GET   | Gets a request for payment by request for payment ID. |

      | [Accept request for
      payment](/products/payments-odl/api-docs/ripplenet/reference/openapi/request-for-payment/acceptrequestforpayment)    
      | POST  | Accepts a request for payment. |

      | [Fail request for
      payment](/products/payments-odl/api-docs/ripplenet/reference/openapi/request-for-payment/failrequestforpayment)        
      | POST  | Fails a request for payment. |
  - name: Transfers
    description: >

      Use these operations to manage your transfers.


      | Operation | Method | Description |

      | -- | -- | -- |

      | [Get
      transfers](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransfers)                
      | GET    | Gets a list of transfers. |

      | [Get transfer
      estimate](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransferestimate) 
      | GET    | Get an estimate of the fee to make an "outbound" transfer from
      an exchange (connected to xRapid) to an another account outside of
      RippleNet (such as a bank account).  |

      | [Get transfer by
      ID](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransferbyid)        
      | GET    | Gets a transfer by ID. |

      | [Execute
      transfer](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/executetransfer)          
      | POST   | Transfers funds between accounts.  |

      | [Complete
      transfer](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/completetransfer)        
      | POST   | Updates the state of a transfer to `COMPLETED`. |

      | [Add transfer
      labels](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/addtransferlabels)      
      | PUT    | Adds a list of labels to the transfer. To retrieve transfers by
      label, see [Get
      transfers](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/gettransfers)
      |

      | [Delete transfer
      labels](/products/payments-odl/api-docs/ripplenet/reference/openapi/transfers/deletetransferlabels)
      | DELETE | Deletes one or more existing labels from the transfer. |
paths:
  /audit:
    get:
      tags:
        - Auditing
      summary: Get audits
      description: >-
        Gets an audit trail of user actions and configuration changes (to
        accounts, fees, and rates) on a RippleNet instance.
      operationId: getAudits
      parameters:
        - name: page
          in: query
          description: >
            The page number for [paginated
            results](/products/payments-odl/api-docs/ripplenet/best-practices/pagination/).
            The value is zero-based, where `0` represents the first page.<br/>

            Set it to `0` to get the first page of results.
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Number of payments to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: before
          in: query
          description: >-
            Filters for audit events where the `range_field` value is before
            this specified time stamp (not inclusive). You can also specify
            `after` to create a time range between `after` and `before`. If
            before is specified, `range_field` must also be specified.
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >-
            Filters for audit events where the `range_field` value is after this
            specified time stamp (not inclusive). You can also specify `before`
            to create a time range between `after` and `before`. If `after` is
            specified, `range_field` must also be specified.
          required: false
          schema:
            type: string
        - name: range_field
          in: query
          description: >-
            Filters payments before/after/between created and modified
            timestamps (`CREATED_AT`, `MODIFIED_AT`). For example, if you
            specify `range_field`=`CREATED_AT`, you would specify a timestamp
            (in the 24-character ISO 8601 YYYY-MM-DDTHH:mm:ss.sssZ format used
            in payment objects) as the value for `before` and/or `after` to
            fetch audit events before, after, or between the specified time
            range(s) (not inclusive). If `range_field` is specified, `before`
            and/or `after` must also be specified.
          required: false
          schema:
            type: string
        - name: actor
          in: query
          description: Filters for audit events based upon actor.
          required: false
          schema:
            type: string
        - name: action
          in: query
          description: Filters for audit events based upon action.
          required: false
          schema:
            type: string
        - name: level
          in: query
          description: Filters for audit events based upon audit level.
          required: false
          schema:
            type: string
            enum:
              - INFO
              - WARN
              - ERROR
        - name: domain
          in: query
          description: Filters for audit events based upon audit domain.
          required: false
          schema:
            type: string
            enum:
              - USER_MANAGEMENT
              - CONFIG_MANAGEMENT
              - OTHER
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /audit/payment/{id}:
    get:
      tags:
        - Auditing
      summary: Get event trail for payment
      description: >-
        Gets an audit trail of a payment's state changes on a local RippleNet
        instance.
      operationId: getEventTrailForPayment
      parameters:
        - name: id
          in: path
          description: Unique identifier of a payment.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment state change event trail.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTrailEvent'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RippleNetProblem'
      security:
        - Bearer: []
  /account_lookups:
    get:
      tags:
        - Beneficiary confirmation
      summary: Get account lookup by status
      description: >-
        Get Account Lookup entities by status and other filters. Status defaults
        to `REQUESTED`.
      operationId: getAccountLookupByStatus
      parameters:
        - name: page
          in: query
          description: >
            The page number for [paginated
            results](/products/payments-odl/api-docs/ripplenet/best-practices/pagination/).
            The value is zero-based, where `0` represents the first page.<br/>

            Set it to `0` to get the first page of results.
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Number of objects to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: account_lookup_status
          in: query
          description: Account Lookup status
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AccountLookupStatus'
            default:
              - REQUESTED
        - name: start-date
          in: query
          description: >-
            The lower bound of the date-time range you want to return account
            lookup for, as an ISO-8601 timestamp in UTC. For example,
            `2018-08-06T23:13:55.997Z`.
          required: false
          schema:
            type: string
        - name: end-date
          in: query
          description: >-
            The upper bound of the date-time range you want to return statement
            information for, as an ISO-8601 timestamp in UTC For example,
            `2018-08-06T23:15:13.218Z`.
          required: false
          schema:
            type: string
        - name: sort_field
          in: query
          description: Attribute for how to sort the results
          required: false
          schema:
            type: string
            enum:
              - CREATED_DATE
              - LAST_MODIFIED_DATE
            default: LAST_MODIFIED_DATE
        - name: sort_direction
          in: query
          description: Direction of sorted results.
          required: false
          schema:
            type: string
            enum:
