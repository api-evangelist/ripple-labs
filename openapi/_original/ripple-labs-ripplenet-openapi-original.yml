    PaymentQuoteRequestRos:
      type: object
      required:
        - amount
        - currency
        - quote_type
        - receiving_address
        - sending_address
      properties:
        sending_address:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            RippleNet account name and address of the sender, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        receiving_address:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            RippleNet account name and address of the receiver, in the format
            `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        amount:
          type: string
          minimum: 1
          description: >-
            Amount to be sent or received, depending on the `quote_type`. <p>If
            `quote_type` is `SENDER_AMOUNT` or `SENDER_INSTITUTION_AMOUNT`,
            `amount` represents the value to be sent by the payment originator.
            If `quote_type` is `SENDER_INSTITUTION_AMOUNT`, the amount (to debit
            the originator) is `amount` plus any fees to be collected by the
            sending institution.</p> <p>If `quote_type` is `RECEIVER_AMOUNT` or
            `RECEIVER_INSTITUTION_AMOUNT`, `amount` represents the value to be
            received by the payment beneficiary. If `quote_type` is
            `RECEIVER_INSTITUTION_AMOUNT`, the amount (to credit the
            beneficiary) is `amount` minus any fees to be collected by the
            receiving institution.</p>
        currency:
          type: string
          description: >-
            Currency code of the amount to be sent or received, depending on the
            `quote_type` value. If `quote_type` is set to `SENDER_AMOUNT` or
            `SENDER_INSTITUTION_AMOUNT`, this is the currency of the amount to
            be sent. If `quote_type` is set to `RECEIVER_AMOUNT` or
            `RECEIVER_INSTITUTION_AMOUNT`, this is the currency of the amount to
            be received.
        quote_type:
          type: string
          description: >-
            Specifies how to calculate the quote. <p>To create a quote based on
            the amount the payment originator or originating institution wants
            to send, set to `SENDER_AMOUNT` or `SENDER_INSTITUTION_AMOUNT`
            respectively. If `quote_type` is `SENDER_INSTITUTION_AMOUNT`, the
            amount (to debit the originator) is `amount` plus any fees to be
            collected by the sending institution.</p> <p>To create a quote based
            on the amount the payment beneficiary or beneficiary institution
            should receive, set to `RECEIVER_AMOUNT` or
            `RECEIVER_INSTITUTION_AMOUNT` respectively. If `quote_type` is
            `RECEIVER_INSTITUTION_AMOUNT`, the amount (to credit the
            beneficiary) is `amount` minus any fees to be collected by the
            receiving institution.</p>
          enum:
            - SENDER_AMOUNT
            - RECEIVER_AMOUNT
            - SENDER_INSTITUTION_AMOUNT
            - RECEIVER_INSTITUTION_AMOUNT
        sender_or_receiver_currency:
          type: string
          description: |
            Currency code of the sender or receiver based on `quote_type`.

            If provided, you can use this to filter the options for quotes.
          example: USD
        custom_fee:
          type: number
          description: >-
            Custom fee for the sending account. Setting this field overrides all
            fees configured on the sender's RippleNet instance.
        custom_rate:
          $ref: '#/components/schemas/PaymentQuoteCustomRateRequest'
        quote_route:
          type: array
          example:
            - rn.us.ca.san_francisco
            - rn.us.tx.austin
            - rn.us.ny.new_york
          description: >-
            Custom route that quotes must follow. Provide an array of RippleNet
            addresse strings (`g.us.ca.san_francisco`, for example) that convey
            the route the quotes must follow.
          items:
            type: string
        payment_method:
          type: string
          pattern: ^[a-zA-Z0-9@_,:\s-]*$
          minLength: 2
          maxLength: 32
          description: >-
            Senders can use this field to manually define the payout method that
            the receiver should use to deliver the payment to end customer.
            On-Demand Liquidity (ODL) receivers should set
            <code>payment_method</code> to the <code>outlet_id</code> or
            &#34;none&#34; (to keep funds at the destination exchange) when
            paying out to a local rail.<p><b>Caution&#58;</b> The existing quote
            parameter is named <code>payment_method</code> while elsewhere it is
            <code>payout_method</code>.</p>
        enable_quote_per_payout_method:
          type: boolean
          description: >-
            Enable this flag to generate quotes using payout methods configured
            by the receiver.
          example: false
        digital_asset_origination:
          type: boolean
          description: >-
            When true, this flag tells RippleNet to provide a full quote as if
            the payment originates in the specified source fiat currency. The
            quote for the source exchange excludes trading fees. On execution,
            the source exchange trade is skipped, and XRP is withdrawn from the
            source exchange as the first step.
          example: false
        force_path_finding_and_liquidity_path_finding:
          type: boolean
          example: false
          description: >-
            When true, this flag tells RippleNet to ignore cached value for path
            finding and liquidity path finding and perform new path finding and
            liquidity path finding.
          default: false
        payout_method_category:
          type: string
          example: BOOK_TRANSFER
          description: Category the above payout method will be associated with.
          enum:
            - REAL_TIME_GROSS_SETTLEMENT_SYSTEM
            - REAL_TIME_NET_SETTLEMENT_SYSTEM
            - MASS_NET_PAYMENT_SYSTEM
            - BOOK_TRANSFER
            - CASH_PAYOUT
            - WALLET_PAYMENT
            - OTHER
        sender_segregated_account:
          type: string
          example: conct_php_receiver_coins_sender@receiver
          description: >-
            RippleNet account name and address of the sender owned account at
            receiver to be used for failure conversion (in case of payment
            failure) in the format `accountname@ripplenetaddress`. For example,
            `new_york@rn.us.ny.new_york`.
        quote_limit:
          type: integer
          description: >-
            Flag for truncating the total amount of quotes to a maximum amount
            after sorting and filters are applied. Optional.
