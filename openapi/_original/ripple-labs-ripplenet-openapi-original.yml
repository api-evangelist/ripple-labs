          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationPaymentReversalRequest'
        required: true
      responses:
        '201':
          description: Successfully returned orchestration payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationPaymentSubmitResponse'
  /v4/orchestration/payment/notification:
    get:
      tags:
        - Orchestration payments
      summary: Get orchestration notifications by status
      description: Gets a list of orchestration payment notifications with a given status.
      operationId: getOrchestrationPaymentNotifications
      parameters:
        - name: status
          in: query
          description: The 'status' of the notifications to retrieve.
          required: true
          schema:
            type: string
            enum:
              - NEW
              - SENT
        - name: size
          in: query
          description: Number of objects to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: delay_time
          in: query
          description: Delay time in minutes to retrieve the SENT notifications.
          required: false
          schema:
            type: integer
            default: 30
        - name: range_field
          in: query
          description: >
            **Range Field**


            Designates the column name of the notifications database table that
            is used for filtering notifications before/after/between time
            stamps.


            The following options are valid:

              | Range field | Description |
              | --- | --- |
              | CREATED_AT | Filter by created date-time |
              | MODIFIED_AT | Filter by modified date-time |

            **Example usage**


            If you specify `range_field` = `MODIFIED_AT`, you need to specify a
            time stamp (in the 24 character ISO 8601 format used in
            notifications objects: `YYYY-MM-DDTHH:mm:ss.sssZ`) as the value for
            `before` and/or `after` to fetch notifications before, after, or
            between the specified time range(s) (inclusive).


            **Dependency**: If `range_field` is specified, `before` and/or
            `after` must also be specified.
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >
            **Before** time stamp


            Filters for notifications where the notifications `range_field`
            column value is before this specified time stamp (inclusive).


            You can also specify `after` to create a time range between `after`
            and `before`.


            **Dependency**: If you specify `before`, you must also specify
            `range_field`.


            **Example**: `2023-10-13T10:16:29.000Z`
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >
            **After** time stamp


            Filters for notifications where the notifications `range_field`
            column value is after this specified time stamp (inclusive).


            You can also specify `before` to create a time range between `after`
            and `before`.


            **Dependency**: If you specify `after`, you must also specify
            `range_field`.


            **Example**: `2023-10-13T10:16:29.000Z`
          schema:
            type: string
      responses:
        '200':
          description: Successfully fetched orchestration payment notifications list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /v4/orchestration/payment/notification/urn/{uniqueReferenceNumber}:
    get:
      tags:
        - Orchestration payments
      summary: Get orchestration notifications by unique reference number
      description: >-
        Gets orchestration payment notifications with a given unique reference
        number.
      operationId: getOrchestrationPaymentNotificationsByUniqueReferenceNumber
      parameters:
        - name: uniqueReferenceNumber
          in: path
          description: >-
            The `sender_end_to_end_id` of the orchestration payment notification
            in case of sender and `payment_id` in case of receiver.
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Successfully fetched orchestration payment notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /v4/orchestration/payment/notification/{uuid}:
    get:
      tags:
