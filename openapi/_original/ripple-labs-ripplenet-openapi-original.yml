          x-enumDescriptions:
            RB001: >-
              The account number structure is valid but the account number does
              not correspond to the individual identified in the payment. <br
              /><br />This error typically occurs because the Originator
              specified the Beneficiary's account number incorrectly while
              initiating the payment.<br/><br/><b>Error handling</b><br/>The
              Sending Member may introduce prompts in the user interface during
              payment initiation to ensure that the Originator validates the
              Beneficiary's account number.
            RB002: >-
              The Sender has requested Receiver for return of the payment.<br
              /><br />This error typically occurs in business scenarios where
              the Originator contacts the Sending Member to indicate that they
              (the Originator) provided incorrect account
              information.<br/><br/><b>Error handling</b><br/>The Sending Member
              must contact the Receiving Member and obtain agreement that the
              payment should be returned. After obtaining agreement, the
              Receiving Member can initiate the return of the payment.
            RB003: >-
              The funds for the payment have not been collected by the
              Beneficiary within the set period.<br/><br/><b>Error
              handling</b><br/>The Originator must inform the Beneficiary that
              they should collect the funds within the prescribed time frame.
              <br /><br />The Receiving Member may also contact the Beneficiary
              to inform them of pending or uncollected funds. <br />Further, the
              Receiving Member must ensure that the Sending Member includes the
              Beneficiary's contact information in the RippleNet Payment Object.
            RB004: >-
              Beneficiary's account is frozen due to specific action taken by
              the Receiver or by legal action. <br /><br /> This error typically
              occurs when the Beneficiary's bank has frozen the account due to
              suspected misuse, or on the Beneficiary's
              request.<br/><br/><b>Error handling</b><br/>The Originator may
              contact the Beneficiary for alternative account information or to
              agree on an alternative payment mechanism.
            RB005: >-
              The Receiver has returned the payment due to one of the following
              reasons: <br /><br /><ul><li>The exact amount required has not
              been remitted. </li><li>Acceptance of the transaction results in
              an overpayment.</li></ul><br/><br/><b>Error handling</b><br/>In
              case of a technical or human error, the Sending Member or the
              Originator must adapt their internal RippleNet payment initiation
              process to ensure they do not transfer the incorrect amount. <br
              /><br />The Beneficiary may contact the Originator and ask them to
              initiate a payment for the exact amount.
            RB008: >-
              Invalid account title or name prefix. <br /><br />This error
              typically occurs when the Beneficiary's title or name specified in
              the payment does not match the information associated with their
              account.<br/><br/><b>Error handling</b><br/>In case of a technical
              or human error, the Sending Member or the Originator must adapt
              their internal RippleNet payment initiation process to ensure they
              do not provide the incorrect Beneficiary title or name. <br /><br
              />If the Beneficiary provided incorrect information, the
              Originator may contact the Beneficiary to obtain the correct
              information.
            RB009: >-
              Beneficiary's account is dormant. <br /><br />This error typically
              occurs because the Beneficiary's Bank has marked the account as
              dormant due to a lack of activity or financial transactions on the
              account.<br/><br/><b>Error handling</b><br/>The Originator may
              contact the Beneficiary for alternative account information or to
              agree upon a different payment mechanism.
            RB010: >-
              The minimum amount required has not been remitted. <br /><br
              />This error typically occurs because the Originator has initiated
              payment for an amount that is lower than the intended amount that
              they previously agreed upon with the
              Beneficiary.<br/><br/><b>Error handling</b><br/>In case of
              technical or human error, the Sending Member or the Originator
              must adapt their internal RippleNet payment initiation process to
              ensure they do not specify incorrect amounts.
            RB011: >-
              The account is subject to litigation. <br /><br />This error
              typically occurs because the Beneficiary's Bank has frozen the
              account due to legal reasons, or under suspicion of misuse, or on
              the Beneficiary's request.<br/><br/><b>Error handling</b><br/>The
              Originator may contact the Beneficiary for alternative account
              information or to agree upon a different payment mechanism.
            RB012: >-
              The Originator is not known to the Recipient or
              Beneficiary.<br/><br/><b>Error handling</b><br/>In case of
              technical or human error, the Sending Member or the Originator
              must adapt their internal RippleNet payment initiation process to
              ensure they do not initiate payments to unknown or unintended
              Beneficiary accounts.
            RB013: >-
              The Receiver has not authorized this credit entry to the
              Beneficiary's account. <br /><br />This error typically occurs
              because the Beneficiary's Bank has blocked the account due to
              legal reasons.<br/><br/><b>Error handling</b><br/>The Originator
              may contact the Beneficiary for alternative account information or
              to agree upon a different payment mechanism.
            RB017: >-
              Government or National ID of the individual identified in the
              payment is not mapped to the account number. <br /><br />This
              error typically occurs when the payment cannot be booked to the
              Beneficiary's account because their Government or National ID is
              not linked with their account.<br/><br/><b>Error
              handling</b><br/>The Originator may contact the Beneficiary to
              agree upon a different payment mechanism.
            RB018: Customer insolvent or other reason.
            RB023: >-
              Beneficiary account name does not match Beneficiary account
              number.<br/><br/><b>Error handling</b><br/>In case of technical or
              human error, the Sending Member or the Originator must adapt their
              internal RippleNet payment initiation process to ensure they do
              not specify incorrect Beneficiary name.<br /><br /> If the account
              name was invalid, the Originator may contact the Beneficiary for
              correct information.
            RB024: >-
              Account is not in currency quoted.<br/><br/><b>Error
              handling</b><br/>In case of technical or human error, the Sending
              Member or the Originator must adapt their internal RippleNet
              payment initiation process to ensure they do not specify incorrect
              account currency information.<br /><br /> The Originator may
              request the Beneficiary to provide accurate information about
              their account currency.
            RB026: >-
              Beneficiary account number closed.<br/><br/><b>Error
              handling</b><br/>The Originator may contact the Beneficiary for
              alternative account information.
            RB027: >-
              Beneficiary does not support or accept this message or payment
              type.<br/><br/><b>Error handling</b><br/>In case of technical or
              human error, the Sending Member or the Originator must adapt their
              internal RippleNet payment initiation process to ensure they do
              not specify the wrong payment type.<br /><br />The Beneficiary may
              request the Originator to re-initiate the payment with a supported
              payment type.
            RB028: >-
              Payment was not processed as Receiver is unavailable or offline.
              <br /><br />This error typically occurs when the RippleNet
              connection to and from the Receiving Member or Intermediary Bank
              is unavailable due to network issues.<br/><br/><b>Error
              handling</b><br/>The Sending Member may request the Originator to
              reissue the RippleNet payment at a later time.
            RB029: >-
              Invalid payment type. The payment type used is not allowed or
              enabled for this Bank.<br/><br/><b>Error handling</b><br/>In case
              of technical or human error, the Sending Member or the Originator
              must adapt their internal RippleNet payment initiation process to
              ensure they do not specify the wrong payment type.<br /><br />The
              Beneficiary may request the Originator to re-initiate the payment
              with a valid payment type.
            RB030: >-
              Card is blocked, or lost, or hotlisted. <br /><br /> This error
              typically occurs if the Beneficiary Bank has blocked the card
              account due to reported theft or other legal
              issues.<br/><br/><b>Error handling</b><br/>The Originator may
              contact the Beneficiary for alternative account details.
            RB031: >-
              Card is expired.<br/><br/><b>Error handling</b><br/>The Originator
              may contact the Beneficiary for alternative account details.
            RB032: >-
              Invalid card number. <br /><br />This error typically occurs
              either because the Originator entered an invalid card number while
              initiating the payment, or because the Beneficiary provided an
              invalid card number to the Originator.<br/><br/><b>Error
              handling</b><br/>In case of a technical or human error, the
              Sending Member or the Originator must adapt their internal
              RippleNet payment initiation process to ensure they do not supply
              an invalid or incomplete card number. <br /><br />If the
              Beneficiary provided an incorrect card number, the Originator may
              contact the Beneficiary for the correct number.
            RB033: >-
              Transactions to the card are restricted. <br /><br /> This error
              typically occurs because the Beneficiary Bank has restricted
              financial transactions on the card due to legal reasons or reports
              of fraudulent usage.<br/><br/><b>Error handling</b><br/>The
              Originator may request the Beneficiary to provide alternative
              account information.
            RB034: >-
              Beneficiary has exceeded the number of transactions allowed for a
              set time period. <br /><br /> This error typically occurs due to
              failed velocity or fraud checks conducted by the Receiving Member.
            RB035: >-
              Beneficiary has exceeded the cumulative transaction amount allowed
              for a set time period. <br /><br /> This error typically occurs
              due to failed velocity or fraud checks conducted by the Receiving
              Member.<br/><br/><b>Error handling</b><br/>N/A
            RB036: >-
              Originator has exceeded the number of transactions allowed for a
              set time period. <br /><br /> This error typically occurs due to
              failed velocity or fraud checks conducted by the Receiving
              Member.<br/><br/><b>Error handling</b><br/>N/A
            RB037: >-
              Originator has exceeded the cumulative transaction amount allowed
              for a set time period. <br /><br /> This error typically occurs
              due to failed velocity or fraud checks conducted by the Receiving
              Member.<br/><br/><b>Error handling</b><br/>N/A
            AC01: Account number is invalid or missing.
            AC03: >-
              Creditor account number invalid or missing.<br/><br/><b>Error
              handling</b><br/>If the account number or IBAN is invalid, the
              Sending Member may repair the transaction by specifying a valid
              Creditor account number.<br /><br />If the account number is
