  /v1/stablecoin/transactions:
    get:
      summary: List transactions
      description: Returns a paginated list of transactions, optionally filtered by type and status.
      operationId: listTransactions
      tags:
      - Transactions
      security:
      - oauth2:
        - rlusd_customers:read
      parameters:
      - name: transactionTypes
        in: query
        description: Filter by transaction type. Repeatable.
        schema:
          type: array
          items:
            type: string
            enum:
            - ISSUANCE
            - REDEMPTION
            - BRIDGE
        style: form
        explode: true
      - name: statuses
        in: query
        description: Filter by status. Repeatable.
        schema:
          type: array
          items:
            type: string
            enum:
            - PROCESSING
            - PENDING
            - COMPLETED
            - FAILED
            - CANCELED
        style: form
        explode: true
      - name: page
        in: query
        description: Page number, 0-indexed (default 0)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: Page size (default 20)
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sort field and direction (default: updatedAt,desc).

          Supported fields: updatedAt, createdAt, type, status, amount.

          '
        schema:
          type: string
          default: updatedAt,desc
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/stablecoin/transactions/{id}:
    get:
      summary: Get a transaction
      description: Returns a single transaction by ID.
      operationId: getTransaction
      tags:
      - Transactions
      security:
      - oauth2:
        - rlusd_customers:read
      parameters:
      - name: id
        in: path
        required: true
        description: Transaction UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/stablecoin/transactions/{id}/destination:
    put:
      summary: Approve a pending redemption
      description: 'Approves a transaction held in `PENDING` status (flexible redemption) and directs it.

        Set `type` to `FIAT` to settle to your default bank account (creates a `REDEMPTION`), or

        to `CRYPTO` with a `walletId` to bridge to one of your wallets (creates a `BRIDGE`).


        Re-submitting the same destination after the transaction has moved to `PROCESSING` is

        idempotent and returns `200`. Submitting a *different* destination, or approving a

        transaction that was never `PENDING`, returns `409`.

        '
      operationId: updateTransactionDestination
      tags:
      - Transactions
      security:
      - oauth2:
        - rlusd_customers:write
      parameters:
      - name: id
        in: path
        required: true
        description: Transaction UUID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionDestination'
      responses:
        '200':
          description: Updated transaction, transitioned to `PROCESSING` with `type`/`destination` populated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    transactionsv2Transaction:
      type: object
      properties:
        id:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The transaction ID
        walletId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The wallet ID
        vaultId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The vault ID
        createdBy:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The ID of the user that created the transaction
        createdAt:
          type: string
          format: date-time
          example: '2022-03-29T10:22:22.420Z'
          description: The date and time the transaction was created
        updatedAt:
          type: string
          format: date-time
          example: '2022-03-29T10:22:22.420Z'
          description: The date and time the transaction was updated
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionStatus'
          - type: string
            example: REQUESTED
            description: The transaction status
        action:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionAction'
          - type: string
            example: DEPOSIT
            description: The transaction action
        externalId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: External ID of this transaction, unique to the organization
        correlationId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The correlation ID of the transaction, used to link related transactions
        asset:
          $ref: '#/components/schemas/commonv2Asset'
        feeAsset:
          $ref: '#/components/schemas/commonv2Asset'
        blockchain:
          $ref: '#/components/schemas/v2Blockchain'
        destinationAddress:
          type: string
          example: '0x55502b9d5a68b0F8a48384352295BeD968aD8AA4'
          description: The destination address
        destination:
          $ref: '#/components/schemas/transactionsv2Address'
        originAddress:
          type: string
          example: '0x55502b9d5a68b0F8a48384352295BeD968aD8AA4'
          description: The origin address
        origin:
          $ref: '#/components/schemas/transactionsv2Address'
        qty:
          type: string
          example: '155.672'
          description: The quantity of the asset to transfer
        feeQtyLimit:
          type: string
          example: '155.672'
          description: The maximum network fee to pay for this transaction in base asset units (eg ETH for Ethereum)
        sequence:
          type: string
          format: uint64
          example: '2'
          description: The blockchain nonce/sequence to use
        encodedTransaction:
          type: string
          example: ed408505d21dba00825208942352d20fc81225c8ecd8f6faa1b37f24fed450c98089736f6d657468696e67808080
          description: The encoded transaction. Maximum size is 200KB.
        signOnly:
          type: boolean
          example: 'true'
          description: Whether to only sign the transaction, or also publish it to the blockchain
        config:
          $ref: '#/components/schemas/v2XRPTransactionConfig'
        freezeInfo:
          allOf:
          - $ref: '#/components/schemas/v2FreezeInfo'
          - type: object
            description: Comprehensive freeze information including status, reason, and history
        feeQty:
          type: string
          example: '155.672'
          description: The actual network fee for this transaction in base asset units (eg ETH for Ethereum)
        hash:
          type: string
          example: '0x30674cddb3025f9681839c63d20357f54e914bd7a9ddfe53a6691f4a530a5671'
          description: The transaction hash
        signature:
          type: string
          example: 3046022100c60dc1337d69261e7c7e92e4dac78e0c317d444d4690be2b86cc53b1989d1b0602210090c63e3a5cf692c9387292451fada038a0e4d85a2f5c91ee1e7a635df0440b43
          description: The transaction signature
        transactionType:
          type: string
          example: Payment
          description: The transaction type
        reasons:
          type: array
          example:
          - unfunded
          items:
            type: string
          description: Deprecated. Use problems for structured transaction failure details.
        canonicalSignature:
          type: string
          example: 3045022100C60DC1337D69261E7C7E92E4DAC78E0C317D444D4690BE2B86CC53B1989D1B0602206F39C1C5A3096D36C78D6DBAE0525FC619CA048C7FEC0E4DA157FB2EDFF235FE
          description: The canonical transaction signature
        signedTransaction:
          type: string
          example: 
          description: The signed transaction (multi-sign is not supported). Maximum size is 200KB.
        proposedAssetChanges:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/v2AssetChange'
            - type: object
          description: Proposed asset changes
        confirmedAssetChanges:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/v2AssetChange'
            - type: object
          description: Confirmed asset changes
        expiresAt:
          type: string
          format: date-time
          example: '2026-03-16T16:22:22.420Z'
          description: The time after which this transaction will be rejected if not confirmed
          readOnly: true
        problems:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/v2Problem'
            - type: object
          description: Structured transaction failure details.
        signingPayloads:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/v2SigningPayload'
            - type: object
          description: Multiple signing payloads for UTXO-based transactions, one per input
      required:
      - id
      - walletId
      - vaultId
      - createdBy
      - createdAt
      - updatedAt
      - status
      - action
      - asset
      - feeAsset
      - blockchain
      - originAddress
      - origin
      - qty
      - signOnly
      - freezeInfo
    TransactionListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        totalElements:
          type: integer
          description: Total number of matching transactions
        totalPages:
          type: integer
          description: Total number of pages
        size:
          type: integer
          description: Page size
        number:
          type: integer
          description: Current page number (0-indexed)
    v2TransactionStatusFilter:
      type: object
      properties:
        eq:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionStatus'
          - description: Exact transaction status match
        notEq:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionStatus'
          - description: Exclude this transaction status
        in:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionStatus'
          description: Transaction status is in this list
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionStatus'
          description: Transaction status is not in this list
    ProblemDetail:
      type: object
      description: 'Error response following RFC 9457 (Problem Details for HTTP APIs), the successor to RFC 7807.

        '
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
        title:
          type: string
          description: Short, human-readable summary of the problem
        status:
          type: integer
          description: HTTP status code
        code:
          type: string
          description: Machine-readable error code
          enum:
          - TRANSACTION_NOT_FOUND
          - TRANSACTION_INVALID_STATUS_TRANSITION
          - TRANSACTION_DESTINATION_TYPE_IMMUTABLE
          - INVALID_REQUEST_BODY
          - UNKNOWN_EXCEPTION
    commonv2Asset:
      type: object
      properties:
        id:
          type: string
          example: 5:0xbehbehfb:USDC
          description: ID is unique across all blockchains and created by combining the blockchain ID, contract address, and symbol
        standard:
          allOf:
          - $ref: '#/components/schemas/v2Standard'
          - type: string
            example: ERC20
            description: The standard of the asset
        symbol:
          type: string
          example: LINK
          description: The currency symbol of the asset
        name:
          type: string
          example: Chainlink
          description: The human readable name of the asset
        blockchain:
          $ref: '#/components/schemas/v2Blockchain'
        decimals:
          type: integer
          format: int32
          example: 18
          description: Count of decimal places for the asset
        vetted:
          type: boolean
          example: true
          description: Whether the asset is vetted on the regulated platform
        enabled:
          type: boolean
          example: true
          description: Whether the asset is currently enabled on the platform
        contract:
          type: string
          example: '0x0b9d5D9136855f6FEc3c0993feE6E9CE8a297846e'
          description: The token contract address. This field will be empty if the asset is the native coin of the blockchain
        createdAt:
          type: string
          format: date-time
          example: '2022-03-29T10:22:22.420Z'
          description: The date and time the asset was created
        updatedAt:
          type: string
          format: date-time
          example: '2022-03-29T10:22:22.420Z'
          description: The date and time the asset was last updated
        organizationId:
          type: string
          description: Organization ID for custom assets
        coingeckoId:
          type: string
          example: ethereum
          description: CoinGecko identifier for price data (optional for testnet assets)
        source:
          allOf:
          - $ref: '#/components/schemas/v2AssetSource'
          - type: string
            example: ASSET_SOURCE_COINGECKO
            description: Data source for this asset
        sourceMetadata:
          allOf:
          - $ref: '#/components/schemas/protobufAny'
          - type: object
            description: JSON metadata about the source
        lastSyncedAt:
          type: string
          format: date-time
          example: '2024-08-08T10:22:22.420Z'
          description: When this asset was last synchronized
        syncVersion:
          type: integer
          format: int32
          example: 1
          description: Version counter for sync updates
        contractAddressChecksummed:
          type: string
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          description: Checksummed version of the contract address
        iconUrl:
          type: string
          example: https://static.palisade.co/registry/assets/coingecko/production/usd-coin.png
          description: Public URL for the asset icon. Registry asset REST endpoints populate this when configured; other Asset responses may omit it.
          readOnly: true
      required:
      - id
      - standard
      - symbol
      - blockchain
      - createdAt
    transactionsv2Address:
      type: object
      properties:
        id:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: Either addressID or walletID, or allowAddressID, or not set when the address does not exist within palisade e.g. a deposit from outside of Palisade
        counterpartyId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The counterparty ID
        vaultId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The vault ID
        type:
          allOf:
          - $ref: '#/components/schemas/transactionsv2AddressType'
          - type: string
            example: EXTERNAL
            description: The address type
        address:
          type: string
          example: '0x55502b9d5a68b0F8a48384352295BeD968aD8AA4'
          description: The address
      required:
      - type
      - address
    v2XRPTransactionConfig:
      type: object
      properties:
        sourceTag:
          type: string
          example: '123456'
          description: The source tag for XRP transactions
        destinationTag:
          type: string
          example: '123456'
          description: The destination tag for XRP transactions
    v2Standard:
      type: string
      enum:
      - NATIVE
      - ERC20
      - ISSUED_CURRENCY
      - ERC721
      - SPL
      - CUSTOM
    transactionsv2AddressType:
      type: string
      enum:
      - COUNTERPARTY
      - WALLET
      - EXTERNAL
      - ALLOW_ADDRESS
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
      additionalProperties: {}
    v2TransactionActionFilter:
      type: object
      properties:
        eq:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionAction'
          - description: Exact transaction type match
        notEq:
          allOf:
          - $ref: '#/components/schemas/transactionsv2TransactionAction'
          - description: Exclude this transaction type
        in:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionAction'
          description: Transaction type is in this list
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/transactionsv2TransactionAction'
          description: Transaction type is not in this list
    v2ListWalletTransactionsResponse:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/v2FilterResponse'
        transactions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/transactionsv2Transaction'
            - type: object
    TimestampFilterTimestampRange:
      type: object
      properties:
        start:
          type: string
          format: date-time
          example: '2024-08-01T00:00:00Z'
          description: Start of time range (inclusive)
        end:
          type: string
          format: date-time
          example: '2024-08-31T23:59:59Z'
          description: End of time range (inclusive)
    v2FreezeType:
      type: string
      enum:
      - FREEZE_TYPE_MANUAL
      - FREEZE_TYPE_AUTO_RISK
      - FREEZE_TYPE_AUTO_AMOUNT
      - FREEZE_TYPE_COMPLIANCE
      - FREEZE_TYPE_AUTO_WALLET_SETTING
    v2TimestampFilter:
      type: object
      properties:
        eq:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Exact timestamp match
        notEq:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Not equal to timestamp
        before:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Before this timestamp
        after:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: After this timestamp
        gte:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Greater than or equal to timestamp
        lte:
          type: string
          format: date-time
          example: '2024-08-08T10:00:00Z'
          description: Less than or equal to timestamp
        between:
          allOf:
          - $ref: '#/components/schemas/TimestampFilterTimestampRange'
          - description: Between two timestamps (inclusive)
        isNull:
          type: boolean
          description: Check if field is null
        relativeDays:
          type: integer
          format: int32
          example: -7
          description: Relative days from now (negative for past, positive for future)
    TransactionEndpoint:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - FIAT
          - CRYPTO
          description: Endpoint type
        walletId:
          type: string
          nullable: true
          description: Wallet identifier (e.g. `RIP0000001`). Present when type is `CRYPTO`.
        address:
          type: string
          nullable: true
          description: 'The customer''s on-chain address on this leg. Present when type is `CRYPTO`

            and the on-chain leg has been initiated. EVM addresses include the `0x` prefix.

            '
        chain:
          type: string
          nullable: true
          description: Blockchain network name (e.g. XRPL, ETH). Present when type is `CRYPTO`.
        transactionHash:
          type: string
          nullable: true
          description: 'On-chain transaction hash for this leg. Present when type is `CRYPTO` and the on-chain leg has settled.

            EVM chains (e.g. ETH) return the hash with the `0x` prefix; XRPL hashes are

            uppercase hex without a prefix.

            '
        counterpartyAddress:
          type: string
          nullable: true
          description: 'The Ripple-side internal account address that participated in this on-chain leg

            (the counterparty to your wallet). Present when type is `CRYPTO` and the on-chain leg

            has been initiated. EVM addresses include the `0x` prefix.

            '
    v2FreezeHistoryEntry:
      type: object
      properties:
        id:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: Unique identifier for this history entry
        action:
          allOf:
          - $ref: '#/components/schemas/v2FreezeAction'
          - type: string
            example: FREEZE_ACTION_FREEZE
            description: The action taken (FREEZE or UNFREEZE)
        reason:
          type: string
          example: Transaction frozen due to suspicious activity pattern
          description: Reason for the freeze or unfreeze action
        userId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: User who performed the action (empty for automatic actions)
        organizationId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: Organization of the user who performed the action (empty for automatic actions)
        performedAt:
          type: string
          format: date-time
          example: '2022-03-29T10:22:22.420Z'
          description: Timestamp when the action was performed
        freezeType:
          allOf:
          - $ref: '#/components/schemas/v2FreezeType'
          - type: string
            example: FREEZE_TYPE_AUTO_RISK
            description: Type of freeze (required for FREEZE actions, shows original type for UNFREEZE)
        riskScore:
          type: number
          format: double
          example: 85.5
          description: Risk score that triggered auto-freeze (0-100)
    v2FreezeInfo:
      type: object
      properties:
        isFrozen:
          type: boolean
          example: false
          description: Whether the transaction is currently frozen
        history:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/v2FreezeHistoryEntry'
            - type: object
          description: History of all freeze/unfreeze actions. Latest entry contains current state details when frozen.
    v2SigningPayload:
      type: object
      properties:
        inputIndex:
          type: integer
          format: int64
          example: 0
          description: The index of the UTXO input this signing payload corresponds to
        signingHash:
          type: string
          example: 30674cddb3025f9681839c63d20357f54e914bd7a9ddfe53a6691f4a530a5671
          description: The signing hash for this UTXO input
        signature:
          type: string
          example: 3046022100c60dc1337d69261e7c7e92e4dac78e0c317d444d4690be2b86cc53b1989d1b0602210090c63e3a5cf692c9387292451fada038a0e4d85a2f5c91ee1e7a635df0440b43
          description: The signature for this UTXO input
        walletId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The wallet ID that owns this signing payload. If omitted, signers use the parent transaction wallet. Native multi-wallet transactions must set this on every signing payload.
      required:
      - inputIndex
      - signingHash
    v2AssetSource:
      type: string
      enum:
      - ASSET_SOURCE_LEGACY
      - ASSET_SOURCE_AUTO
      - ASSET_SOURCE_COINGECKO
      - ASSET_SOURCE_PALISADE
      - ASSET_SOURCE_CUSTOMER
    v2AssetChangePurpose:
      type: string
      enum:
      - FEE
      - TRANSFER
    v2FilterResponse:
      type: object
      properties:
        previousPageToken:
          type: string
          example: cGFnZV9zaXplPTEwJnBhZ2VfdG9rZW49MjA=
          description: The token to retrieve the previous page of results
        nextPageToken:
          type: string
          example: cGFnZV9zaXplPTEwJnBhZ2VfdG9rZW49MjA=
          description: The token to retrieve the next page of results
        total:
          type: integer
          format: int32
          example: 100
          description: The total number of results
      required:
      - total
    UpdateTransactionDestination:
      type: object
      required:
      - type
      description: 'Approval payload for a `PENDING` (flexible redemption) transaction. `FIAT` directs the

        redemption to your default bank account (creates a `REDEMPTION`); `CRYPTO` bridges the funds

        to one of your wallets (creates a `BRIDGE`) and requires `walletId`.

        '
      properties:
        type:
          type: string
          enum:
          - FIAT
          - CRYPTO
          description: 'Destination type. `FIAT` creates a `REDEMPTION` settled to your default bank account;

            `CRYPTO` creates a `BRIDGE` transfer to one of your wallets.

            '
        walletId:
          type: string
          description: 'Target wallet identifier (e.g. `RIP0000001`). Required when `type` is `CRYPTO`;

            must be omitted when `type` is `FIAT`.

            '
    v2EvmFeeEstimate:
      type: object
      properties:
        gasPrice:
          type: string
          format: uint64
          example: '155'
          description: Gas price in wei (base_fee + priority_fee)
        baseFee:
          type: string
          format: uint64
          example: '155'
          description: Base Fee in wei
        priorityFee:
          type: string
          format: uint64
          example: '155'
          description: Average priority Fee in wei
        gasLimit:
          type: string
          format: uint64
          example: '21000'
          description: Gas limit
      required:
      - gasPrice
      - baseFee
      - priorityFee
      - gasLimit
    v2Blockchain:
      type: string
      enum:
      - AVALANCHE
      - ETHEREUM
      - XRP_LEDGER
      - POLYGON
      - BNBCHAIN
      - BASE
      - HEDERA
      - ARBITRUM
      - ONE_MONEY
      - SOLANA
      - TRON
      - BITCOIN
    v2FeeEstimate:
      type: object
      properties:
        evm:
          allOf:
          - $ref: '#/components/schemas/v2EvmFeeEstimate'
          - type: object
            example:
              gas_price: '0.007'
              base_fee: '155.672'
              priority_fee: '0.001'
              gas_limit: 21000
            description: EVM specific fee estimates
        networkFees:
          type: object
          example:
            slowest: '0.00001'
            slow: '0.00005'
            medium: '0.00010'
            fast: '0.00015'
            fastest: '0.0002'
          additionalProperties:
            type: string
          description: Map of fee options where keys are fee types (slowest, slow, medium, fast, fastest) and values are the fee amounts in base asset units
      required:
      - networkFees
    v2NumericFilter:
      type: object
      properties:
        eq:
          type: string
          description: Equals
        notEq:
          type: string
          description: Not equal to
        in:
          type: array
          items:
            type: string
          description: Value is in the list
        notIn:
          type: array
          items:
            type: string
          description: Value is not in the list
        isNull:
          type: boolean
          description: Check if field is null
        gt:
          type: string
          description: Greater than
        gte:
          type: string
          description: Greater than or equal to
        lt:
          type: string
          description: Less than
        lte:
          type: string
          description: Less than or equal to
    v2EstimateTransferFeeRequest:
      type: object
      properties:
        blockchain:
          allOf:
          - $ref: '#/components/schemas/v2Blockchain'
          - type: string
            example: ETHEREUM
        contract:
          type: string
          example: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          description: The contract/issuing address
        symbol:
          type: string
          example: USD
          description: The asset symbol
        originAddress:
          type: string
          example: '0x55502b9d5a68b0F8a48384352295BeD968aD8AA4'
          description: The origin address
        destinationAddress:
          type: string
          example: TLsV52sRDL79HXGGm9yzwKibb6BeruhUzy
          description: Optional destination address. When provided, allows for more accurate fee estimation on chains where transfer costs vary based on recipient state (e.g., TRON, Solana).
      required:
      - blockchain
      - symbol
      - originAddress
    v2ListTransactionsRequest:
      type: object
      properties:
        filter:
          allOf:
          - $ref: '#/components/schemas/v2TransactionFilter'
          - description: 'Optional filters: status, type, blockchain, asset_symbol, created_at range, updated_at range, qty range, origin_address, destination_address, transaction_id, transaction_hash, external_id, correlation_id. Each sub-filter is AND-ed.'
        pagination:
          allOf:
          - $ref: '#/components/schemas/v2FilterRequest'
          - description: 'Pagination and sorting. Sortable fields: created_at, updated_at, amount, status.'
        search:
          type: string
          example: '0x55502b9d5a68b0F8a48384352295BeD968aD8AA4'
          description: Case-insensitive free-text search over transaction ID, transaction hash, external ID, correlation ID, asset symbol, origin address, and destination address.
    v2Problem:
      type: object
      properties:
        code:
          type: integer
          format: int32
        reason:
          type: string
        domain:
          type: string
        message:
          type: string
        retryability:
          $ref: '#/components/schemas/v2Retryability'
        metadata:
          type: object
          additionalProperties:
            type: string
    v2Retryability:
      type: string
      enum:
      - RETRYABLE
      - NOT_RETRYABLE
    v2AssetChange:
      type: object
      properties:
        purpose:
          allOf:
          - $ref: '#/components/schemas/v2AssetChangePurpose'
          - type: string
            example: TRANSFER
            description: Purpose of this asset change
        asset:
          allOf:
          - $ref: '#/components/schemas/commonv2Asset'
          - type: object
            description: The asset that is part of this change
        qty:
          type: string
          example: '155.672'
          description: The quantity of the asset to transfer
        source:
          allOf:
          - $ref: '#/components/schemas/v2AssetChangeWallet'
          - type: string
            description: Source of this asset change
        destination:
          allOf:
          - $ref: '#/components/schemas/v2AssetChangeWallet'
          - type: string
            description: Destination of this asset change
      required:
      - purpose
      - asset
      - qty
    v2TransactionFilter:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/v2TransactionStatusFilter'
          - description: Filter by transaction status using enum names such as CONFIRMED or FAILED
        blockchain:
          allOf:
          - $ref: '#/components/schemas/v2BlockchainFilter'
          - description: Filter by blockchain using common.v2.Blockchain enum names such as ETHEREUM or BITCOIN
        assetSymbol:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Filter by asset symbol (e.g. ETH, BTC, USDC)
        createdAt:
          allOf:
          - $ref: '#/components/schemas/v2TimestampFilter'
          - description: Filter by creation timestamp; supports before/after, between, relative_days
        qty:
          allOf:
          - $ref: '#/components/schemas/v2NumericFilter'
          - description: Filter by transferred quantity as an arbitrary precision numeric string; supports eq/not_eq/in/not_in/gt/gte/lt/lte.
        originAddress:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Filter by origin (sending) address (case-insensitive)
        destinationAddress:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Filter by destination (receiving) address (case-insensitive)
        transactionId:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Search by Palisade transaction ID (UUID). Supports eq/in/contains.
        transactionHash:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Search by on-chain transaction hash (case-insensitive). Supports eq/in only.
        externalId:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Search by customer-assigned external transaction ID. Supports eq/in/contains.
        updatedAt:
          allOf:
          - $ref: '#/components/schemas/v2TimestampFilter'
          - description: Filter by last-update timestamp; supports before/after, between, relative_days. Mirrors the updated_at sort field.
        correlationId:
          allOf:
          - $ref: '#/components/schemas/v2StringFilter'
          - description: Filter by correlation ID. Supports eq/in/contains.
        type:
          allOf:
          - $ref: '#/components/schemas/v2TransactionActionFilter'
          - description: Filter by transaction type using enum names such as PALISADE_TRANSFER or WEB3_SIGN
    v2FreezeAction:
      type: string
      enum:
      - FREEZE_ACTION_FREEZE
      - FREEZE_ACTION_UNFREEZE
    transactionsv2TransactionAction:
      type: string
      enum:
      - DEPOSIT
      - WITHDRAWAL
      - WEB3_RAW
      - WEB3_SIGN
      - PASSKEY_RAW
      - PASSKEY_SIGN
      - PALISADE_TRANSFER
      - PALISADE_RAW
      - PALISADE_MANAGED
      - PALISADE_SIGN_PLAINTEXT
      - PALISADE_SWEEP
    v2StringFilter:
      type: object
      properties:
        eq:
          type: string
          description: Exact match
        notEq:
          type: string
          description: Not equal to
        contains:
          type: string
          description: Contains substring (case-insensitive)
        startsWith:
          type: string
          description: Starts with prefix (case-insensitive)
        endsWith:
          type: string
          description: Ends with suffix (case-insensitive)
        in:
          type: array
          items:
            type: string
          description: Value is in the list
        notIn:
          type: array
          items:
            type: string
          description: Value is not in the list
        isNull:
          type: boolean
          description: Check if field is null
    Transaction:
      type: object
      required:
      - id
      - status
      - amount
      - token
      - source
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
        type:
          type: string
          enum:
          - ISSUANCE
          - REDEMPTION
          - BRIDGE
          nullable: true
          description: 'Transaction type. Null while the transaction is `PENDING` (flexible redemption)

            and a destination has not yet been chosen.

            '
        status:
          type: string
          enum:
          - PROCESSING
          - PENDING
          - COMPLETED
          - FAILED
          - CANCELED
          description: 'Current transaction status. `COMPLETED`, `FAILED`, and `CANCELED` are terminal.

            `CANCELED` currently applies to `ISSUANCE` transactions canceled before settlement.

            `PENDING` applies to flexible-redemption transactions awaiting approval via

            [Approve a pending redemption](#operation/updateTransactionDestination); `type` and

            `destination` are null until approved.

            '
        amount:
          type: string
          description: Transaction amount as a decimal string (e.g. "10000.00")
        token:
          type: string
          enum:
          - RLUSD
          description: Always RLUSD
        source:
          $ref: '#/components/schemas/TransactionEndpoint'
        destination:
          nullable: true
          description: 'Destination endpoint. Null while the transaction is `PENDING` (flexible redemption)

            and a destination has not yet been chosen.

            '
          allOf:
          - $ref: '#/components/schemas/TransactionEndpoint'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the transaction was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the transaction was last updated
    v2SortOrder:
      type: string
      enum:
      - SORT_ORDER_ASC
      - SORT_ORDER_DESC
    v2ListTransactionsResponse:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/v2FilterResponse'
        transactions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/transactionsv2Transaction'
            - type: object
    v2BlockchainFilter:
      type: object
      properties:
        eq:
          allOf:
          - $ref: '#/components/schemas/v2Blockchain'
          - description: Exact blockchain match
        notEq:
          allOf:
          - $ref: '#/components/schemas/v2Blockchain'
          - description: Exclude this blockchain
        in:
          type: array
          items:
            $ref: '#/components/schemas/v2Blockchain'
          description: Blockchain is in this list
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/v2Blockchain'
          description: Blockchain is not in this list
    v2AssetChangeWallet:
      type: object
      properties:
        address:
          type: string
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          description: The blockchain address of the wallet
        walletId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The wallet ID that is part of this change, populated only if it belongs to the same organization that is party to the transaction
        subAccountAddress:
          type: string
          example: CaVHtunHxQfGYVKJ4WzUe1217UTCrREh3hg2RW8cS2Gk
          description: The Rosetta SubAccount address (e.g., SPL token account address for Solana, contract-specific state address for other chains). This represents the actual on-chain address where the asset resides, while 'address' contains the owner wallet address.
        vaultId:
          type: string
          example: ce4918bf-a199-4ce2-85a3-d0d296855384
          description: The vault ID for the wallet that is part of this change, populated only if it belongs to the same organization that is party to the transaction
      required:
      - address
    v2FilterRequest:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          example: 50
          description: Number of results per page (default 50, max 1000)
        pageToken:
          type: string
          example: cGFnZV9zaXplPTEwJnBhZ2VfdG9rZW49MjA=
          description: Token for pagination from previous response
        orderBy:
          type: string
          example: created_at
          description: Field to order results by
        order:
          allOf:
          - $ref: '#/components/schemas/v2SortOrder'
          - description: Sort order (ASC or DESC)
    transactionsv2TransactionStatus:
      type: string
      enum:
      - REQUESTED
      - POLICY_CHECK_PENDING
      - POLICY_CHECK_PASSED
      - APPROVAL_CHECK_PENDING
      - APPROVAL_CHECK_PASSED
      - COMPILATION_PENDING
      - COMPILED
      - SIGNATURE_PENDING
      - SIGNED
      - PUBLISH_PENDING
      - PUBLISHED
      - CONFIRMATION_PENDING
      - CONFIRMED
      - REJECTED
      - FAILED
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/protobufAny'
            - type: object
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 'The request conflicts with the current state of the transaction — e.g. approving a

        transaction that was never `PENDING`, or supplying a different destination than one

        already chosen.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or expired access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Insufficient scope for the requested operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    TokenAuth:
      type: apiKey
      name: Authorization
      in: header
externalDocs:
  description: Click here for the API docs
  url: https://palisade.readme.io
