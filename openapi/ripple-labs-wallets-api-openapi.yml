      parameters:
      - name: vaultId
        description: The vault ID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: USD Issuing wallet
                  description: The name of the wallet
                description:
                  type: string
                  example: Main USD issuing account used internally
                  description: The description of the wallet
                quorumId:
                  type: string
                  example: ce4918bf-a199-4ce2-85a3-d0d296855384
                  description: The quorum ID
                blockchain:
                  allOf:
                  - $ref: '#/components/schemas/v2Blockchain'
                  - type: string
                    example: ETHEREUM
                    description: The blockchain of the wallet
                keystore:
                  allOf:
                  - $ref: '#/components/schemas/v2Keystore'
                  - type: string
                    example: HSM
                    description: The keystore of the wallet
                recoveryPublicKey:
                  type: string
                  example: 
                  description: Optional, hex encoded PKCS1 formatted public key of a 4096-bit RSA private key
                externalId:
                  type: string
                  example: ce4918bf-a199-4ce2-85a3-d0d296855384
                  description: External ID of this wallet, unique to the organization
                correlationId:
                  type: string
                  example: ce4918bf-a199-4ce2-85a3-d0d296855384
                  description: Correlation ID for tracking correlations with the wallet
                walletType:
                  allOf:
                  - $ref: '#/components/schemas/v2WalletType'
                  - type: string
                    example: WALLET_TYPE_BLOCKCHAIN
                    description: The type of wallet to create. Defaults to BLOCKCHAIN if not specified.
                keyAlgorithm:
                  allOf:
                  - $ref: '#/components/schemas/v2KeyAlgorithm'
                  - type: string
                    example: SECP256K1
                    description: The key algorithm of the wallet
              required:
              - name
              - keystore
        required: true
      tags:
      - Wallets
